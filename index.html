<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>राधा</title>
<!-- Noto Serif Devanagari now ships with the app instead of loading from
     Google, so the Devanagari renders with no internet. Same family, same
     weights (500/600), same unicode-ranges as the stylesheet it replaces. -->
<link rel="stylesheet" href="fonts/noto-serif-devanagari.css">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="राधा">
<style>
  :root{
    --bg:#121110;--surface:#1C1A18;--surface2:#232120;--line:#2E2A26;
    --text:#EDE7DD;--muted:#918878;--gold:#C9A227;--red:#B4462F;--pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.4;overscroll-behavior:none;
    display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  .dv{font-family:"Noto Serif Devanagari","Noto Sans Devanagari",serif}

  .topbar{display:flex;align-items:center;gap:4px;
    padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .icon-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:10px}
  .icon-btn:active{background:var(--surface2)}
  .icon-btn[hidden]{display:none}
  .title{flex:1;min-width:0;font-size:19px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .crumb{display:block;font-size:11px;color:var(--muted);font-weight:400;
    letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:180px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px var(--pad) 0}
  .tile{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-end;padding:13px;
    text-align:left;border:1px solid rgba(201,162,39,.16);transition:transform .12s}
  .tile:active{transform:scale(.975)}
  .tile::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.09),transparent 62%)}
  .tile.pointed{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tile-hi{position:relative;font-size:17.5px;font-weight:600;color:#F0E2B8;line-height:1.34}
  .tile-range{position:relative;font-size:14px;color:rgba(240,226,184,.8);
    margin-top:3px;font-variant-numeric:tabular-nums}
  .tile-note{position:relative;display:flex;align-items:center;gap:6px;margin-top:8px;
    font-size:11px;color:rgba(240,226,184,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile-note i{flex:0 0 6px;height:6px;border-radius:50%;background:var(--gold)}

  .libtile{margin:10px var(--pad) 0;display:flex;align-items:center;gap:14px;
    width:calc(100% - 2*var(--pad));padding:18px 16px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);text-align:left}
  .libtile:active{background:var(--surface2)}
  .libtile .meta{flex:1;min-width:0}
  .libtile .name{font-size:16.5px;font-weight:600}
  .libtile .sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  .row{display:flex;align-items:center;gap:14px;padding:13px var(--pad);
    border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;
    width:100%;text-align:left}
  .row:active{background:var(--surface)}
  .row.current .name,.row.current .glyph{color:var(--gold)}
  .row.pointed{background:rgba(201,162,39,.07)}
  .row.pointed .name{color:var(--gold)}
  .glyph{flex:0 0 24px;display:grid;place-items:center;color:var(--muted)}
  .meta{flex:1;min-width:0}
  .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
  .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .sub .mark{color:var(--gold)}
  .track-bar{height:2px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
  .track-bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
  .empty{padding:44px 30px;text-align:center;color:var(--muted);font-size:14px}
  .empty b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:8px}

  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1A1508;
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:20;
    transition:transform .12s}
  .fab:active{transform:scale(.93)}
  .fab[hidden]{display:none}
  body.player-open .fab{display:none}
  body.has-mini .fab{bottom:calc(env(safe-area-inset-bottom) + 92px)}

  .mini{position:fixed;left:0;right:0;bottom:0;
    padding:0 6px calc(env(safe-area-inset-bottom) + 6px);z-index:18}
  .mini[hidden]{display:none}
  .mini-inner{background:var(--surface2);border:1px solid var(--line);border-radius:14px;
    display:flex;align-items:center;gap:10px;padding:9px 8px 9px 14px}
  .mini .name{font-size:14.5px}
  .mini .sub{font-size:11.5px;margin-top:2px}
  .mini-prog{height:2px;background:var(--line);margin:7px 6px 0;border-radius:2px;overflow:hidden}
  .mini-prog i{display:block;height:100%;background:var(--gold)}

  .player{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 24px calc(env(safe-area-inset-bottom) + 26px);
    transform:translateY(100%);transition:transform .26s ease}
  body.player-open .player{transform:translateY(0)}
  .disc{flex:1;display:grid;place-items:center;padding:12px 0;min-height:0}
  .disc svg{width:min(56vw,220px);height:auto}
  .disc .spin{transform-origin:50% 50%;animation:rot 6s linear infinite;animation-play-state:paused}
  body.playing .disc .spin{animation-play-state:running}
  @keyframes rot{to{transform:rotate(360deg)}}
  .now-name{font-size:20px;font-weight:600;text-align:center;margin:0 0 6px;overflow-wrap:anywhere}
  .now-folder{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.4px;margin-bottom:18px}
  .seek{width:100%;appearance:none;background:transparent;height:34px;display:block}
  .seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(var(--gold),var(--gold)) left/var(--fill,0%) 100% no-repeat,var(--line)}
  .seek::-moz-range-track{height:4px;border-radius:4px;
    background:linear-gradient(var(--gold),var(--gold)) left/var(--fill,0%) 100% no-repeat,var(--line)}
  .seek::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--gold);margin-top:-6px}
  .seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--gold)}
  .times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;margin-top:-4px}
  .transport{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:20px}
  .big{width:74px;height:74px;border-radius:50%;background:var(--gold);color:#1A1508;
    display:grid;place-items:center}
  .big:active{transform:scale(.95)}
  .skip{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--line);position:relative}
  .skip span{position:absolute;font-size:9.5px;bottom:9px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chainline{text-align:center;font-size:12.5px;color:var(--gold);
    min-height:18px;margin-top:12px;font-variant-numeric:tabular-nums}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;
    pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
    border-radius:18px 18px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px);
    transform:translateY(110%);transition:transform .22s ease;max-height:80dvh;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 10px}
  .sheet h3{margin:4px 22px 12px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item{display:flex;align-items:center;gap:16px;padding:15px 22px;width:100%;text-align:left}
  .item:active{background:var(--surface2)}
  .item.danger{color:var(--red)}
  .item .glyph{color:inherit}
  .item .sub2{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .toggle{display:flex;align-items:center;gap:16px;padding:14px 22px;width:100%;text-align:left}
  .toggle .meta{flex:1}
  .toggle .sub{white-space:normal;margin-top:2px}
  .sw{flex:0 0 50px;width:50px;height:30px;border-radius:15px;background:var(--line);
    position:relative;transition:background .16s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:var(--muted);transition:.16s}
  .sw.on{background:rgba(201,162,39,.35)}
  .sw.on::after{left:23px;background:var(--gold)}

  .dlg{position:fixed;left:16px;right:16px;top:20%;z-index:42;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:20px;opacity:0;
    pointer-events:none;transform:scale(.96);transition:.15s}
  .dlg.on{opacity:1;pointer-events:auto;transform:scale(1)}
  .dlg h3{margin:0 0 14px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)}
  .dlg input{width:100%;padding:12px 14px;border-radius:10px;background:var(--bg);
    border:1px solid var(--line);color:var(--text)}
  .dlg input:focus{outline:none;border-color:var(--gold)}
  .dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .dlg-btns button{padding:10px 18px;border-radius:9px;font-weight:600;font-size:15px}
  .dlg-btns .go{background:var(--gold);color:#1A1508}
  .dlg-btns .cancel{color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,14px);
    background:var(--surface2);border:1px solid var(--line);padding:11px 18px;
    border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;
    transition:.2s;max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="backBtn" hidden aria-label="Back">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="title dv" id="pageTitle">राधा<span class="crumb" id="crumb"></span></div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 3.6 1.65 1.65 0 0010 2.09V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 8a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
  </button>
</header>

<main class="scroll" id="list"></main>

<button class="fab" id="fab" hidden aria-label="Add">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="mini" id="mini" hidden>
  <div class="mini-inner">
    <div class="meta" id="miniOpen">
      <span class="name" id="miniName">—</span>
      <span class="sub" id="miniSub">0:00</span>
    </div>
    <button class="icon-btn" id="miniPlay" aria-label="Play or pause"></button>
  </div>
  <div class="mini-prog"><i id="miniProg" style="width:0%"></i></div>
</div>

<section class="player" id="player">
  <div>
    <button class="icon-btn" id="playerClose" aria-label="Close player">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="disc">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <g class="spin">
        <circle cx="100" cy="100" r="96" fill="#191614"/>
        <g fill="none" stroke="#232020" stroke-width="1.2">
          <circle cx="100" cy="100" r="86"/><circle cx="100" cy="100" r="79"/>
          <circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="65"/>
          <circle cx="100" cy="100" r="58"/>
        </g>
        <circle cx="100" cy="100" r="46" fill="#6E1F1F" id="discLabel"/>
        <circle cx="100" cy="100" r="46" fill="none" stroke="#C9A227" stroke-width="1" opacity=".55"/>
        <circle cx="100" cy="100" r="5" fill="#121110"/>
      </g>
      <circle cx="100" cy="100" r="96" fill="none" stroke="#C9A227" stroke-width="3"
        stroke-linecap="round" transform="rotate(-90 100 100)" id="ring"
        stroke-dasharray="603" stroke-dashoffset="603"/>
    </svg>
  </div>
  <h2 class="now-name" id="nowName">—</h2>
  <div class="now-folder" id="nowFolder"></div>
  <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="transport">
    <button class="skip" id="back30" aria-label="Back 30 seconds">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/></svg><span>30</span>
    </button>
    <button class="big" id="bigPlay" aria-label="Play or pause"></button>
    <button class="skip" id="fwd30" aria-label="Forward 30 seconds">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-9-9"/><path d="M21 4v5h-5"/></svg><span>30</span>
    </button>
  </div>
  <div class="chainline" id="chainLine"></div>
</section>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <button class="item" id="actNewFolder">
    <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg></span>New folder
  </button>
  <button class="item" id="actUpload">
    <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></span>Upload songs
  </button>
</div>

<div class="sheet" id="itemSheet">
  <div class="grab"></div>
  <h3 id="itemSheetTitle">Item</h3>
  <button class="item" id="actRename">
    <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></span>Rename
  </button>
  <button class="item" id="actClearMark">
    <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/></svg></span>Start from beginning
  </button>
  <button class="item danger" id="actDelete">
    <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg></span>Delete
  </button>
</div>

<div class="sheet" id="resumeSheet">
  <div class="grab"></div>
  <h3 id="resumeTitle">श्री हित सेवक वाणी</h3>
  <button class="item" id="actResume">
    <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
    <span><span id="resumeLabel">Resume</span><span class="sub2" id="resumeAt"></span></span>
  </button>
  <button class="item" id="actFromStart">
    <span class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/></svg></span>Play from start
  </button>
</div>

<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h3>Settings</h3>
  <button class="toggle" id="autoplayRow">
    <span class="meta">
      <span class="name">Autoplay</span>
      <span class="sub">In My Library only — plays the next song in the same folder. The six collections follow their own order.</span>
    </span>
    <span class="sw" id="autoplaySw"></span>
  </button>
  <div class="toggle">
    <span class="meta"><span class="name">Storage used</span>
    <span class="sub" id="storageLine">Checking…</span></span>
  </div>
</div>

<div class="dlg" id="dlg">
  <h3 id="dlgTitle">Rename</h3>
  <input id="dlgInput" type="text" autocomplete="off" spellcheck="false">
  <div class="dlg-btns">
    <button class="cancel" id="dlgCancel">Cancel</button>
    <button class="go" id="dlgOk">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept="audio/*" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script>
(function(){
"use strict";

const FALLBACK={collections:[],rsnSequence:[],rules:{aratiChainGapSeconds:10,rsnFinishedWithinSeconds:60}};

/* ---------- db ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("baithak",1);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains("nodes")) d.createObjectStore("nodes",{keyPath:"id"}).createIndex("parent","parentId");
    if(!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs");
    if(!d.objectStoreNames.contains("marks")) d.createObjectStore("marks");
    if(!d.objectStoreNames.contains("meta"))  d.createObjectStore("meta");};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error);});
const put=(s,v,k)=>rq(st(s,"readwrite").put(v,k));
const get=(s,k)=>rq(st(s,"readonly").get(k));
const del=(s,k)=>rq(st(s,"readwrite").delete(k));
const kids=p=>rq(st("nodes","readonly").index("parent").getAll(p));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- state ---------- */
const S={man:FALLBACK,view:"home",cwd:"root",stack:[],coll:null,
  autoplay:true,queue:[],qi:-1,cur:null,target:null,rsnPtr:0,rsnSeq:[]};
const $=i=>document.getElementById(i);
const audio=$("audio");

function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")
          :m+":"+String(x).padStart(2,"0");}
const noExt=n=>n.replace(/\.(mp3|m4a|aac|wav|ogg|opus|flac|mp4|webm)$/i,"");
function bytes(b){return b<1048576?(b/1024).toFixed(0)+" KB"
  :b<1073741824?(b/1048576).toFixed(1)+" MB":(b/1073741824).toFixed(2)+" GB";}
let tT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),2400);}
const PLAY='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const PAUSE='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
const NOTE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>';
const FOLDER='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';

function longPress(el,fn){let t=null,f=false;
  const s=()=>{f=false;t=setTimeout(()=>{f=true;t=null;if(navigator.vibrate)navigator.vibrate(15);fn();},480);};
  const c=()=>{if(t){clearTimeout(t);t=null;}};
  el.addEventListener("touchstart",s,{passive:true});
  el.addEventListener("touchmove",c,{passive:true});
  el.addEventListener("touchend",c);el.addEventListener("touchcancel",c);
  el.addEventListener("mousedown",s);el.addEventListener("mouseup",c);el.addEventListener("mouseleave",c);
  el.addEventListener("contextmenu",e=>{e.preventDefault();if(!f)fn();});
  el.addEventListener("click",e=>{if(f){e.preventDefault();e.stopPropagation();f=false;}},true);}

/* ---------- ids & sequence ---------- */
const tid=(c,f)=>"fx:"+c+":"+f;
function buildSeq(){
  S.rsnSeq=[];
  for(const cid of (S.man.rsnSequence||[])){
    const c=S.man.collections.find(x=>x.id===cid); if(!c) continue;
    c.tracks.forEach((t,i)=>S.rsnSeq.push({collId:c.id,idx:i,id:tid(c.id,t.file),name:t.title,coll:c,track:t}));
  }
}
const ptrEntry=()=>S.rsnSeq[S.rsnPtr]||null;
async function advancePtr(){
  S.rsnPtr=(S.rsnPtr+1)%(S.rsnSeq.length||1);
  await put("meta",S.rsnPtr,"rsn:pointer");
}

/* ---------- render ---------- */
async function render(){
  const L=$("list"); L.innerHTML="";
  $("backBtn").hidden = S.view==="home";
  $("fab").hidden = !(S.view==="library");

  if(S.view==="home"){
    $("pageTitle").firstChild.nodeValue="राधा";
    $("pageTitle").classList.add("dv");
    $("crumb").textContent="";
    await renderTiles(L);
    return;
  }
  if(S.view==="collection"){
    $("pageTitle").firstChild.nodeValue=S.coll.title;
    $("pageTitle").classList.add("dv");
    $("crumb").textContent=S.coll.range||"";
    await renderColl(S.coll,L);
    return;
  }
  $("pageTitle").classList.remove("dv");
  if(S.stack.length){
    $("pageTitle").firstChild.nodeValue=S.stack[S.stack.length-1].name;
    $("crumb").textContent="My Library / "+S.stack.map(x=>x.name).join(" / ");
  }else{
    $("pageTitle").firstChild.nodeValue="My Library";
    $("crumb").textContent="";
  }
  await renderUser(L);
}

async function renderTiles(L){
  const grid=document.createElement("div"); grid.className="tiles";
  const pe=ptrEntry();
  for(const c of S.man.collections){
    const t=document.createElement("button");
    t.className="tile"+(c.mode==="rsn"&&pe&&pe.collId===c.id?" pointed":"");
    t.style.background=c.tint||"#3A2A22";
    t.innerHTML='<span class="tile-hi dv"></span>'+(c.range?'<span class="tile-range"></span>':'')+
      '<span class="tile-note"></span>';
    t.querySelector(".tile-hi").textContent=c.title;
    if(c.range) t.querySelector(".tile-range").textContent=c.range;

    const note=t.querySelector(".tile-note");
    if(c.mode==="rsn"&&pe&&pe.collId===c.id){
      note.innerHTML='<i></i><span class="dv"></span>';
      note.querySelector("span").textContent=pe.name;
    }else if(c.mode==="single"){
      const m=await get("marks",tid(c.id,c.tracks[0].file));
      if(m&&m.pos>15){note.innerHTML='<i></i><span></span>';
        note.querySelector("span").textContent="Resume "+fmt(m.pos);}
    }else{
      const last=await get("meta","last:"+c.id);
      if(last){note.innerHTML='<i></i><span class="dv"></span>';
        note.querySelector("span").textContent=last.name;}
    }
    t.addEventListener("click",()=>openTile(c));
    grid.appendChild(t);
  }
  L.appendChild(grid);

  const lib=document.createElement("button");
  lib.className="libtile";
  const n=(await kids("root")).length;
  lib.innerHTML='<span class="glyph">'+FOLDER+'</span><span class="meta">'+
    '<span class="name">My Library</span><span class="sub">'+
    (n?n+" item"+(n>1?"s":""):"Add your own songs and folders")+'</span></span>'+
    '<span class="glyph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>';
  lib.addEventListener("click",()=>{S.view="library";S.cwd="root";S.stack=[];$("list").scrollTop=0;render();});
  L.appendChild(lib);
}

async function renderColl(c,L){
  if(!c.tracks.length){L.innerHTML='<div class="empty"><b>No recordings yet</b>Add the files to audio/'+c.id+'/ in the repo.</div>';return;}
  const pe=ptrEntry();
  for(let i=0;i<c.tracks.length;i++){
    const t=c.tracks[i], id=tid(c.id,t.file);
    const row=document.createElement("button");
    row.className="row"+(S.cur&&S.cur.id===id?" current":"")
      +(c.mode==="rsn"&&pe&&pe.id===id?" pointed":"");
    row.innerHTML='<span class="glyph">'+NOTE+'</span>';
    const meta=document.createElement("span"); meta.className="meta";
    const nm=document.createElement("span"); nm.className="name dv"; nm.textContent=t.title;
    meta.appendChild(nm);
    const mark=await get("marks",id), dur=await get("meta","dur:"+id);
    const sub=document.createElement("span"); sub.className="sub";
    if(mark&&mark.pos>15) sub.innerHTML='<span class="mark">Resume '+fmt(mark.pos)+'</span>'+(dur?' · '+fmt(dur):'');
    else sub.textContent=dur?fmt(dur):"Tap to play";
    meta.appendChild(sub);
    if(mark&&dur&&mark.pos>15){const b=document.createElement("span");b.className="track-bar";
      const ii=document.createElement("i");ii.style.width=Math.min(100,mark.pos/dur*100)+"%";
      b.appendChild(ii);meta.appendChild(b);}
    row.appendChild(meta);
    row.addEventListener("click",()=>playFixed(c,i));
    longPress(row,()=>openItemSheet({kind:"fixed",id,name:t.title}));
    L.appendChild(row);
  }
}

async function renderUser(L){
  const list=await kids(S.cwd);
  list.sort((a,b)=>a.type!==b.type?(a.type==="folder"?-1:1)
    :a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));
  if(!list.length){const e=document.createElement("div");e.className="empty";
    e.innerHTML='<b>Nothing here yet</b>Tap + to make a folder or add songs.';L.appendChild(e);return;}
  for(const n of list){
    const row=document.createElement("button");
    row.className="row"+(S.cur&&S.cur.id===n.id?" current":"");
    row.innerHTML='<span class="glyph">'+(n.type==="folder"?FOLDER:NOTE)+'</span>';
    const meta=document.createElement("span");meta.className="meta";
    const nm=document.createElement("span");nm.className="name";nm.textContent=n.name;
    meta.appendChild(nm);
    if(n.type==="file"){
      const mark=await get("marks",n.id);
      const sub=document.createElement("span");sub.className="sub";
      if(mark&&mark.pos>15) sub.innerHTML='<span class="mark">Resume '+fmt(mark.pos)+'</span>'+(n.duration?' · '+fmt(n.duration):'');
      else sub.textContent=n.duration?fmt(n.duration):bytes(n.size);
      meta.appendChild(sub);
      if(mark&&n.duration&&mark.pos>15){const b=document.createElement("span");b.className="track-bar";
        const ii=document.createElement("i");ii.style.width=Math.min(100,mark.pos/n.duration*100)+"%";
        b.appendChild(ii);meta.appendChild(b);}
    }
    row.appendChild(meta);
    row.addEventListener("click",()=>{
      if(n.type==="folder"){S.stack.push({id:n.id,name:n.name});S.cwd=n.id;$("list").scrollTop=0;render();return;}
      const files=list.filter(x=>x.type==="file");
      S.queue=files.map(f=>({id:f.id,name:f.name,blobId:f.id,node:f,kind:"user"}));
      S.qi=files.indexOf(n); playTrack(S.queue[S.qi]);
    });
    longPress(row,()=>openItemSheet({kind:"user",id:n.id,name:n.name,node:n}));
    L.appendChild(row);
  }
}

/* ---------- opening ---------- */
async function openTile(c){
  if(c.mode==="single"){
    const id=tid(c.id,c.tracks[0].file);
    const m=await get("marks",id);
    if(m&&m.pos>15){
      S.target={coll:c,idx:0};
      $("resumeTitle").textContent=c.title;
      $("resumeAt").textContent=fmt(m.pos);
      showSheet($("resumeSheet"));
    }else playFixed(c,0);
    return;
  }
  S.view="collection"; S.coll=c; $("list").scrollTop=0; render();
}
function goBack(){
  if(S.view==="collection"){S.view="home";S.coll=null;render();return;}
  if(S.view==="library"){
    if(S.stack.length){S.stack.pop();S.cwd=S.stack.length?S.stack[S.stack.length-1].id:"root";render();}
    else{S.view="home";render();}
  }
}

/* ---------- playback ---------- */
let objUrl=null,saveAt=0,chainTimer=null,chainTick=null,ptrDone=false;

function clearChain(){if(chainTimer){clearTimeout(chainTimer);chainTimer=null;}
  if(chainTick){clearInterval(chainTick);chainTick=null;} $("chainLine").textContent="";}

function playFixed(c,i,fromStart){
  clearChain();
  const t=c.tracks[i];
  playTrack({id:tid(c.id,t.file),name:t.title,url:t.file,coll:c,idx:i,kind:"fixed"},fromStart);
}

async function playTrack(t,fromStart){
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null;}
  let src;
  if(t.blobId){const b=await get("blobs",t.blobId);
    if(!b){toast("That file is missing from storage.");return;}
    objUrl=URL.createObjectURL(b);src=objUrl;}
  else src=t.url;

  S.cur=t; ptrDone=false;
  if(t.coll){await put("meta",{id:t.id,name:t.name},"last:"+t.coll.id);
    $("discLabel").setAttribute("fill",t.coll.tint||"#6E1F1F");}
  else $("discLabel").setAttribute("fill","#6E1F1F");

  const mark=fromStart?null:await get("marks",t.id);
  audio.src=src;
  audio.onerror=()=>toast("Could not play this file.");
  audio.onloadedmetadata=async()=>{
    if(isFinite(audio.duration)){
      if(t.node){if(Math.abs((t.node.duration||0)-audio.duration)>1){t.node.duration=audio.duration;await put("nodes",t.node);}}
      else await put("meta",audio.duration,"dur:"+t.id);
    }
    if(mark&&mark.pos>0&&mark.pos<audio.duration-3){
      audio.currentTime=mark.pos; toast("Resuming from "+fmt(mark.pos));}
    paint(); audio.play().catch(()=>{});
  };
  $("mini").hidden=false; document.body.classList.add("has-mini");
  $("miniName").textContent=t.name; $("nowName").textContent=t.name;
  $("miniName").classList.toggle("dv",!!t.coll);
  $("nowName").classList.toggle("dv",!!t.coll);
  $("nowFolder").textContent=t.coll?(t.coll.title+(t.coll.range?" "+t.coll.range:"")):"My Library";
  $("nowFolder").classList.toggle("dv",!!t.coll);
  render(); mediaMeta(t);
}

function paint(){
  const d=audio.duration||0,c=audio.currentTime||0,p=d?c/d*100:0;
  $("tCur").textContent=fmt(c);$("tDur").textContent=fmt(d);
  const s=$("seek"); if(!s.dragging) s.value=d?Math.round(c/d*1000):0;
  s.style.setProperty("--fill",p+"%");
  $("ring").style.strokeDashoffset=603-603*p/100;
  $("miniProg").style.width=p+"%";
  $("miniSub").textContent=fmt(c)+(d?" / "+fmt(d):"");
  const ic=audio.paused?PLAY:PAUSE;
  $("bigPlay").innerHTML=ic;$("miniPlay").innerHTML=ic;
  document.body.classList.toggle("playing",!audio.paused);
}

async function saveMark(){
  if(!S.cur)return; const c=audio.currentTime;
  if(!isFinite(c))return;
  if(audio.duration&&c>audio.duration-5) await del("marks",S.cur.id);
  else await put("marks",{pos:c,updated:Date.now()},S.cur.id);
}

audio.addEventListener("timeupdate",async()=>{
  paint();
  const n=Date.now(); if(n-saveAt>5000){saveAt=n;saveMark();}
  // RSN pointer: finished = inside the last minute of the pointed track
  if(!ptrDone&&S.cur&&S.cur.coll&&S.cur.coll.mode==="rsn"&&audio.duration){
    const pe=ptrEntry();
    const within=(S.man.rules&&S.man.rules.rsnFinishedWithinSeconds)||60;
    if(pe&&pe.id===S.cur.id&&audio.currentTime>=audio.duration-within){
      ptrDone=true; await advancePtr(); render();
    }
  }
});
audio.addEventListener("play",paint);
audio.addEventListener("pause",()=>{paint();saveMark();});
audio.addEventListener("ended",async()=>{
  if(S.cur) await del("marks",S.cur.id);
  const t=S.cur;
  if(t&&t.coll&&t.coll.chains){
    const pair=t.coll.chains.find(p=>p[0]===t.idx);
    if(pair){startChain(t.coll,pair[1]);return;}
  }
  if(t&&t.kind==="user"&&S.autoplay&&S.qi>-1&&S.qi+1<S.queue.length){
    S.qi++; playTrack(S.queue[S.qi]); return;
  }
  paint(); render();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveMark();});
window.addEventListener("pagehide",saveMark);

function startChain(c,nextIdx){
  const gap=(S.man.rules&&S.man.rules.aratiChainGapSeconds)||10;
  let left=gap;
  $("chainLine").textContent=c.tracks[nextIdx].title+" in "+left+"s";
  chainTick=setInterval(()=>{left--;
    if(left>0)$("chainLine").textContent=c.tracks[nextIdx].title+" in "+left+"s";},1000);
  chainTimer=setTimeout(()=>{clearChain();playFixed(c,nextIdx,true);},gap*1000);
}

function mediaMeta(t){
  if(!("mediaSession" in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:t.name,artist:t.coll?t.coll.title:"My Library",album:"राधा"});
  navigator.mediaSession.setActionHandler("play",()=>audio.play());
  navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  navigator.mediaSession.setActionHandler("seekbackward",()=>audio.currentTime-=30);
  navigator.mediaSession.setActionHandler("seekforward",()=>audio.currentTime+=30);
}

/* ---------- sheets ---------- */
let openSh=null;
function showSheet(e){openSh=e;e.classList.add("on");$("scrim").classList.add("on");}
function hideSheets(){if(openSh)openSh.classList.remove("on");openSh=null;
  $("scrim").classList.remove("on");$("dlg").classList.remove("on");}
$("scrim").addEventListener("click",hideSheets);
$("fab").addEventListener("click",()=>showSheet($("addSheet")));
$("settingsBtn").addEventListener("click",async()=>{showSheet($("setSheet"));
  if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    $("storageLine").textContent=bytes(e.usage||0)+" used";}
  else $("storageLine").textContent="Not reported by this browser";});

function openItemSheet(t){S.target=t;$("itemSheetTitle").textContent=t.name;
  const fx=t.kind==="fixed";
  $("actRename").style.display=fx?"none":"";
  $("actDelete").style.display=fx?"none":"";
  $("actClearMark").style.display=(fx||(t.node&&t.node.type==="file"))?"":"none";
  showSheet($("itemSheet"));}

$("actResume").addEventListener("click",()=>{const t=S.target;hideSheets();playFixed(t.coll,t.idx,false);});
$("actFromStart").addEventListener("click",async()=>{const t=S.target;hideSheets();
  await del("marks",tid(t.coll.id,t.coll.tracks[t.idx].file));playFixed(t.coll,t.idx,true);});

/* ---------- dialog ---------- */
let dcb=null;
function ask(title,val,cb){$("dlgTitle").textContent=title;$("dlgInput").value=val;dcb=cb;
  $("scrim").classList.add("on");$("dlg").classList.add("on");
  setTimeout(()=>{$("dlgInput").focus();$("dlgInput").select();},60);}
$("dlgCancel").addEventListener("click",hideSheets);
$("dlgOk").addEventListener("click",()=>{const v=$("dlgInput").value.trim();hideSheets();if(v&&dcb)dcb(v);});
$("dlgInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("dlgOk").click();});

/* ---------- actions ---------- */
$("actNewFolder").addEventListener("click",()=>{hideSheets();
  ask("New folder","",async n=>{await put("nodes",{id:uid(),parentId:S.cwd,type:"folder",name:n,created:Date.now()});render();});});
$("actUpload").addEventListener("click",()=>{hideSheets();$("filePicker").click();});
$("filePicker").addEventListener("change",async e=>{
  const fs=[...e.target.files];e.target.value="";if(!fs.length)return;
  toast("Saving "+fs.length+" file"+(fs.length>1?"s":"")+"…");
  for(const f of fs){const id=uid();await put("blobs",f,id);
    await put("nodes",{id,parentId:S.cwd,type:"file",name:noExt(f.name),
      size:f.size,mime:f.type,duration:0,created:Date.now()});}
  toast("Added");render();});
$("actRename").addEventListener("click",()=>{const t=S.target;hideSheets();
  ask("Rename",t.name,async n=>{t.node.name=n;await put("nodes",t.node);
    if(S.cur&&S.cur.id===t.node.id){S.cur.name=n;$("miniName").textContent=n;$("nowName").textContent=n;}
    render();});});
$("actClearMark").addEventListener("click",async()=>{const t=S.target;hideSheets();
  await del("marks",t.id);if(S.cur&&S.cur.id===t.id)audio.currentTime=0;
  toast("Will start from the beginning");render();});
$("actDelete").addEventListener("click",async()=>{const t=S.target;hideSheets();
  if(!confirm("Delete “"+t.name+"”"+(t.node.type==="folder"?" and everything inside it":"")+"?"))return;
  await rm(t.node);
  if(S.cur&&S.cur.id===t.node.id){audio.pause();audio.removeAttribute("src");S.cur=null;
    $("mini").hidden=true;document.body.classList.remove("has-mini","player-open");}
  render();});
async function rm(n){if(n.type==="folder"){for(const k of await kids(n.id))await rm(k);}
  else{await del("blobs",n.id);await del("marks",n.id);} await del("nodes",n.id);}

$("autoplayRow").addEventListener("click",async()=>{S.autoplay=!S.autoplay;
  $("autoplaySw").classList.toggle("on",S.autoplay);await put("meta",S.autoplay,"autoplay");});

/* ---------- controls ---------- */
$("backBtn").addEventListener("click",goBack);
$("miniOpen").addEventListener("click",()=>document.body.classList.add("player-open"));
$("playerClose").addEventListener("click",()=>document.body.classList.remove("player-open"));
$("miniPlay").addEventListener("click",()=>{clearChain();audio.paused?audio.play().catch(()=>{}):audio.pause();});
$("bigPlay").addEventListener("click",()=>{clearChain();audio.paused?audio.play().catch(()=>{}):audio.pause();});
$("back30").addEventListener("click",()=>audio.currentTime=Math.max(0,audio.currentTime-30));
$("fwd30").addEventListener("click",()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+30));
const seek=$("seek");
seek.addEventListener("input",()=>{seek.dragging=true;const d=audio.duration||0;
  $("tCur").textContent=fmt(d*seek.value/1000);seek.style.setProperty("--fill",(seek.value/10)+"%");});
seek.addEventListener("change",()=>{const d=audio.duration||0;
  audio.currentTime=d*seek.value/1000;seek.dragging=false;saveMark();});
window.addEventListener("popstate",()=>{
  if(document.body.classList.contains("player-open"))document.body.classList.remove("player-open");
  else if(S.view!=="home")goBack();
  history.pushState(null,"");});

/* ---------- boot ---------- */
(async function(){
  db=await openDB();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  try{const r=await fetch("manifest.json",{cache:"no-cache"});
    if(r.ok){const m=await r.json();
      if(m&&Array.isArray(m.collections)&&m.collections.length)S.man=m;}}catch(e){}
  buildSeq();
  const p=await get("meta","rsn:pointer"); S.rsnPtr=(typeof p==="number"&&p<S.rsnSeq.length)?p:0;
  const ap=await get("meta","autoplay"); S.autoplay=ap===undefined?true:ap;
  $("autoplaySw").classList.toggle("on",S.autoplay);
  $("bigPlay").innerHTML=PLAY;$("miniPlay").innerHTML=PLAY;
  history.pushState(null,"");
  await render();
})();

})();
</script>
<script>
// Offline support. Registered after load so it can never delay or alter the
// first paint; if registration fails the app carries on exactly as before.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
