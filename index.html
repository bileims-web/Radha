<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1315">
<title>राधा</title>
<!-- Noto Serif Devanagari now ships with the app instead of loading from
     Google, so the Devanagari renders with no internet. Same family, same
     weights (500/600), same unicode-ranges as the stylesheet it replaces. -->
<link rel="stylesheet" href="fonts/noto-serif-devanagari.css">
<!-- and Bengali, for the Sudha Nidhi, on the same terms: self-hosted so the
     verses render with no internet. -->
<link rel="stylesheet" href="fonts/noto-serif-bengali.css">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="राधा">
<style>
  :root{
    /* Deep oxblood rather than black: it sets off the ivory tiles and the
       gold, and the whole dark family moves together so the topbar,
       sheets, mini-player and rows stay in key with it. */
    --bg:#2A1315;--surface:#361A1C;--surface2:#422124;--line:#542E30;
    --text:#F2E7DA;--muted:#B09287;--gold:#C9A227;--red:#B4462F;--pad:16px;
    --ivory:#F7F1E4;--ink:#3E2A1B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif,
      "Noto Serif Devanagari","Noto Serif Bengali";
    font-size:16px;line-height:1.4;overscroll-behavior:none;
    display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  .dv{font-family:"Noto Serif Devanagari","Noto Sans Devanagari",serif}

  .topbar{display:flex;align-items:center;gap:4px;
    padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .icon-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:10px}
  .icon-btn:active{background:var(--surface2)}
  .icon-btn[hidden]{display:none}
  .title{flex:1;min-width:0;font-size:19px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .crumb{display:block;font-size:11px;color:var(--muted);font-weight:400;
    letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:180px}

  /* Alpona drawn on the ground itself, framing the content. z-index -1 so
     it lies under the flow but over the page colour; the top pair start
     below the topbar, which is opaque and would otherwise cover them. */
  #bgArt{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
  #bgArt svg{position:absolute;width:min(48vw,200px);aspect-ratio:1;
    color:var(--gold);opacity:.09}
  #bgArt .tl{top:calc(env(safe-area-inset-top) + 58px);left:0}
  #bgArt .tr{top:calc(env(safe-area-inset-top) + 58px);right:0;transform:scaleX(-1)}
  #bgArt .bl{bottom:0;left:0;transform:scaleY(-1)}
  #bgArt .br{bottom:0;right:0;transform:scale(-1,-1)}

  /* Tiles are off-white leaves of paper. Each collection's colour from
     manifest.json is no longer the fill — it is the ink the motif and the
     alpona are drawn in, so the six stay tellable apart at a glance.
     Ivory #F7F1E4, ink #3E2A1B. */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px var(--pad) 0}
  .tile{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;padding:13px;
    text-align:center;transition:transform .12s;
    background:#F7F1E4;
    background:color-mix(in srgb, var(--tint) 9%, #F7F1E4);
    border:1px solid rgba(62,42,27,.16);
    box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .tile:active{transform:scale(.975)}
  /* light falling from the top-left, as on paper */
  .tile::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.85),transparent 64%)}
  .tile.pointed{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset,0 1px 3px rgba(0,0,0,.35)}

  /* the motif sits behind the words, large and quiet */
  .tile-art{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .tile-art svg{width:78%;height:78%;color:var(--tint);opacity:.30}
  /* alpona: the rice-paste flourish in the corners */
  .tile-alpona{position:absolute;inset:0;pointer-events:none}
  .tile-alpona svg{width:100%;height:100%;color:var(--tint);opacity:.13}

  .tile-hi{position:relative;font-size:17.5px;font-weight:600;color:var(--ink);line-height:1.34;
    text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .tile-range{position:relative;font-size:14px;color:rgba(62,42,27,.72);
    margin-top:3px;font-variant-numeric:tabular-nums}

  .libtile{margin:10px var(--pad) 0;display:flex;align-items:center;gap:14px;
    width:calc(100% - 2*var(--pad));padding:18px 16px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);text-align:left}
  .libtile:active{background:var(--surface2)}
  .libtile .meta{flex:1;min-width:0}
  .libtile .name{font-size:16.5px;font-weight:600}
  .libtile .sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  .row{display:flex;align-items:center;gap:14px;padding:13px var(--pad);
    border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;
    width:100%;text-align:left}
  .row:active{background:var(--surface)}
  .row.current .name,.row.current .glyph{color:var(--gold)}
  .row.pointed{background:rgba(201,162,39,.07)}
  .row.pointed .name{color:var(--gold)}
  .glyph{flex:0 0 24px;display:grid;place-items:center;color:var(--muted)}
  .meta{flex:1;min-width:0}
  .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
  .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .sub .mark{color:var(--gold)}
  .track-bar{height:2px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
  .track-bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
  .empty{padding:44px 30px;text-align:center;color:var(--muted);font-size:14px}
  .empty b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:8px}

  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1A1508;
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:20;
    transition:transform .12s}
  .fab:active{transform:scale(.93)}
  .fab[hidden]{display:none}
  body.player-open .fab{display:none}
  body.has-mini .fab{bottom:calc(env(safe-area-inset-bottom) + 92px)}

  .mini{position:fixed;left:0;right:0;bottom:0;
    padding:0 6px calc(env(safe-area-inset-bottom) + 6px);z-index:18}
  .mini[hidden]{display:none}
  .mini-inner{background:var(--surface2);border:1px solid var(--line);border-radius:14px;
    display:flex;align-items:center;gap:10px;padding:9px 8px 9px 14px}
  .mini .name{font-size:14.5px}
  .mini .sub{font-size:11.5px;margin-top:2px}
  .mini-prog{height:2px;background:var(--line);margin:7px 6px 0;border-radius:2px;overflow:hidden}
  .mini-prog i{display:block;height:100%;background:var(--gold)}

  .player{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 24px calc(env(safe-area-inset-bottom) + 26px);
    transform:translateY(100%);transition:transform .26s ease}
  body.player-open .player{transform:translateY(0)}
  .disc{flex:1;display:grid;place-items:center;padding:12px 0;min-height:0}
  .disc svg{width:min(56vw,220px);height:auto}
  .disc .spin{transform-origin:50% 50%;animation:rot 6s linear infinite;animation-play-state:paused}
  body.playing .disc .spin{animation-play-state:running}
  @keyframes rot{to{transform:rotate(360deg)}}
  .now-name{font-size:20px;font-weight:600;text-align:center;margin:0 0 6px;overflow-wrap:anywhere}
  .now-folder{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.4px;margin-bottom:18px}
  .seek{width:100%;appearance:none;background:transparent;height:34px;display:block}
  .seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(var(--gold),var(--gold)) left/var(--fill,0%) 100% no-repeat,var(--line)}
  .seek::-moz-range-track{height:4px;border-radius:4px;
    background:linear-gradient(var(--gold),var(--gold)) left/var(--fill,0%) 100% no-repeat,var(--line)}
  .seek::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--gold);margin-top:-6px}
  .seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--gold)}
  .times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;margin-top:-4px}
  .transport{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:20px}
  .big{width:74px;height:74px;border-radius:50%;background:var(--gold);color:#1A1508;
    display:grid;place-items:center}
  .big:active{transform:scale(.95)}
  .skip{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--line);position:relative}
  .skip span{position:absolute;font-size:9.5px;bottom:9px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chainline{text-align:center;font-size:12.5px;color:var(--gold);
    min-height:18px;margin-top:12px;font-variant-numeric:tabular-nums}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;
    pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
    border-radius:18px 18px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px);
    transform:translateY(110%);transition:transform .22s ease;max-height:80dvh;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 10px}
  .sheet h3{margin:4px 22px 12px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item{display:flex;align-items:center;gap:16px;padding:15px 22px;width:100%;text-align:left}
  .item:active{background:var(--surface2)}
  .item.danger{color:var(--red)}
  .item .glyph{color:inherit}
  .item .sub2{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .toggle{display:flex;align-items:center;gap:16px;padding:14px 22px;width:100%;text-align:left}
  .toggle .meta{flex:1}
  .toggle .sub{white-space:normal;margin-top:2px}
  .sw{flex:0 0 50px;width:50px;height:30px;border-radius:15px;background:var(--line);
    position:relative;transition:background .16s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:var(--muted);transition:.16s}
  .sw.on{background:rgba(201,162,39,.35)}
  .sw.on::after{left:23px;background:var(--gold)}

  .dlg{position:fixed;left:16px;right:16px;top:20%;z-index:42;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:20px;opacity:0;
    pointer-events:none;transform:scale(.96);transition:.15s}
  .dlg.on{opacity:1;pointer-events:auto;transform:scale(1)}
  .dlg h3{margin:0 0 14px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)}
  .dlg input{width:100%;padding:12px 14px;border-radius:10px;background:var(--bg);
    border:1px solid var(--line);color:var(--text)}
  .dlg input:focus{outline:none;border-color:var(--gold)}
  .dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .dlg-btns button{padding:10px 18px;border-radius:9px;font-weight:600;font-size:15px}
  .dlg-btns .go{background:var(--gold);color:#1A1508}
  .dlg-btns .cancel{color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,14px);
    background:var(--surface2);border:1px solid var(--line);padding:11px 18px;
    border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;
    transition:.2s;max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* Bengali is set in the serif that matches the Devanagari, served from this
     repo for the same reason: the text must render with no internet. */
  .bn{font-family:"Noto Serif Bengali","Noto Sans Bengali",serif}

  /* ---------- path slides (चौरासी जी, राधा सुधा निधि) ---------- */

  /* Where the path stands, and the two ways to start it. Ivory like the tiles,
     so it reads as a leaf of the same paper rather than as a control panel. */
  .pathhead{position:relative;overflow:hidden;margin:14px var(--pad) 0;padding:16px;
    border-radius:16px;background:color-mix(in srgb, var(--tint) 9%, #F7F1E4);
    border:1px solid rgba(62,42,27,.16);box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .pathhead::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.85),transparent 64%)}
  .pathhead>*{position:relative}
  .pathwhere{font-size:12px;letter-spacing:.5px;text-transform:uppercase;
    color:rgba(62,42,27,.6);font-weight:600}
  .pathnext{font-size:19px;font-weight:600;color:var(--ink);margin-top:4px;line-height:1.35}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
  .mode{padding:13px 10px;border-radius:12px;border:1px solid rgba(62,42,27,.22);
    background:rgba(255,255,255,.5);color:var(--ink);text-align:center;
    font-size:15.5px;font-weight:600;line-height:1.25;transition:transform .12s}
  .mode:active{transform:scale(.97)}
  .mode .sub3{display:block;font-size:11.5px;font-weight:400;margin-top:4px;
    color:rgba(62,42,27,.66);font-variant-numeric:tabular-nums}
  .pathhint{font-size:11.5px;color:rgba(62,42,27,.62);margin-top:12px;text-align:center;
    line-height:1.5}

  /* script toggle — Bengali / Hindi on the Sudha Nidhi */
  .scripts{display:flex;gap:5px;margin:14px var(--pad) 0;padding:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .scripts button{flex:1;padding:9px 6px;border-radius:9px;font-size:14.5px;color:var(--muted)}
  .scripts button.on{background:var(--surface2);color:var(--gold);font-weight:600}
  .scripts button .tag{display:block;font-size:10px;letter-spacing:.3px;
    color:var(--muted);font-weight:400;margin-top:2px}

  .sect{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
    padding:22px var(--pad) 9px;font-weight:600}

  /* the badge that says "you are here" on a group row */
  .here{flex:0 0 auto;font-size:11px;color:var(--gold);border:1px solid rgba(201,162,39,.5);
    border-radius:20px;padding:2px 10px;font-variant-numeric:tabular-nums}

  /* an honest empty space, for the Hindi text that is not written yet */
  .ph{margin:14px var(--pad);padding:22px 20px;border-radius:14px;background:var(--surface);
    border:1px dashed var(--line);color:var(--muted);font-size:13.5px;line-height:1.65;
    text-align:center}
  .ph b{display:block;color:var(--text);font-size:15.5px;font-weight:600;margin-bottom:8px}

  /* The recitation text, shown in place of the disc while a pad or a verse
     plays. On these slides the words are the point of the screen, so they get
     the room the spinning disc had. */
  .versewrap{flex:1;min-height:0;display:none;flex-direction:column}
  body.path-play .disc{display:none}
  body.path-play .versewrap{display:flex}
  .versescroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 2px 12px;-webkit-mask-image:linear-gradient(#000 92%,transparent);
    mask-image:linear-gradient(#000 92%,transparent)}
  .versetext{font-size:var(--verse-size,18px);line-height:1.95;text-align:center;
    color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
  .versemuted{color:var(--muted);font-size:14px;line-height:1.7;white-space:normal;
    padding:0 6px}

  /* ---------- रसिक पदावली — the library, laid out as tiles ---------- */
  .ltiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px var(--pad) 0}
  .ltile{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;padding:13px;
    display:flex;flex-direction:column;justify-content:flex-end;text-align:left;
    background:var(--surface);border:1px solid var(--line);transition:transform .12s}
  .ltile:active{transform:scale(.975)}
  .ltile.cur{border-color:var(--gold)}
  .ltile.cur .lname{color:var(--gold)}
  .lglyph{position:absolute;top:12px;left:12px;color:var(--muted)}
  .lname{font-size:15px;font-weight:600;line-height:1.32;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .lsub{font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .lsub .mark{color:var(--gold)}
  .lbar{height:2px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
  .lbar i{display:block;height:100%;background:var(--gold);border-radius:2px}

  /* The two slides that are not built yet. They hold their place in the grid
     so the layout is whole, but they are plainly not ready: no ink of their
     own, a dashed edge, and a quiet label. Tapping one says so and no more. */
  .tile.soon{background:rgba(247,241,228,.62);border-style:dashed;
    border-color:rgba(62,42,27,.2);box-shadow:none}
  .tile.soon::before{opacity:.45}
  .tile.soon .tile-art svg{color:#6B5B4B;opacity:.16}
  .tile.soon .tile-alpona svg{color:#6B5B4B;opacity:.09}
  .tile.soon .tile-hi{color:rgba(62,42,27,.58);text-shadow:none}
  .tile-soon{position:relative;margin-top:6px;font-size:10.5px;letter-spacing:.5px;
    color:rgba(62,42,27,.5);font-weight:600}

  /* ---------- the sittings a path is divided into ----------
     Leaves of the same paper as the home tiles, because they are the same
     kind of choice: which sitting am I taking up. The one holding the current
     position wears the gold edge — that is the whole of "where I am". */
  .stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px var(--pad) 0}
  .stile{position:relative;overflow:hidden;border-radius:16px;padding:15px 12px;
    min-height:112px;display:flex;flex-direction:column;justify-content:center;
    text-align:center;transition:transform .12s;
    background:color-mix(in srgb, var(--tint) 9%, #F7F1E4);
    border:1px solid rgba(62,42,27,.16);box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .stile:active{transform:scale(.975)}
  .stile::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.85),transparent 64%)}
  .stile>*{position:relative}
  .stile.now{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset,0 1px 3px rgba(0,0,0,.35)}
  .sname{font-size:16px;font-weight:600;color:var(--ink);line-height:1.3}
  .srange{font-size:12.5px;color:rgba(62,42,27,.72);margin-top:5px;line-height:1.45}
  .scount{font-size:11px;color:rgba(62,42,27,.55);margin-top:5px;font-variant-numeric:tabular-nums;
    letter-spacing:.3px}
  .stile.wide{grid-column:1 / -1;min-height:0;padding:14px 12px}
  .snow{position:absolute;top:7px;right:9px;font-size:9.5px;letter-spacing:.4px;
    color:var(--gold);font-weight:600}

  /* ---------- the reader's own bar ----------
     On a path slide the words are the screen. The transport moves into a panel
     and this carries what a reader actually reaches for. */
  .rbar{display:none;align-items:center;justify-content:space-between;gap:2px;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  body.path-play .rbar{display:flex}
  body.path-play .disc,body.path-play .now-folder,body.path-play #seek,
  body.path-play .player>.times,body.path-play .transport,
  body.path-play .chainline{display:none}
  /* the item's own name reads better above the words than under them */
  body.path-play .now-name{order:-1;font-size:15px;color:var(--muted);font-weight:600;
    letter-spacing:.3px;margin:0 0 10px}
  .rb{flex:1 1 0;min-width:0;height:46px;border-radius:11px;display:grid;
    grid-auto-flow:column;gap:1px;place-items:center;align-content:center;
    color:var(--text);position:relative}
  .rb:active{background:var(--surface2)}
  .rb:disabled{color:var(--line)}
  .rb.on{color:var(--gold)}
  .rb .az{font-size:17px;font-weight:600;line-height:1}
  .rb .az.sm{font-size:13px}
  .rb .pm{font-size:11px;font-weight:600;margin-left:1px;vertical-align:top}

  /* ---------- item picker overlay ---------- */
  .pickov{position:fixed;inset:0;z-index:44;background:var(--bg);display:none;
    flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px
      calc(env(safe-area-inset-bottom) + 10px)}
  .pickov.on{display:flex}
  .pick-head{display:flex;align-items:center;gap:6px;padding:0 8px 8px;
    border-bottom:1px solid var(--line)}
  .pick-title{flex:1;font-size:16px;font-weight:600}
  .pick-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 4px 4px}
  .pcell{aspect-ratio:1/1;border-radius:11px;background:var(--surface);
    border:1px solid var(--line);color:var(--text);font-size:15px;
    font-variant-numeric:tabular-nums;display:grid;place-items:center}
  .pcell:active{background:var(--surface2)}
  .pcell.bracket{border-style:dashed;color:var(--muted)}
  .pcell.on{border-color:var(--gold);color:var(--gold);font-weight:600;
    box-shadow:0 0 0 1px var(--gold) inset}

  /* ---------- audio panel ---------- */
  /* The panel is a control strip, not a page: the words keep the screen, so
     every row is one line and the whole thing stays around a third of it. */
  .apanel{padding:2px 0 calc(env(safe-area-inset-bottom) + 8px)}
  .apanel .grab{margin:4px auto 8px}
  /* elapsed · bar · total, on ONE line */
  .ap-seek{display:flex;align-items:center;gap:11px;padding:0 18px}
  .apanel .seek{flex:1;min-width:0;width:auto;margin:0;padding:0}
  .ap-t{flex:0 0 auto;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .ap-play{display:grid;place-items:center;margin:12px 0 2px}
  .apanel .big{width:58px;height:58px}
  .apanel .big svg{width:23px;height:23px}
  .speed{display:flex;align-items:center;gap:10px;padding:10px 18px 4px}
  .slabel{flex:1;font-size:14.5px;font-weight:600}
  .apanel .toggle{padding:9px 18px;gap:12px}
  .apanel .toggle .name{font-size:14.5px;font-weight:600}
  .apanel .toggle .sub{font-size:12px;margin-top:1px}
  .sbtn{width:34px;height:34px;flex:0 0 34px;border-radius:10px;border:1px solid var(--line);
    display:grid;place-items:center;font-size:18px;line-height:1;color:var(--text)}
  .sbtn:active{background:var(--surface2)}
  .sbtn:disabled{color:var(--line);border-color:var(--surface2)}
  .srate{min-width:52px;text-align:center;font-size:15.5px;font-variant-numeric:tabular-nums;
    color:var(--gold);font-weight:600}

  /* ---------- where the sittings are decided ---------- */
  .dlevel{padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .dlevel:last-of-type{border-bottom:0}
  .dhead{display:flex;align-items:center;gap:10px;padding:8px 22px 6px}
  .dh-t{flex:1;font-size:14.5px;font-weight:600}
  .dh-n{display:flex;align-items:center;gap:8px}
  .dh-n b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold)}
  .drow{display:flex;align-items:center;gap:10px;padding:7px 22px}
  .dn{flex:0 0 18px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .dr{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dc{flex:0 0 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dstep{flex:0 0 84px;display:flex;gap:6px;justify-content:flex-end}
  .dstep .sbtn{width:34px;height:34px;flex:0 0 34px;font-size:17px}
  .dnote{padding:2px 22px 12px;font-size:12px;color:var(--muted);line-height:1.55}

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div id="bgArt" aria-hidden="true">
  <svg class="tl" viewBox="0 0 100 100"><use href="#m-alpona-bg"/></svg>
  <svg class="tr" viewBox="0 0 100 100"><use href="#m-alpona-bg"/></svg>
  <svg class="bl" viewBox="0 0 100 100"><use href="#m-alpona-bg"/></svg>
  <svg class="br" viewBox="0 0 100 100"><use href="#m-alpona-bg"/></svg>
</div>

<!-- Motifs for the collection tiles, drawn as line art so they stay crisp at
     any size, cost a couple of kilobytes, and need no network. Every stroke is
     currentColor, so each tile inks its motif in its own colour. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="g-common" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <!-- a lit diya, seen from the front -->
  <symbol id="m-diya" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 58 Q50 90 82 58 Q50 66 18 58 Z"/>
      <ellipse cx="50" cy="83" rx="13" ry="3.4"/>
      <path d="M50 88 L50 91"/>
      <path d="M50 24 C60 38 57 52 50 58 C43 52 40 38 50 24 Z" fill="currentColor" fill-opacity=".30"/>
      <path d="M50 42 C54 48 53 54 50 57 C47 54 46 48 50 42 Z" fill="currentColor" fill-opacity=".45" stroke="none"/>
      <g stroke-width="1.7" opacity=".72">
        <path d="M50 12 L50 18"/>
        <path d="M28 24 L32 29"/><path d="M72 24 L68 29"/>
        <path d="M20 44 L26 45"/><path d="M80 44 L74 45"/>
      </g>
    </g>
  </symbol>

  <!-- Krishna's flute, dressed: bound at its ends and joint, a scalloped fan
       at the right, and beaded swags and tassels hanging beneath. -->
  <symbol id="m-flute" viewBox="0 0 100 100">
    <defs>
      <path id="fan-petal" d="M0 0 C2.6 -3 2.6 -7.5 0 -10.5 C-2.6 -7.5 -2.6 -3 0 0 Z"/>
      <path id="tassel-drop" d="M0 0 C1.5 1.5 1.5 3.8 0 5.1 C-1.5 3.8 -1.5 1.5 0 0 Z"/>
    </defs>
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
       transform="translate(0 6)">
      <!-- After the drawing in the Recitation folder: the bansuri lies across,
           bound at its ends and joint, a scalloped fan at the right, and
           beaded swags and tassels hanging beneath — all drawn in the
           alpona's hand of fine strands, curls and beads. -->

      <!-- the flute -->
      <path d="M8.33 41.01 L92.33 48.01 L91.67 55.99 L7.67 48.99 Z"
            fill="currentColor" fill-opacity=".07"/>
      <!-- binding bands: ends and the middle joint -->
      <g stroke-width="1.5" opacity=".9">
        <path d="M15.89 41.65 L15.23 49.61"/>
        <path d="M41.93 43.82 L41.27 51.78"/>
        <path d="M46.97 44.24 L46.31 52.2"/>
        <path d="M83.93 47.32 L83.27 55.28"/>
      </g>
      <!-- beading around each binding -->
      <g stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.1 2.6" opacity=".75">
        <path d="M11.6 41.3 L11 49.3"/>
        <path d="M44.5 44 L43.9 52"/>
        <path d="M88 47.7 L87.4 55.7"/>
      </g>
      <!-- mouth hole and the finger holes -->
      <g fill="currentColor" fill-opacity=".45" stroke="none">
        <ellipse cx="24.9" cy="45.2" rx="2.4" ry="1.8" transform="rotate(4.8 24.9 45.2)"/>
        <ellipse cx="53.5" cy="47.6" rx="2.1" ry="1.6" transform="rotate(4.8 53.5 47.6)"/>
        <ellipse cx="60.2" cy="48.1" rx="2.1" ry="1.6" transform="rotate(4.8 60.2 48.1)"/>
        <ellipse cx="66.9" cy="48.7" rx="2.1" ry="1.6" transform="rotate(4.8 66.9 48.7)"/>
        <ellipse cx="73.6" cy="49.3" rx="2.1" ry="1.6" transform="rotate(4.8 73.6 49.3)"/>
        <ellipse cx="80.3" cy="49.8" rx="2.1" ry="1.6" transform="rotate(4.8 80.3 49.8)"/>
      </g>

      <!-- the scalloped fan resting on the flute at the right -->
      <g stroke-width="1.2" fill="currentColor" fill-opacity=".10">
        <use href="#fan-petal" transform="translate(79 46.9) rotate(-75)"/>
        <use href="#fan-petal" transform="translate(79 46.9) rotate(-50)"/>
        <use href="#fan-petal" transform="translate(79 46.9) rotate(-25)"/>
        <use href="#fan-petal" transform="translate(79 46.9) rotate(0)"/>
        <use href="#fan-petal" transform="translate(79 46.9) rotate(25)"/>
        <use href="#fan-petal" transform="translate(79 46.9) rotate(50)"/>
        <use href="#fan-petal" transform="translate(79 46.9) rotate(75)"/>
      </g>
      <g stroke-width="1.7" stroke-linecap="round" stroke-dasharray="0.1 2.8" opacity=".7">
        <path d="M68.5 44.6 A11.5 11.5 0 0 1 89.5 44.6"/>
      </g>

      <!-- beaded swags slung beneath the flute -->
      <g stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 3.2" opacity=".8">
        <path d="M28 50.7 Q50 67 72 54.4"/>
        <path d="M40 51.7 Q62 70 84 55.4"/>
        <path d="M78 55 L75 74"/>
        <path d="M82 55.5 L82 82"/>
        <path d="M86 56 L88 70"/>
      </g>
      <g fill="currentColor" fill-opacity=".55" stroke="none">
        <use href="#tassel-drop" transform="translate(75 75)"/>
        <use href="#tassel-drop" transform="translate(82 83)"/>
        <use href="#tassel-drop" transform="translate(88 71)"/>
      </g>
    </g>
  </symbol>

  <!-- Radha Charan: the lotus feet. One foot is drawn, then mirrored, so the
       great toes fall on the inner edges and face each other as a real pair
       does. Each sole bears a lotus. -->
  <symbol id="m-charan" viewBox="0 0 100 100">
    <defs>
      <g id="charan-foot" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <!-- Sole: broad across the ball, the inner edge sweeping in at the
             arch, narrowing to a rounded heel. Great toe on the inner side. -->
        <path d="M27 35.2
                 C20.5 35.2 15.6 38.8 15 45.2
                 C14.6 51 15.6 56.6 16.8 62
                 C18 67.4 19 74 21.6 79
                 C24 83.2 29.4 84.4 32.2 81
                 C34.6 78 34.8 74 34.2 70
                 C33.4 65.4 30.9 63 30.5 58.6
                 C30.2 53.4 34 46.8 37.6 41.4
                 C39 38.4 33 35.2 27 35.2 Z"/>
        <!-- five toes, graduated, the great toe innermost -->
        <ellipse cx="38.4" cy="30.2" rx="4.2" ry="3.4" transform="rotate(22 38.4 30.2)"/>
        <ellipse cx="32.2" cy="26.4" rx="3"   ry="2.5" transform="rotate(8 32.2 26.4)"/>
        <ellipse cx="26.8" cy="26.2" rx="2.7" ry="2.3" transform="rotate(-3 26.8 26.2)"/>
        <ellipse cx="22"   cy="27.6" rx="2.35" ry="2"  transform="rotate(-14 22 27.6)"/>
        <ellipse cx="18"   cy="30.3" rx="2"   ry="1.75" transform="rotate(-26 18 30.3)"/>
        <!-- the auspicious marks: lotus on the ball, then chakra and dhwaja
             across the arch, and the barleycorn at the heel -->
        <g stroke-width="1.15" opacity=".9">
          <g transform="translate(27 45.5)">
            <path d="M0 -5.4 C2.4 -2.3 2.4 1.2 0 3.6 C-2.4 1.2 -2.4 -2.3 0 -5.4 Z"/>
            <path d="M-5.8 -2.3 C-2.5 -3.1 0.4 -0.9 0 3.6 C-3.3 3.1 -5.4 0.9 -5.8 -2.3 Z"/>
            <path d="M5.8 -2.3 C2.5 -3.1 -0.4 -0.9 0 3.6 C3.3 3.1 5.4 0.9 5.8 -2.3 Z"/>
          </g>
          <g transform="translate(23.6 57.4)">
            <circle cx="0" cy="0" r="2.6"/>
            <path d="M0 -2.6 L0 -3.9 M0 2.6 L0 3.9 M-2.6 0 L-3.9 0 M2.6 0 L3.9 0
                     M-1.85 -1.85 L-2.75 -2.75 M1.85 -1.85 L2.75 -2.75
                     M-1.85 1.85 L-2.75 2.75 M1.85 1.85 L2.75 2.75"/>
          </g>
          <g transform="translate(25.8 67.4)">
            <path d="M-1.8 4 L-1.8 -4"/>
            <path d="M-1.8 -4 L2.6 -2.2 L-1.8 -0.4 Z"/>
          </g>
          <g transform="translate(27.6 76.4)">
            <path d="M0 -3.6 C1.9 -1.2 1.9 1.2 0 3.6 C-1.9 1.2 -1.9 -1.2 0 -3.6 Z"/>
            <path d="M0 -3 L0 3"/>
          </g>
        </g>
      </g>
    </defs>
    <!-- Mirror images, set so the great toes almost meet: the widest inner
         point is the great toe at x≈42.5, not the sole, and the -5° splay
         pulls it to x≈40. The two offsets put those edges at 48.5 and 51.5,
         which leaves a hair's gap and keeps the pair centred on x=50. -->
    <use href="#charan-foot" transform="translate(8.5 2) rotate(-5 28 58)"/>
    <use href="#charan-foot" transform="translate(91.5 2) scale(-1 1) rotate(-5 28 58)"/>
  </symbol>

  <!-- an open lotus: three overlapping rows of petals about one crown, the
       outer row falling outward and down, the inner row still cupped upright.
       Thirteen petals. Each is the same drawn shape at three lengths, placed
       by rotation only — never scaled — so every outline keeps one stroke
       weight. Wider than it is tall. -->
  <symbol id="m-lotus" viewBox="0 0 100 100">
    <defs>
      <!-- broad through the middle, tapering to a point -->
      <path id="lp-out" d="M0 0 C8.2 -9.9 7.54 -22.4 0 -33 C-7.54 -22.4 -8.2 -9.9 0 0 Z"/>
      <path id="lp-mid" d="M0 0 C7.4 -9 6.8 -20.4 0 -30 C-6.8 -20.4 -7.4 -9 0 0 Z"/>
      <path id="lp-in"  d="M0 0 C6.6 -7.8 6.07 -17.7 0 -26 C-6.07 -17.7 -6.6 -7.8 0 0 Z"/>
    </defs>
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- stem and the pad it rises from -->
      <path d="M50 62 L50 84"/>
      <path d="M50 79 C42 79.5 36 75.5 34.5 70 C40.5 69.5 46.5 72.5 50 79 Z"/>
      <path d="M31 88 Q50 94 69 88"/>
      <!-- outer row: six petals, opening outward and downward -->
      <g fill="currentColor" fill-opacity=".07">
        <use href="#lp-out" transform="translate(50 54) rotate(-122)"/>
        <use href="#lp-out" transform="translate(50 54) rotate(-96)"/>
        <use href="#lp-out" transform="translate(50 54) rotate(-70)"/>
        <use href="#lp-out" transform="translate(50 54) rotate(70)"/>
        <use href="#lp-out" transform="translate(50 54) rotate(96)"/>
        <use href="#lp-out" transform="translate(50 54) rotate(122)"/>
      </g>
      <!-- middle row: four petals, angled -->
      <g fill="currentColor" fill-opacity=".11">
        <use href="#lp-mid" transform="translate(50 54) rotate(-54)"/>
        <use href="#lp-mid" transform="translate(50 54) rotate(-34)"/>
        <use href="#lp-mid" transform="translate(50 54) rotate(34)"/>
        <use href="#lp-mid" transform="translate(50 54) rotate(54)"/>
      </g>
      <!-- inner row: three petals, upright, forming the cup -->
      <g fill="currentColor" fill-opacity=".16">
        <use href="#lp-in" transform="translate(50 54) rotate(-18)"/>
        <use href="#lp-in" transform="translate(50 54) rotate(0)"/>
        <use href="#lp-in" transform="translate(50 54) rotate(18)"/>
      </g>
    </g>
  </symbol>

  <!-- The same alpona hand as the tile borders, drawn larger for the page
       ground: two sweeping arcs from edge to edge, a bud at the corner,
       petals riding the outer arc, beads and terminal curls. -->
  <symbol id="m-alpona-bg" viewBox="0 0 100 100">
    <defs>
      <path id="alp-bg-petal" d="M0 0 C3 -2.6 3 -7 0 -9.5 C-3 -7 -3 -2.6 0 0 Z"/>
    </defs>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 34 C20 34 34 20 34 0"/>
      <path d="M0 50 C28 50 50 28 50 0"/>
      <path d="M6 6 C12 9 15 15 13 22 C7 19 4 13 6 6 Z"/>
      <use href="#alp-bg-petal" transform="translate(46 20) rotate(113.5)"/>
      <use href="#alp-bg-petal" transform="translate(35.5 35.5) rotate(135)"/>
      <use href="#alp-bg-petal" transform="translate(19.6 46.1) rotate(157)"/>
      <circle cx="62" cy="9" r="1.5"/>
      <circle cx="53" cy="35" r="1.5"/>
      <circle cx="35" cy="53" r="1.5"/>
      <circle cx="9" cy="62" r="1.5"/>
      <path d="M50 0 C50 5.5 54 9 58.5 7 C61 5.8 61 2.2 58.5 1.2"/>
      <path d="M0 50 C5.5 50 9 54 7 58.5 C5.8 61 2.2 61 1.2 58.5"/>
    </g>
  </symbol>

  <!-- alpona: the rice-paste flourish drawn at a threshold, one corner of it -->
  <symbol id="m-alpona" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <g id="alp-corner">
        <path d="M2 20 C10 20 16 14 16 6"/>
        <path d="M2 27 C14 27 23 18 23 6"/>
        <path d="M8.5 13.5 C11 11 13 9 15.5 8"/>
        <circle cx="6" cy="6" r="1.7"/>
        <path d="M27 4 C31 8 31 12 27 15 C25 11 25 8 27 4 Z"/>
        <path d="M4 31 C8 35 12 35 15 31 C11 29 8 29 4 31 Z"/>
      </g>
      <use href="#alp-corner" transform="translate(100 0) scale(-1 1)"/>
      <use href="#alp-corner" transform="translate(0 100) scale(1 -1)"/>
      <use href="#alp-corner" transform="translate(100 100) scale(-1 -1)"/>
    </g>
  </symbol>

  <!-- A pothi — the bound manuscript a पदावली is: two boards, loose leaves
       between them, and the cord wound round and tied off in a bow. Drawn in
       the same alpona hand as the other motifs: fine strands, beads, curls. -->
  <symbol id="m-pothi" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- the boards, above and below -->
      <path d="M14 31 H86 V40 H14 Z" fill="currentColor" fill-opacity=".10"/>
      <path d="M14 62 H86 V71 H14 Z" fill="currentColor" fill-opacity=".10"/>
      <!-- the loose leaves -->
      <g stroke-width="1.5" opacity=".8">
        <path d="M18 45 H82"/><path d="M18 50 H82"/>
        <path d="M18 55 H82"/><path d="M18 59.5 H82"/>
      </g>
      <!-- the cord: over the top board, beaded where it crosses the leaves -->
      <path d="M50 26 V31"/>
      <g stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.1 2.7" opacity=".75">
        <path d="M50 41 V61"/>
      </g>
      <path d="M50 71 V75"/>
      <!-- tied off in a bow -->
      <path d="M50 75 C43.5 74.5 40 79 43.5 82.5 C46.5 85.5 50 81.5 50 75 Z" fill="currentColor" fill-opacity=".14"/>
      <path d="M50 75 C56.5 74.5 60 79 56.5 82.5 C53.5 85.5 50 81.5 50 75 Z" fill="currentColor" fill-opacity=".14"/>
      <path d="M47 84 C45 87 43.5 89 41.5 90.5"/>
      <path d="M53 84 C55 87 56.5 89 58.5 90.5"/>
      <circle cx="50" cy="75.5" r="1.9" fill="currentColor" stroke="none"/>
      <!-- corner beads on the boards -->
      <g fill="currentColor" stroke="none" fill-opacity=".5">
        <circle cx="18.5" cy="35.5" r="1.4"/><circle cx="81.5" cy="35.5" r="1.4"/>
        <circle cx="18.5" cy="66.5" r="1.4"/><circle cx="81.5" cy="66.5" r="1.4"/>
      </g>
    </g>
  </symbol>
</svg>

<section class="player" id="player">
