  const rate=44100,ch=2,n=rate*secs*ch*2,b=new Uint8Array(44+n),v=new DataView(b.buffer);
  const s=(o,w)=>{for(let i=0;i<w.length;i++)b[o+i]=w.charCodeAt(i);};
  s(0,"RIFF");v.setUint32(4,36+n,true);s(8,"WAVE");s(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*ch*2,true);
  v.setUint16(32,ch*2,true);v.setUint16(34,16,true);
  s(36,"data");v.setUint32(40,n,true);   // a new array is zeros: silence as it stands
  return quiet[secs]=URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}

/* A COUNTDOWN, AND THEN A SOUND.

   Two things wait: the gap between the two आरती of a pair, and the breath
   before one that a hand has just started. Both park the ONE timer, so
   everything that already drops a chain — the play button, leaving the slide,
   tapping another track — drops a lead-in as well, and the two can never be
   left running behind one another.

   `bar` is whether the item that is WAITING is also the item the mini bar is
   showing. A lead-in is loaded and silent, so "in 5s" under its own name is
   exactly what is happening. A chain gap is not: the bar still carries the
   आरती that has just finished, and a countdown under that name would be
   naming the wrong song. The line under the transport names it instead —
   which is also why the bar has to carry the lead-in at all, since that line
   is only on screen when the player is raised, and a tap from the list
   leaves it down.

   THE WAIT PLAYS SILENCE. Tap an आरती, switch the screen off, put the phone
   down: with nothing sounding, the phone goes to sleep a few seconds later, and
   a sleeping phone runs no timer — the countdown simply stopped, and took up
   again from 5s when the screen came back on. A phone does not sleep while it
   is playing, so the wait is spent playing `hold`, a silent clip longer than
   the wait itself. It is not muted on purpose: a muted player is not one the
   phone keeps awake for.

   And the countdown reads the wall clock, not its own ticks. Any of three
   things may notice the time is up — the timeout, the one-second tick, the
   silent clip's own progress — and whichever is first starts the आरती, so if
   the phone did sleep after all, waking it sounds the आरती at once instead of
   counting down what is left.

   The silence goes on through a chain's load — the next track still has to
   load, and the gap between the two is exactly when a phone would doze off —
   and stops at the आरती's `play`, the instant it is asked to sound, never
   after. It used to wait for `playing`, and the two ran over each other for the
   first moment of every song. So the one that fires takes `hold` out of
   clearChain's reach before starting the next thing. */
function countdown(name,secs,bar,go){
  const end=Date.now()+secs*1000;
  let shown=0;
  const show=()=>{const left=Math.max(1,Math.ceil((end-Date.now())/1000));
    if(left===shown)return; shown=left;
    $("chainLine").textContent=name+" in "+left+"s";
    if(bar){waitLeft=left; paint();}};
  const fire=()=>{
    if(chainTimer!==mine)return;         // dropped, or a later wait has the timer
    const h=hold; hold=null; clearChain(); go();
    if(h) audio.addEventListener("play",()=>h.pause(),{once:true});
  };
  const tick=()=>{if(Date.now()>=end)fire(); else show();};
  show();
  const mine=chainTimer=setTimeout(fire,secs*1000);
  chainTick=setInterval(tick,1000);
  hold=new Audio(silence(secs+10));
  hold.ontimeupdate=tick;
  hold.play().catch(()=>{});             // refused: the timers still run it, as before
}

/* A BREATH BEFORE THE FIRST NOTE.

   An आरती is sung standing in front of the image with the lamp in the hand,
   and the tap that starts it is the one moment the phone is still being held.
   So a track carrying `leadIn` in the manifest loads silent and sounds that
   many seconds later — time to put the phone down and take up the diya. It is
   on the two आरती a hand actually starts, हरिवंश महाप्रभु and चंद्र मिटे दिनकर
   मिटे; the other of each pair arrives by the chain, which has just served a
   gap of its own.

   `arrived` is the flag that says an item came by ITSELF rather than by a tap,
   and it answers both questions at once: such an item begins from its top (see
   playTrack) and it needs no lead-in.

   A resume waits too. It is the same gesture and the same lamp, whether the
   आरती takes up at 0:00 or at 4:12. */
function playFixed(c,i,arrived){
  clearChain(); S.session=null;
  const t=c.tracks[i];
  const lead=arrived?0:(t.leadIn||0);
  playTrack({id:tid(c.id,t.file),name:t.title,url:t.file,coll:c,idx:i,kind:"fixed"},
            lead>0,arrived);
  if(lead) countdown(t.title,lead,true,()=>audio.play().catch(paint));
}

/* A VERSE BEGINS AGAIN; A SONG PICKS UP WHERE IT STOPPED.

   A path item — a verse of the Sudha Nidhi, a pad of the Chaurasi — is under a
   minute long and is read in order, so coming back to one mid-word is only
   jarring: `t.path` items NEVER resume, and nothing writes a mark for them.
   A song is a different creature: the two पद गायन recordings are near two hours
   each, and starting one again from its top is the whole complaint the other
   way round. So a track with no `path` honours its mark.

   `fromStart` overrides that for the one case where even a song must begin
   again: an item arrived at by ITSELF — the आरती chain, the next song in a
   folder when one ends. A mark is for the item YOU choose, not the one that
   comes to you.

   The आरती go further, by `resume:"slider"` on their collection: a tap starts
   at the top even after a pause part-way. The user's rule, 2026-09-28: "unless
   I slide the song track to a specific time stamp, tapping a song always
   starts the song from the beginning." So the one mark such a song keeps is the
   place the seek bar was dragged to; pausing, stopping and leaving the app
   write nothing (see saveMark), and a mark from before the rule is not taken
   for one (see tapMark).

   `startPaused` is how reading in silence works: the item is loaded and its
   words are painted, but nothing sounds until a play gesture. Callers that mean
   "play this" pass false; callers that are only moving the reader pass S.silent,
   so the habit carries. */
async function playTrack(t,startPaused,fromStart){
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null;}
  let src;
  if(t.blobId){const b=await get("blobs",t.blobId);
    if(!b){toast("That file is missing from storage.");return;}
    objUrl=URL.createObjectURL(b);src=objUrl;}
  else src=t.url;

  S.cur=t;
  // Whose words are on screen: a path item's own text, or the text a reading
  // runs over. Everything below that used to ask `t.path` asks this instead —
  // but NOT the mark: a reading keeps one, a verse never does.
  const rp=t.path||(t.read&&t.read.c);
  const grp=t.coll||t.path;                       // whichever kind of collection this came from
  if(grp){await put("meta",{id:t.id,name:t.name},"last:"+grp.id);
    $("discLabel").setAttribute("fill",grp.tint||"#6E1F1F");}
  else $("discLabel").setAttribute("fill","#6E1F1F");

  const mark=(t.path||fromStart)?null:tapMark(t.coll,await get("marks",t.id));
  curSrc=src; retries=0; stallAt=-1; stallTicks=0;
  audio.src=src;
  audio.onerror=recover;
  audio.onloadedmetadata=async()=>{
    if(isFinite(audio.duration)){
      if(t.node){if(Math.abs((t.node.duration||0)-audio.duration)>1){t.node.duration=audio.duration;await put("nodes",t.node);}}
      else await put("meta",audio.duration,"dur:"+t.id);
    }
    if(mark&&mark.pos>0&&mark.pos<audio.duration-3){
      audio.currentTime=mark.pos; toast("Resuming from "+fmt(mark.pos));}
    audio.playbackRate=S.speed;
    paint(); if(!startPaused) audio.play().catch(paint);
  };
  $("mini").hidden=false; document.body.classList.add("has-mini");
  paintNames(t);

  // the words, in place of the disc. A path item takes the reader back from a
  // text slide, so the two can never disagree about whose words are on screen.
  if(rp){S.read=null;document.body.classList.remove("text-play");}
  document.body.classList.toggle("path-play",!!rp);
  document.body.classList.toggle("reading",!!t.read);
  if(rp) showVerse(rp,t.n);
  render(); paintReader(); mediaMeta(t);
}
/* What is sounding and whose it is, on the mini bar and over the words — in the
   script the text is being read in, so it is painted again when that changes. */
function paintNames(t){
  const rp=t.path||(t.read&&t.read.c);
  const grp=t.coll||t.path;
  const cls=rp?(scriptOf(rp).cls||"dv"):(t.coll?"dv":"");
  for(const el of [$("miniName"),$("nowName")]){
    // The mini bar names what is SOUNDING; the reader names what is being READ.
    // On a path they are one item. Over a reading they part company — শ্লোক 1–30
    // is playing while the eye sits on one of the thirty.
    el.textContent=(t.read&&el===$("nowName"))?itemTitle(rp,t.n):t.name;
    el.classList.toggle("dv",cls==="dv"); el.classList.toggle("bn",cls==="bn");
  }
  $("nowFolder").textContent=grp?(titleOf(grp)+(grp.range?" "+grp.range:"")):"रसिक पदावली";
  const fcls=grp?clsOf(grp):"dv";
  $("nowFolder").classList.toggle("dv",fcls==="dv");
  $("nowFolder").classList.toggle("bn",fcls==="bn");
}

/* text and audio in sync: one file per item, so the text for the item that is
   playing is simply the row with its number.

   `t` is the verse and nothing else, whatever else the source held. What a row
   may carry BESIDES the verse is `g` — the meaning, as [heading, body] pairs,
   folded away underneath so the screen still reads as verse until it is asked
   for. The Sudha Nidhi has it on shlokas 1-90; every other item on every path
   has none, and for those the box below is emptied and hides itself. */
function showVerse(c,n){
  const el=$("verseText"),sc=scriptOf(c),row=rowFor(c,n),box=$("verseRich");
  $("verseScroll").scrollTop=0;
  el.className="versetext "+(row?(sc.cls||"dv"):"versemuted dv");
  // A verse line that wraps must not leave its danda stranded on a line of
  // its own, so the space before । or ॥ is made non-breaking.
  el.textContent=row?row.t.replace(/ +([।॥])/g,"\u00A0$1")
    :(sc.placeholderTitle?sc.placeholderTitle+"\n\n"+(sc.placeholderBody||""):"");
  box.innerHTML="";
  const g=row&&row.g,cls=sc.cls||"dv";
  // The sense of the verse reads with the verse; the word list is what the
  // book button reveals. Which is which is `openGloss` in the manifest, so a
  // text whose script names none keeps every block folded, as before.
  let folds=0;
  if(g) for(const [label,body] of g){
    if(sc.openGloss&&label===sc.openGloss) box.appendChild(glossOpen(label,body,cls));
    else{ box.appendChild(glossFold(label,body,cls)); folds++; }
  }
  // the bar's button belongs to whatever actually folds, not to having a meaning
  document.body.classList.toggle("glossable",folds>0);
}

/* ---------- the screen must not go out under the reader ----------
   A sitting is eyes on the page and ears on the recitation, not thumbs on the
   glass, and the phone’s own screen timeout does not know that: it blacked a
   verse out mid-line. The lock is held while there are words on screen or
   something is playing, and only then.

   Two facts about the API this leans on. The browser releases the lock BY
   ITSELF the moment the page is hidden — the power button, a switch to
   another app — so switching the screen off by hand still works and nothing
   here has to undo it. And that release is final: the sentinel is dead, so
   coming back to a visible page must ask again or the rest of the sitting
   goes unheld. `release` fires for both kinds, which is why its handler only
   drops the handle and never decides anything. */
let wakeLock=null,wakeBusy=false;
function wakeWanted(){
  if(document.hidden)return false;          // a request would only throw
  if(!audio.paused)return true;
  // the words are on screen when the player is raised over a slide — either
  // kind, the text section and the verse that plays keep the screen alike
  const b=document.body.classList;
  return b.contains("player-open")&&
    (b.contains("text-play")||b.contains("path-play"));
}
async function syncWake(){
  if(!("wakeLock" in navigator)||wakeBusy)return;
  const want=wakeWanted();
  if(want===!!wakeLock)return;
  wakeBusy=true;
  try{
    if(want){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{wakeLock=null;});
    }
    else{ const l=wakeLock; wakeLock=null; await l.release(); }
  }
  // Refused: battery saver, a browser policy, a page hidden mid-request. This
  // is a comfort, not a feature — it fails without a word, and the next thing
  // that moves on screen asks again.
  catch(e){wakeLock=null;}
  finally{
    wakeBusy=false;
    // the sitting may have moved on while we awaited. A request that FAILED
    // does not come back through here — `want` has not changed — or a phone
    // that always refuses would spin.
    if(wakeWanted()!==want) syncWake();
  }
}
/* Every state the lock cares about is already written on the body: the player
   is raised or it is not, the slide is a text or a verse, `playing` is toggled
   from `audio.paused` on every play and pause. So the classes are watched
   rather than each caller being made to remember — and a caller WOULD forget.
   This began as two failing checks: closing the reader over a playing verse
   goes through `closeReader`, which only calls `render()` when a TEXT slide is
   open, so a hook there held the screen on for the rest of the session. */
new MutationObserver(syncWake).observe(document.body,
  {attributes:true,attributeFilter:["class"]});

function paint(){
  const d=audio.duration||0,c=audio.currentTime||0,p=d?c/d*100:0;
  $("tCur").textContent=fmt(c);$("tDur").textContent=fmt(d);
  const s=$("seek"); if(!s.dragging) s.value=d?Math.round(c/d*1000):0;
  s.style.setProperty("--fill",p+"%");
  $("ring").style.strokeDashoffset=603-603*p/100;
  $("miniProg").style.width=p+"%";
  // while an आरती is waiting to begin, the bar says so instead of the time
  $("miniSub").textContent=waitLeft?("in "+waitLeft+"s"):(fmt(c)+(d?" / "+fmt(d):""));
  const ic=audio.paused?PLAY:PAUSE;
  $("bigPlay").innerHTML=ic;$("miniPlay").innerHTML=ic;
  document.body.classList.toggle("playing",!audio.paused);
  paintReader();
  if(openSh===$("audioPanel")) paintPanel();
}


/* Writes where the song has got to, for the ONE kind of item that resumes.
   A path item is excluded at the door: no mark is ever written for a verse, so
   nothing can be read back for one either, whatever a later reader does.

   Clears the mark near the end so a finished song does not offer to resume at
   its last second. That is a RESUME convenience only — completion is `ended`,
   never this test. See advance().

   `slid` is true only from the two seek bars. For a `resume:"slider"`
   collection nothing else writes: the time ticking, a pause and the page
   going away all leave the dragged-to place as it was. It is compared with
   `true` and not taken as truthy, because pagehide hands this its Event. */
async function saveMark(slid){
  if(!S.cur||S.cur.path)return; const c=audio.currentTime;
  if(!isFinite(c))return;
  const bySlider=!!(S.cur.coll&&S.cur.coll.resume==="slider");
  if(bySlider&&slid!==true)return;
  if(audio.duration&&c>audio.duration-5) await del("marks",S.cur.id);
  else await put("marks",{pos:c,updated:Date.now(),slid:bySlider},S.cur.id);
}

/* The mark a tap may honour. In a `resume:"slider"` collection only one the
   seek bar wrote counts; the builds before 2026-09-28 wrote one on every
   pause, with no `slid`, and a phone still holds those. */
function tapMark(coll,m){
  return m&&(!coll||coll.resume!=="slider"||m.slid)?m:null;
}

/* A hiccup must not end the sitting. The network changes, the stream is cut,
   the phone comes back from sleep: the element fires `error`, or simply stops
   advancing, and playback used to die there behind a toast nobody sees. This
   re-attaches the same file, seeks back to where it stopped and carries on —
   three tries, and only then does it say so.

   It can never fabricate a completion: `ended` is untouched, and a pad that
   was recovered mid-way still has to play out to its own end to count. */
function recover(){
  if(!S.cur||!curSrc)return;
  if(retries>=3){toast("Could not play this file.");return;}
  retries++; stallAt=-1; stallTicks=0;
  const at=audio.currentTime||0;
  audio.src=curSrc;
  audio.onloadedmetadata=()=>{
    if(at>0&&isFinite(audio.duration)&&at<audio.duration-1) audio.currentTime=at;
    paint(); audio.play().catch(paint);
  };
  audio.load();
}

/* Some stalls are silent — no `error`, the clock just stops. Fifteen seconds
   of no progress while we are meant to be playing is one of those. */
setInterval(()=>{
  if(!S.cur||audio.paused||audio.ended){stallAt=-1;stallTicks=0;return;}
  const t=audio.currentTime;
  if(t===stallAt){ if(++stallTicks>=3) recover(); }
  // Five seconds of real progress means the last recovery held. Clearing the
  // count here and not in `timeupdate` matters: a timeupdate still fires
  // between a reload and the failure that follows it, and resetting there made
  // recover() retry a hopeless seek for ever.
  else { if(stallAt>=0) retries=0; stallAt=t; stallTicks=0; }
},5000);

audio.addEventListener("timeupdate",()=>{
  paint();
  const n=Date.now(); if(n-saveAt>5000){saveAt=n;saveMark();}
});
audio.addEventListener("play",paint);
audio.addEventListener("pause",()=>{paint();saveMark();});
audio.addEventListener("ended",async()=>{
  if(S.cur) await del("marks",S.cur.id);
  const t=S.cur;

  // a path item has played through to its end — the one thing that counts as done
  if(t&&t.path){
    const c=t.path;
    // Repeat HOLDS the position. Sitting with one pad plays it again and
    // again and never marks it done, which is the whole point of dwelling.
    if(S.repeat){ await playPath(c,t.n,false,false); return; }
    if(posOf(c)===t.n) await advance(c,t.n);
    /* An item you arrive at starts at its top — as every item now does. This
       began as a bug report about exactly this line: a verse half-heard
       yesterday came in mid-word behind the one that had just finished. */
    const s=S.session;
    if(s&&s.pathId===c.id&&s.items[s.i]===t.n&&s.i+1<s.items.length){
      /* AUTO-PLAY OFF HOLDS THE PAGE — inside a sitting as well as outside one.
         The switch says "Play next verse when this ends", and until now a
         sitting was exempt from it: opened from a tile it ran to its own end
         whatever the switch said, and only a pad tapped on its own obeyed. That
         is the line overturned here. Off means the recitation stops on the
         verse it has just finished, however that verse was reached, and the
         page is turned by hand.

         The sitting is NOT ended by this, only held: `s.i` still points at this
         verse, so turning the page re-seats the sitting from there (jumpTo) and
         the sitting's LAST verse still falls through below to end it and say so.
         And the hand-turned page sounds by itself, which is the other half of
         the same wish: playPath carries the silence habit, and a verse that ran
         to its end never set it — so play on + auto-play off is a swipe, and
         the next verse speaks as it arrives. */
      if(!autoOf(c)){ paint(); render(); return; }
      s.i++; await playPath(c,s.items[s.i],false,false); return;
    }
    if(s&&s.pathId===c.id){S.session=null;toast(W(c,"sessionDone"));}
    // A pad tapped on its own is not part of a session, but the reciter still
    // expects the path to carry on into the next one. Auto-play is the path's
    // OWN setting now — the one in Settings governs रसिक पदावली alone. It walks
    // the path's order, closing pad included, and stops at the end.
    else if(autoOf(c)&&t.n<lastIndex(c)){ await playPath(c,t.n+1,false,false); return; }
    paint(); render(); return;
  }

  if(t&&t.coll&&t.coll.chains){
    const pair=t.coll.chains.find(p=>p[0]===t.idx);
    if(pair){startChain(t.coll,pair[1]);return;}
  }
  if(t&&t.kind==="user"&&S.autoplay&&S.qi>-1&&S.qi+1<S.queue.length){
    S.qi++; playTrack(S.queue[S.qi],false,true); return;   // arrived at, so from its top
  }
  paint(); render();
});

/* आरती: the two pairs run on from one another after a short gap. Carried
   across unchanged — the behaviour lives in manifest.json's `chains`. */
function startChain(c,nextIdx){
  const gap=(S.man.rules&&S.man.rules.aratiChainGapSeconds)||10;
  countdown(c.tracks[nextIdx].title,gap,false,()=>playFixed(c,nextIdx,true));
}

function mediaMeta(t){
  if(!("mediaSession" in navigator))return;
  const grp=t.coll||t.path;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:t.name,artist:grp?grp.title:"रसिक पदावली",album:"राधा"});
  // clearChain: the lock screen's play means "now", exactly as the bar's does,
  // so a lead-in still counting down must not fire a second play behind it
  navigator.mediaSession.setActionHandler("play",()=>{clearChain();setSilent(false);audio.play();});
  // and the lock screen's pause means stop, a wait included: during a lead-in
  // the silence is what is "playing", so this is the button it shows
  navigator.mediaSession.setActionHandler("pause",()=>{clearChain();setSilent(true);audio.pause();});
  navigator.mediaSession.setActionHandler("seekbackward",()=>audio.currentTime-=30);
  navigator.mediaSession.setActionHandler("seekforward",()=>audio.currentTime+=30);
}

/* ---------- sheets ---------- */
let openSh=null;
function showSheet(e){openSh=e;e.classList.add("on");$("scrim").classList.add("on");}
function hideSheets(){if(openSh)openSh.classList.remove("on");openSh=null;
  stopOfflinePoll();
  $("scrim").classList.remove("on");$("dlg").classList.remove("on");paintReader();}
$("scrim").addEventListener("click",hideSheets);
$("fab").addEventListener("click",()=>showSheet($("addSheet")));
$("settingsBtn").addEventListener("click",async()=>{paintOffline();paintScriptRows();showSheet($("setSheet"));
  if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    $("storageLine").textContent=bytes(e.usage||0)+" used";}
  else $("storageLine").textContent="Not reported by this browser";});

// Coming back is the half that matters for the lock: the browser dropped it
// on the way out and only a fresh request holds the screen again.
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveMark();syncWake();});
window.addEventListener("pagehide",saveMark);

/* What a long press on a slide asks. `run` is the restart it will do if the
   answer is yes — restartPath for a sitting, restartReading for a recording —
   so this knows nothing about either. */
let restartCb=null;
function openRestartSheet(c,name,range,run){
  restartCb=run;
  const h=$("restartSheetTitle");
  h.textContent=range?name+"  \u00b7  "+range:name;
  h.className=clsOf(c);
  const l=$("actRestartLabel");
  l.textContent=W(c,"fromStart");
  l.className=clsOf(c);
  showSheet($("restartSheet"));
}
/* Why the action waits.

   Closing a sheet hands its history entry back with a traversal, and
   `syncHistory` refuses to push anything while that traversal is in flight. So
   a layer opened in the same breath — and this action opens the READER — is
   never recorded, and the popstate that lands a moment later sees a screen one
   layer deeper than the entry it arrived on and closes it. Since v37 that close
   also pauses, so the recitation the press asked to restart would stop the
   instant it started.

   Every other sheet action either opens nothing (Start from beginning, Delete)
   or keeps the scrim up throughout (Rename, which hands straight to the
   dialog), which is why this is the first one to need the wait. The traversal
   normally lands within a frame; the timer is only a belt for the case where no
   traversal was asked for at all. */
function afterSheet(fn){
  if(!fn){hideSheets();return;}
  let done=false;
  const run=()=>{if(done)return;done=true;
    window.removeEventListener("popstate",run); clearTimeout(tm); fn();};
  const tm=setTimeout(run,320);
  window.addEventListener("popstate",run);   // after the app's own handler
  hideSheets();
}
$("actRestart").addEventListener("click",()=>{
  const f=restartCb; restartCb=null; afterSheet(f);});
$("actRestartCancel").addEventListener("click",hideSheets);

function openItemSheet(t){S.target=t;$("itemSheetTitle").textContent=t.name;
  const fx=t.kind==="fixed";
  $("actRename").style.display=fx?"none":"";
  $("actDelete").style.display=fx?"none":"";
  $("actClearMark").style.display=(fx||(t.node&&t.node.type==="file"))?"":"none";
  showSheet($("itemSheet"));}

/* ---------- dialog ---------- */
let dcb=null;
function ask(title,val,cb){$("dlgTitle").textContent=title;$("dlgInput").value=val;dcb=cb;
  $("scrim").classList.add("on");$("dlg").classList.add("on");
  setTimeout(()=>{$("dlgInput").focus();$("dlgInput").select();},60);}
$("dlgCancel").addEventListener("click",hideSheets);
$("dlgOk").addEventListener("click",()=>{const v=$("dlgInput").value.trim();hideSheets();if(v&&dcb)dcb(v);});
$("dlgInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("dlgOk").click();});

/* ---------- actions ---------- */
$("actNewFolder").addEventListener("click",()=>{hideSheets();
  ask("New folder","",async n=>{await put("nodes",{id:uid(),parentId:S.cwd,type:"folder",name:n,created:Date.now()});render();});});
$("actUpload").addEventListener("click",()=>{hideSheets();$("filePicker").click();});
$("filePicker").addEventListener("change",async e=>{
  const fs=[...e.target.files];e.target.value="";if(!fs.length)return;
  toast("Saving "+fs.length+" file"+(fs.length>1?"s":"")+"…");
  for(const f of fs){const id=uid();await put("blobs",f,id);
    await put("nodes",{id,parentId:S.cwd,type:"file",name:noExt(f.name),
      size:f.size,mime:f.type,duration:0,created:Date.now()});}
  toast("Added");render();});
$("actRename").addEventListener("click",()=>{const t=S.target;hideSheets();
  ask("Rename",t.name,async n=>{t.node.name=n;await put("nodes",t.node);
    if(S.cur&&S.cur.id===t.node.id){S.cur.name=n;$("miniName").textContent=n;$("nowName").textContent=n;}
    render();});});
$("actClearMark").addEventListener("click",async()=>{const t=S.target;hideSheets();
  await del("marks",t.id);if(S.cur&&S.cur.id===t.id)audio.currentTime=0;
  toast("Will start from the beginning");render();});
$("actDelete").addEventListener("click",async()=>{const t=S.target;hideSheets();
  if(!confirm("Delete “"+t.name+"”"+(t.node.type==="folder"?" and everything inside it":"")+"?"))return;
  await rm(t.node);
  if(S.cur&&S.cur.id===t.node.id){audio.pause();audio.removeAttribute("src");S.cur=null;
    $("mini").hidden=true;document.body.classList.remove("has-mini","player-open","path-play");}
  render();});
async function rm(n){if(n.type==="folder"){for(const k of await kids(n.id))await rm(k);}
  else{await del("blobs",n.id);await del("marks",n.id);} await del("nodes",n.id);}

$("autoplayRow").addEventListener("click",async()=>{S.autoplay=!S.autoplay;
  $("autoplaySw").classList.toggle("on",S.autoplay);await put("meta",S.autoplay,"autoplay");});

/* ---------- controls ---------- */
$("backBtn").addEventListener("click",goBack);
$("homeBtn").addEventListener("click",goHome);
$("rbHome").addEventListener("click",goHome);   // the slide's own, same call
$("miniOpen").addEventListener("click",()=>{
  // the mini bar belongs to whatever is playing, so it takes the reader back
  const t=S.cur;
  if(t&&t.path&&S.read){S.read=null;document.body.classList.remove("text-play");
    document.body.classList.add("path-play");showVerse(t.path,t.n);render();}
  document.body.classList.add("player-open");});
$("playerClose").addEventListener("click",closeReader);
$("miniPlay").addEventListener("click",toggleAudio);
$("bigPlay").addEventListener("click",toggleAudio);

/* ---------- the reader's bar ---------- */
$("rbPick").addEventListener("click",openPicker);
$("pickClose").addEventListener("click",hidePicker);
$("rbSmaller").addEventListener("click",()=>setFont(S.font-FONT_STEP));
$("rbBigger").addEventListener("click",()=>setFont(S.font+FONT_STEP));
$("rbAudio").addEventListener("click",()=>{
  if(openSh===$("audioPanel"))hideSheets();
  else{paintPanel();showSheet($("audioPanel"));paintReader();}});
$("rbPlay").addEventListener("click",toggleAudio);
$("rbGloss").addEventListener("click",()=>setGloss(!S.gloss));

/* Turning the page with the thumb — two gestures into the one path,
   readerStep(). They are the ONLY way to turn it: the bar's prev/next buttons
   were taken off in v50, so every slide this bar is on must keep them.

   The DRAG: the words scroll up and down inside one item, so only a decisively
   sideways one counts. Leftwards brings the next page in from the right.

   The TAP, the way a Kindle does it: the right edge forward, the left edge
   back, and the wide middle deliberately DEAD — that is where a thumb rests
   and where the eye reads, and v39 removed the toggle that used to live there
   for exactly that reason. A tap NEVER starts or stops the recitation; play
   and pause are buttons and stay buttons.

   `turnedAt` is why the two do not fight: a drag can still be followed by a
   click on some browsers, and that click would land in one of the edges and
   turn a second page. After a drag the tap stands down for half a second. */
const TAP_EDGE=0.30;      // of the width, each side; the middle 40% does nothing
let turnedAt=0;
(function(){
  const vs=$("verseScroll"); let x0=null,y0=null;
  vs.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){x0=null;return;}
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;},{passive:true});
  vs.addEventListener("touchend",e=>{
    if(x0===null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.6)return;
    turnedAt=Date.now();
    readerStep(dx<0?1:-1);},{passive:true});
  vs.addEventListener("click",e=>{
    if(Date.now()-turnedAt<500)return;
    // a व्याख्या fold, or anything else inside the words that is its own control
    if(e.target.closest("summary,button,a,input,select,textarea"))return;
    // a tap that puts down a selection is dismissing it, not turning a page.
    // A belt since v42, which took selection off the words altogether — see
    // the body rule and why Google was appearing over them.
    const sel=window.getSelection&&window.getSelection();
    if(sel&&!sel.isCollapsed)return;
    const r=vs.getBoundingClientRect(); if(!r.width)return;
    const f=(e.clientX-r.left)/r.width;
    if(f<TAP_EDGE) readerStep(-1);
    else if(f>1-TAP_EDGE) readerStep(1);
  });
})();

/* ---------- the audio panel ---------- */
$("apPlay").addEventListener("click",toggleAudio);
const apSeek=$("apSeek");
apSeek.addEventListener("input",()=>{apSeek.dragging=true;const d=audio.duration||0;
  $("apCur").textContent=fmtHMS(d*apSeek.value/1000);
  apSeek.style.setProperty("--fill",(apSeek.value/10)+"%");});
apSeek.addEventListener("change",()=>{const d=audio.duration||0;
  audio.currentTime=d*apSeek.value/1000;apSeek.dragging=false;saveMark(true);});
$("apSlower").addEventListener("click",()=>setSpeed(S.speed-SPD_STEP));
$("apFaster").addEventListener("click",()=>setSpeed(S.speed+SPD_STEP));
$("apRepeatRow").addEventListener("click",()=>setRepeat(!S.repeat));
$("apAutoRow").addEventListener("click",()=>{
  const c=S.cur&&S.cur.path; if(!c){toast("Open a path first");return;}
  setAuto(c,!autoOf(c));});

$("back30").addEventListener("click",()=>audio.currentTime=Math.max(0,audio.currentTime-30));
$("fwd30").addEventListener("click",()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+30));
const seek=$("seek");
seek.addEventListener("input",()=>{seek.dragging=true;const d=audio.duration||0;
  $("tCur").textContent=fmt(d*seek.value/1000);seek.style.setProperty("--fill",(seek.value/10)+"%");});
seek.addEventListener("change",()=>{const d=audio.duration||0;
  audio.currentTime=d*seek.value/1000;seek.dragging=false;saveMark(true);});
/* ---------- back ----------
   One press closes exactly one thing: the picker, then a sheet, then the
   raised player, then one step up the views — and from the tiles, with
   nothing open, it leaves the app.

   The history stack MIRRORS how deep the screen is: one entry per open layer,
   pushed as the layer opens. The old model kept a SINGLE spare entry and
   re-pushed it from inside `popstate`, which is a race — the entry the second
   of two quick presses needs does not exist yet when that press is handled, so
   it fell through to the bottom and closed the app. That is the reported bug,
   and it only ever showed with something playing because that is the one flow
   needing two presses in a row (close the player, then leave the slide).

   Each entry carries its own depth, so `popstate` never has to count: it reads
   where it landed and closes layers until the screen agrees. A traversal of
   several entries fires ONE popstate, and the same loop covers it. */
let histDepth=0,histPending=null;
function uiDepth(){
  let d=0;
  if(S.view==="library")d=1+S.stack.length;       // one per folder entered
  else if(S.view!=="home")d=1;
  if(document.body.classList.contains("player-open"))d++;
  if($("scrim").classList.contains("on"))d++;     // a sheet OR the rename dialog
  if(pickerOpen())d++;
  return d;
}
/* innermost first, in the same order uiDepth counts them */
function closeLayer(){
  if(pickerOpen()){hidePicker();return true;}
  if($("scrim").classList.contains("on")){hideSheets();return true;}
  if(document.body.classList.contains("player-open")){closeReader();return true;}
  if(S.view!=="home"){goBack();return true;}
  return false;
}
function syncHistory(){
  if(histPending)return;                          // a traversal we asked for is in flight
  const want=uiDepth();
  if(want>histDepth){
    while(histDepth<want){histDepth++;history.pushState({d:histDepth},"");}
  }
  else if(want<histDepth){
    /* The screen closed a layer by itself — the app’s own back arrow, the
       player’s ✕, a tap on the scrim. Hand the entries back, or the next
       press would be spent on an entry with nothing left to close. */
    const n=histDepth-want;
    histPending=setTimeout(()=>{histPending=null;},1000);   // never stay stuck
    history.go(-n);
  }
}
/* Every layer announces itself in a class — `player-open` on the body, `on`
   on the scrim and on the picker — so the classes are watched and no caller
   has to remember. The views are the one exception, and they all go through
   render(). */
const histWatch=new MutationObserver(syncHistory);
for(const el of [document.body,$("scrim"),$("pickOv")])
  histWatch.observe(el,{attributes:true,attributeFilter:["class"]});

window.addEventListener("popstate",e=>{
  if(histPending){clearTimeout(histPending);histPending=null;}
  histDepth=(e.state&&typeof e.state.d==="number")?e.state.d:0;
  // the bound is a belt against a layer that will not close, nothing more
  for(let i=0;i<8&&uiDepth()>histDepth;i++) if(!closeLayer())break;
  /* And reconcile once more. A screen that shut two layers while a traversal
     was in flight — the back ARROW held down, `home()` in the tests — could
     only be half-answered then, because `histPending` was set; this is where
     the rest of it lands. */
  syncHistory();
});

/* ---------- boot ---------- */
(async function(){
  db=await openDB();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  try{const r=await fetch("manifest.json",{cache:"no-cache"});
    if(r.ok){const m=await r.json();
      if(m&&Array.isArray(m.collections)&&m.collections.length)S.man=m;}}catch(e){}
  for(const c of S.man.collections){
    if(!isPath(c)&&!isText(c))continue;
    const p=await get("meta","pos:"+c.id);
    S.pos[c.id]=(typeof p==="number"&&p>=0&&p<=lastIndex(c))?p:0;
    const s=await get("meta","script:"+c.id);
    if(s&&c.scripts.some(x=>x.id===s)) S.script[c.id]=s;
    const au=await get("meta","auto:"+c.id);
    if(au!==undefined) S.auto[c.id]=!!au;
    const vp=await get("meta","vpos:"+c.id);
    if(vp&&typeof vp==="object") S.vpos[c.id]=vp;
    const rd=await get("meta","rpos:"+c.id);
    if(rd&&typeof rd==="object") S.rpos[c.id]=rd;
  }
  const ap=await get("meta","autoplay"); S.autoplay=ap===undefined?true:ap;
  $("autoplaySw").classList.toggle("on",S.autoplay);
  // undefined is a first launch, and a first launch is silent — `!!undefined`
  // would have made it sound, which is the whole complaint this answers
  const sl=await get("meta","silent"); S.silent=(sl===undefined)?true:!!sl;
  const sp=await get("meta","speed");
  if(typeof sp==="number"&&sp>=SPD_MIN&&sp<=SPD_MAX) S.speed=sp;
  audio.playbackRate=S.speed;
  const rp=await get("meta","repeat"); S.repeat=!!rp;
  const gl=await get("meta","gloss"); S.gloss=!!gl;
  const fs=await get("meta","fontsize");
  S.font=(typeof fs==="number"&&fs>=FONT_MIN&&fs<=FONT_MAX)?fs:FONT_DEF;
  document.documentElement.style.setProperty("--verse-size",S.font+"px");
  paintPanel(); paintReader();
  $("bigPlay").innerHTML=PLAY;$("miniPlay").innerHTML=PLAY;
  /* A reload lands on whatever entry the app was sitting on, but the screen
     always starts at the tiles. Adopt that depth so the render below takes the
     stack back down to match, instead of leaving dead presses above us. */
  histDepth=(history.state&&typeof history.state.d==="number")?history.state.d:0;
  await render();
})();

})();
</script>
<script>
// Offline support. Registered after load so it can never delay or alter the
// first paint; if registration fails the app carries on exactly as before.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
