<script>
(function(){
"use strict";

const FALLBACK={collections:[],rules:{aratiChainGapSeconds:10}};

/* ---------- db ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("baithak",1);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains("nodes")) d.createObjectStore("nodes",{keyPath:"id"}).createIndex("parent","parentId");
    if(!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs");
    if(!d.objectStoreNames.contains("marks")) d.createObjectStore("marks");
    if(!d.objectStoreNames.contains("meta"))  d.createObjectStore("meta");};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error);});
const put=(s,v,k)=>rq(st(s,"readwrite").put(v,k));
const get=(s,k)=>rq(st(s,"readonly").get(k));
const del=(s,k)=>rq(st(s,"readwrite").delete(k));
const kids=p=>rq(st("nodes","readonly").index("parent").getAll(p));
/* A whole store as one Map. The pickers are long — 86 pads, 91 verses in a
   group — and asking for each row's mark and duration one at a time is that
   many sequential round trips, which is visibly slow to paint on a phone.
   Two bulk reads answer the whole list instead. */
async function mapOf(s){
  const [k,v]=await Promise.all([rq(st(s,"readonly").getAllKeys()),
                                 rq(st(s,"readonly").getAll())]);
  const m=new Map(); k.forEach((kk,i)=>m.set(kk,v[i])); return m;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- state ---------- */
const S={man:FALLBACK,view:"home",cwd:"root",stack:[],coll:null,grp:0,
  autoplay:true,queue:[],qi:-1,cur:null,target:null,
  pos:{},      // path id -> the next item to play      (persisted "pos:<id>")
  script:{},   // path id -> chosen script id           (persisted "script:<id>")
  text:{},     // "<pathId>:<scriptId>" -> rows | null  (fetched once)
  div:{},      // path id -> level-1 cut points         (persisted "div:<id>")
  sub:{},      // path id -> {divIndex: cut points}     (persisted "sub:<id>")
  auto:{},     // path id -> carry on into the next one (persisted "auto:<id>")
  divEdit:null,// which text the division sheet is editing
  // Reading with the music off is a HABIT, not a property of a text: one flag
  // for the app, remembered across items and across launches. Only an explicit
  // play gesture clears it — see setSilent().
  silent:false,// (persisted "silent")
  speed:1,     // playback rate 0.50–2.00               (persisted "speed")
  repeat:false,// repeat this item, holding the position(persisted "repeat")
  font:18,     // the words' size in px                 (persisted "fontsize")
  session:null // {pathId,items:[n,…],i}  while a session is running
};
const FONT_MIN=16,FONT_MAX=40,FONT_STEP=2,FONT_DEF=18;
const SPD_MIN=0.5,SPD_MAX=2,SPD_STEP=0.05;
const $=i=>document.getElementById(i);
const audio=$("audio");

function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")
          :m+":"+String(x).padStart(2,"0");}
/* the panel says hours even when there are none, so the digits never shift */
function fmtHMS(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return [h,m,x].map(v=>String(v).padStart(2,"0")).join(":");}
const noExt=n=>n.replace(/\.(mp3|m4a|aac|wav|ogg|opus|flac|mp4|webm)$/i,"");
function bytes(b){return b<1048576?(b/1024).toFixed(0)+" KB"
  :b<1073741824?(b/1048576).toFixed(1)+" MB":(b/1073741824).toFixed(2)+" GB";}
let tT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),2400);}
const PLAY='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const PAUSE='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
const NOTE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>';
const FOLDER='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';
const CHEV='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function longPress(el,fn){let t=null,f=false;
  const s=()=>{f=false;t=setTimeout(()=>{f=true;t=null;if(navigator.vibrate)navigator.vibrate(15);fn();},480);};
  const c=()=>{if(t){clearTimeout(t);t=null;}};
  el.addEventListener("touchstart",s,{passive:true});
  el.addEventListener("touchmove",c,{passive:true});
  el.addEventListener("touchend",c);el.addEventListener("touchcancel",c);
  el.addEventListener("mousedown",s);el.addEventListener("mouseup",c);el.addEventListener("mouseleave",c);
  el.addEventListener("contextmenu",e=>{e.preventDefault();if(!f)fn();});
  el.addEventListener("click",e=>{if(f){e.preventDefault();e.stopPropagation();f=false;}},true);}

/* ================================================================
   THE PATHS — श्री हित चौरासी जी and श्री मद् राधा सुधा निधि

   Both slides run on the same engine. One number per path says where it
   stands: `pos`, THE NEXT ITEM TO PLAY. It runs over the whole sequence —
   0 (the opening pad), 1…count (the body), and for the Chaurasi 85 (the
   closing pad) — not over the body alone. Everything else falls out of that:

     · The bracket needs no state. pos===0 means the opening pad has not been
       heard this cycle, so any session starting there opens with it. That is
       why the evening session does not replay it, and why resuming into
       one-go from pad 41 does not either: the bracket belongs to the cycle,
       and the cycle's progress IS pos.
     · A cycle ends by returning pos to 0 — never to 1. The user's rule:
       "every cycle opens with the praise pad, no matter how it was reached."
     · The two modes share the one pos, so tapping either resumes where the
       other left off.
   ================================================================ */

const isPath=c=>!!c&&c.mode==="path";
function scriptOf(c){const id=S.script[c.id];
  return c.scripts.find(s=>s.id===id)||c.scripts[0];}
function posOf(c){const p=S.pos[c.id];return typeof p==="number"?p:0;}
/* the final item of a cycle: the closing pad where there is one, else the body's end */
const lastIndex=c=>c.close?c.close.n:c.count;

async function loadText(c){
  const sc=scriptOf(c),key=c.id+":"+sc.id;
  if(key in S.text) return S.text[key];
  if(!sc.text){S.text[key]=null;return null;}   // nothing written yet — say so, don't fake it
  try{const r=await fetch(sc.text,{cache:"force-cache"});
      S.text[key]=r.ok?await r.json():null;}
  catch(e){S.text[key]=null;}
  return S.text[key];
}
/* rows are built so that index === item number: rows[n] is SHCJ<n> / SMRSNJ_<n> */
function rowFor(c,n){const rows=S.text[c.id+":"+scriptOf(c).id];return rows?rows[n]:null;}
function firstLine(c,n){const r=rowFor(c,n);if(!r)return "";
  const ln=r.t.split("\n").find(x=>x.trim());return ln?ln.trim():"";}
function bracketLabel(c,which){
  const sc=scriptOf(c),b=c[which];
  return (which==="open"?sc.openLabel:sc.closeLabel)||(b&&b.label)||"";}
function itemTitle(c,n){
  if(c.open&&n===c.open.n) return bracketLabel(c,"open");
  if(c.close&&n===c.close.n) return bracketLabel(c,"close");
  return scriptOf(c).itemLabel+" "+n;}

/* ---------- how a path is divided into sittings ----------

   A division is stored as its CUT POINTS — the item each division ends on, bar
   the last — and never as ranges. Gaps and overlaps then cannot be expressed at
   all: the first division always begins at 0 and the last always ends at
   lastIndex, so the praise pad is always inside the first session and the
   phalashruti always inside the last, with nothing to check afterwards. They
   are parts of those sessions, not a bracket around the day.

   Position needs no migration when a boundary moves either. `pos` is an item
   number; which division holds it is worked out afresh on every render, so
   changing a split resolves to whichever session now contains the item. */

const DIV_MIN=2,DIV_MAX=6;

function evenCuts(from,to,n){                  // n divisions over from..to
  const total=to-from+1,cuts=[];
  for(let i=1;i<n;i++) cuts.push(from+Math.round(total*i/n)-1);
  return cuts;
}
function rangesFrom(from,to,cuts){
  const out=[];let a=from;
  for(const c of cuts){out.push({from:a,to:c});a=c+1;}
  out.push({from:a,to:to});
  return out;
}
function cutsValid(from,to,cuts){
  if(!Array.isArray(cuts)||cuts.length<DIV_MIN-1||cuts.length>DIV_MAX-1)return false;
  let prev=from-1;
  for(const c of cuts){if(!Number.isInteger(c)||c<=prev||c>=to)return false;prev=c;}
  return true;
}
/* The manifest's own blocks are the default while the count matches them —
   that is where 31/30/25 and 91/90/90 come from. Any other count splits the
   BODY evenly and lets the brackets ride the outer divisions. */
function defaultCuts(c,n){
  if(n===undefined) n=(c.blocks&&c.blocks.length)||3;
  if(c.blocks&&c.blocks.length===n) return c.blocks.slice(0,-1).map(b=>b.to);
  return evenCuts(c.open?c.open.n+1:0,c.count,n);
}
/* Sub-divisions skip the opening bracket when splitting, so it joins the first
   sub-tile rather than forming one of its own: block 1 is 31/30/30, not 30/30/31. */
function defaultSubCuts(c,d,n){
  return evenCuts((c.open&&d.from===c.open.n)?d.from+1:d.from,d.to,n===undefined?3:n);
}
const hasSubs=c=>!!c.groups;                   // RSN alone goes a layer deeper
function divsOf(c){
  const to=lastIndex(c),cuts=S.div[c.id];
  return rangesFrom(0,to,cutsValid(0,to,cuts)?cuts:defaultCuts(c));
}
function subsOf(c,i){
  const d=divsOf(c)[i],cuts=(S.sub[c.id]||{})[i];
  return rangesFrom(d.from,d.to,cutsValid(d.from,d.to,cuts)?cuts:defaultSubCuts(c,d));
}
function divIndex(c,n){const ds=divsOf(c);
  for(let i=0;i<ds.length;i++) if(n>=ds[i].from&&n<=ds[i].to) return i;
  return 0;}
function subIndex(c,i,n){const ss=subsOf(c,i);
  for(let k=0;k<ss.length;k++) if(n>=ss[k].from&&n<=ss[k].to) return k;
  return 0;}

/* what a division covers, in words: "प्रशस्ति · पद 1–30" */
function rangeText(c,d){
  const sc=scriptOf(c),bits=[];let from=d.from,to=d.to;
  if(c.open&&from===c.open.n){bits.push(bracketLabel(c,"open"));from++;}
  let closes=false;
  if(c.close&&to===c.close.n){closes=true;to--;}
  if(to>=from) bits.push(from===to?sc.itemLabel+" "+from
                                  :sc.itemLabel+" "+from+"–"+to);
  if(closes) bits.push(bracketLabel(c,"close"));
  return bits.join(" · ");
}

/* auto-play is the path's own, not the library's — see the audio panel */
function autoOf(c){const a=S.auto[c.id];return a===undefined?true:!!a;}

/* THE COMPLETION RULE. A pad counts as done ONLY if it played through to its
   end — the `ended` event, nothing else. There is no time window and nothing
   to tune. Stopping part-way leaves pos where it is, and the item's own
   `marks` entry remembers how far in you were, so it resumes mid-pad.

   Do NOT reintroduce a near-the-end test here. saveMark() below clears a mark
   within 5s of the end; that is a resume convenience and must never be read
   as completion. */
async function advance(c,n){
  const last=lastIndex(c);
  const next=(n>=last)?0:n+1;   // the cycle closes by parking at 0, the opening pad
  S.pos[c.id]=next;
  await put("meta",next,"pos:"+c.id);
}

async function playPath(c,n,fromStart,raise,startPaused){
  clearChain();
  await loadText(c);
  if(startPaused===undefined) startPaused=S.silent;
  playTrack({id:"px:"+c.id+":"+n,name:itemTitle(c,n),url:c.audio.replace("{n}",n),
             path:c,n:n,kind:"path"},fromStart,startPaused);
  // The words are the point of a path slide, so a deliberate start shows them
  // straight away instead of leaving them behind a tap on the mini bar. An
  // automatic advance mid-session passes no flag, so a player the user has
  // closed stays closed.
  if(raise) document.body.classList.add("player-open");
}
/* A session is one division played to its end. If the path already stands
   inside it we resume there; if it stands elsewhere the position MOVES to this
   division's first item, so "where I am" stays honest and finishing a sitting
   walks the highlight on to the next tile. A session always runs to its end —
   the auto-play toggle governs what happens OUTSIDE one. */
async function startSession(c,d){
  let p=posOf(c);
  if(p<d.from||p>d.to){p=d.from;S.pos[c.id]=p;await put("meta",p,"pos:"+c.id);}
  const items=[];for(let n=p;n<=d.to;n++) items.push(n);
  S.session={pathId:c.id,items:items,i:0,from:d.from,to:d.to};
  await setSilent(false);            // tapping a sitting is a play gesture
  await playPath(c,items[0],false,true,false);
}
/* Long press: put the text back to its start and begin this sitting at its own
   first item. `pos` stays at 0, and advance() only moves it when the item that
   plays IS the item the path stands on, so nothing is pushed forward silently. */
async function restartPath(c,d){
  S.session=null;S.pos[c.id]=0;await put("meta",0,"pos:"+c.id);
  toast("आरम्भ से");
  const items=[];for(let n=d.from;n<=d.to;n++) items.push(n);
  S.session={pathId:c.id,items:items,i:0,from:d.from,to:d.to};
  await setSilent(false);
  await playPath(c,d.from,true,true,false);
}

/* ---------- render ---------- */
async function render(){
  const L=$("list"); L.innerHTML="";
  $("backBtn").hidden = S.view==="home";
  $("fab").hidden = !(S.view==="library");

  if(S.view==="home"){
    setTitle("राधा","",true); await renderTiles(L); return;
  }
  if(S.view==="collection"){
    setTitle(S.coll.title,S.coll.range||"",true); await renderColl(S.coll,L); return;
  }
  if(S.view==="path"){
    setTitle(S.coll.title,"",true); await renderPath(S.coll,L); return;
  }
  if(S.view==="pathsub"){
    const d=divsOf(S.coll)[S.grp];
    setTitle(S.coll.title,rangeText(S.coll,d),true);
    await renderPathSub(S.coll,L); return;
  }
  if(S.stack.length) setTitle(S.stack[S.stack.length-1].name,
    "रसिक पदावली / "+S.stack.map(x=>x.name).join(" / "),false);
  else setTitle("रसिक पदावली","",true);
  await renderUser(L);
}
function setTitle(t,crumb,dv){
  $("pageTitle").firstChild.nodeValue=t;
  $("pageTitle").classList.toggle("dv",!!dv);
  $("crumb").textContent=crumb;
}

// Which motif each tile wears. Keyed on the manifest's own ids, so a
// collection with no entry simply gets no motif rather than a broken one.
const TILE_MOTIF={
  "arati":"diya",
  "shcj":"flute", "padgayan":"flute",
  "rsn":"charan",
  "sevak-vani":"lotus",
  "padavali":"pothi"
};
// The lotus was asked for in pink; that pairing stays with सेवक वाणी.
const TILE_INK={"sevak-vani":"#C2557A"};

/* the line under a tile's name: for a path, where it currently stands */
function tileRange(c){
  if(isPath(c)){
    const p=posOf(c);
    if(p===0) return c.open?bracketLabel(c,"open"):"आरम्भ";
    if(c.close&&p===c.close.n) return bracketLabel(c,"close");
    return scriptOf(c).itemLabel+" "+p+" / "+c.count;
  }
  return c.range||"";
}

async function renderTiles(L){
  const grid=document.createElement("div"); grid.className="tiles";
  const libCount=(await kids("root")).length;
  for(const c of S.man.collections){
    const soon=c.mode==="soon";
    const t=document.createElement("button");
    t.className="tile"+(soon?" soon":"");
    t.style.setProperty("--tint", TILE_INK[c.id]||c.tint||"#8C5A28");
    const mk=TILE_MOTIF[c.id];
    if(mk) t.dataset.motif=mk;
    let sub="";
    if(soon) sub='<span class="tile-soon dv">शीघ्र</span>';
    else{
      const r=c.mode==="library"?(libCount?libCount+" item"+(libCount>1?"s":""):"अपने गीत"):tileRange(c);
      if(r) sub='<span class="tile-range '+(isPath(c)?(scriptOf(c).cls||"dv"):"dv")+'"></span>';
      t.dataset.sub=r||"";
    }
    t.innerHTML='<span class="tile-alpona"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#m-alpona"/></svg></span>'+
      (mk?'<span class="tile-art"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#m-'+mk+'"/></svg></span>':'')+
      '<span class="tile-hi dv"></span>'+sub;
    t.querySelector(".tile-hi").textContent=c.title;
    const rr=t.querySelector(".tile-range");
    if(rr) rr.textContent=t.dataset.sub;
    t.addEventListener("click",()=>openTile(c));
    grid.appendChild(t);
  }
  L.appendChild(grid);
}

async function renderColl(c,L){
  if(!c.tracks||!c.tracks.length){L.innerHTML='<div class="empty"><b>No recordings yet</b>Add the files to audio/'+c.id+'/ in the repo.</div>';return;}
  const allMarks=await mapOf("marks"), allMeta=await mapOf("meta");
  for(let i=0;i<c.tracks.length;i++){
    const t=c.tracks[i], id=tid(c.id,t.file);
    const row=document.createElement("button");
    row.className="row"+(S.cur&&S.cur.id===id?" current":"");
    row.innerHTML='<span class="glyph">'+NOTE+'</span>';
    const meta=document.createElement("span"); meta.className="meta";
    const nm=document.createElement("span"); nm.className="name dv"; nm.textContent=t.title;
    meta.appendChild(nm);
    const mark=allMarks.get(id), dur=allMeta.get("dur:"+id);
    const sub=document.createElement("span"); sub.className="sub";
    if(mark&&mark.pos>15) sub.innerHTML='<span class="mark">Resume '+fmt(mark.pos)+'</span>'+(dur?' · '+fmt(dur):'');
    else sub.textContent=dur?fmt(dur):"Tap to play";
    meta.appendChild(sub);
    if(mark&&dur&&mark.pos>15){const b=document.createElement("span");b.className="track-bar";
      const ii=document.createElement("i");ii.style.width=Math.min(100,mark.pos/dur*100)+"%";
      b.appendChild(ii);meta.appendChild(b);}
    row.appendChild(meta);
    row.addEventListener("click",()=>playFixed(c,i));
    longPress(row,()=>openItemSheet({kind:"fixed",id,name:t.title}));
    L.appendChild(row);
  }
}

/* one leaf of paper: a sitting, what it covers, and how many items that is */
function stile(c,name,range,count,now){
  const t=document.createElement("button");
  t.className="stile"+(now?" now":"");
  t.style.setProperty("--tint",c.tint||"#8C5A28");
  t.innerHTML=(now?'<span class="snow dv">यहीं</span>':"")+
    '<span class="sname dv"></span><span class="srange"></span><span class="scount"></span>';
  t.querySelector(".sname").textContent=name;
  const r=t.querySelector(".srange");
  r.textContent=range; r.className="srange "+(scriptOf(c).cls||"dv");
  t.querySelector(".scount").textContent=count;
  return t;
}

/* The head of a path slide: which script, and the note about text that is not
   written yet. Both are unchanged; only what follows them is new. */
function pathHead(c,L){
  const sc=scriptOf(c);
  if(c.scripts.length>1){
    const bar=document.createElement("div"); bar.className="scripts";
    for(const x of c.scripts){
      const b=document.createElement("button");
      b.className=(x.id===sc.id?"on":"")+" "+(x.cls||"");
      b.innerHTML='<span></span>'+(x.text?"":'<span class="tag dv">शीघ्र</span>');
      b.querySelector("span").textContent=x.label;
      b.addEventListener("click",async()=>{S.script[c.id]=x.id;
        await put("meta",x.id,"script:"+c.id); render();});
      bar.appendChild(b);
    }
    L.appendChild(bar);
  }
  if(!sc.text){
    const ph=document.createElement("div"); ph.className="ph dv";
    ph.innerHTML="<b></b><span></span>";
    ph.querySelector("b").textContent=sc.placeholderTitle||"अभी तैयार नहीं";
    ph.querySelector("span").textContent=sc.placeholderBody||"";
    L.appendChild(ph);
  }
}

/* Level one: the sittings this text is divided into, and the one-go tile that
   plays the lot. The tile holding the current position wears the gold edge —
   for RSN that is the block the position falls in, and the layer below says
   which third of it. */
async function renderPath(c,L){
  await loadText(c);
  pathHead(c,L);
  const p=posOf(c),ds=divsOf(c),cur=divIndex(c,p);
  const h=document.createElement("div"); h.className="sect dv"; h.textContent="भाग";
  L.appendChild(h);
  const grid=document.createElement("div"); grid.className="stiles";
  ds.forEach((d,i)=>{
    const t=stile(c,"भाग "+(i+1),rangeText(c,d),d.to-d.from+1,i===cur);
    t.addEventListener("click",()=>{
      if(hasSubs(c)){S.grp=i;S.view="pathsub";$("list").scrollTop=0;render();}
      else startSession(c,d);
    });
    longPress(t,()=>restartPath(c,d));
    grid.appendChild(t);
  });
  const all={from:0,to:lastIndex(c)};
  const one=stile(c,"एक साथ",rangeText(c,all),all.to+1,false);
  // Three sittings and एक साथ make a clean 2×2 of equal leaves. Only when the
  // count leaves an odd tile does एक साथ span the row, so there is never a
  // half-empty line at the bottom.
  if((ds.length+1)%2) one.classList.add("wide");
  one.addEventListener("click",()=>startSession(c,all));
  longPress(one,()=>restartPath(c,all));
  grid.appendChild(one);
  L.appendChild(grid);
}

/* Level two, RSN only: the block split into thirds. */
async function renderPathSub(c,L){
  await loadText(c);
  const p=posOf(c),i=S.grp,ss=subsOf(c,i),inHere=divIndex(c,p)===i,cur=subIndex(c,i,p);
  const h=document.createElement("div"); h.className="sect dv";
  h.textContent="भाग "+(i+1)+" के उपभाग";
  L.appendChild(h);
  const grid=document.createElement("div"); grid.className="stiles";
  ss.forEach((d,k)=>{
    const t=stile(c,"उपभाग "+(k+1),rangeText(c,d),d.to-d.from+1,inHere&&k===cur);
    t.addEventListener("click",()=>startSession(c,d));
    longPress(t,()=>restartPath(c,d));
    grid.appendChild(t);
  });
  L.appendChild(grid);
}

/* ================================================================
   THE READER — the bar under the words, and the two panels behind it

   On a path slide the words are the screen. Seven controls sit under them and
   everything else lives in a panel: the transport, the pace, and the two
   toggles a reciter changes mid-sitting.
   ================================================================ */

/* Silence is sticky. Pausing sets it, and only an explicit play gesture — the
   panel's play, the mini bar's play, a session tile, the phone's own media
   keys — clears it. Prev, next, a jump from the picker and reopening the app
   all inherit it, so reading with the music off stays off. */
async function setSilent(v){
  v=!!v; if(S.silent===v)return;
  S.silent=v; await put("meta",v,"silent");
}
function toggleAudio(){
  clearChain();
  if(audio.paused){ setSilent(false); audio.play().catch(()=>{}); }
  else { setSilent(true); audio.pause(); }
}

/* Moving the reader. `pos` follows, because pos is "where I am" and reading in
   silence to shloka 40 should leave me at 40 tomorrow. Completion is untouched:
   it is still the `ended` event, which cannot fire with nothing playing, so a
   silent walk ticks nothing off and moves no tile highlight. */
async function jumpTo(c,n){
  const s=S.session;
  if(s&&s.pathId===c.id&&n>=s.from&&n<=s.to){
    // still inside this sitting: re-seat it here and let it run to its own end
    s.items=[];for(let k=n;k<=s.to;k++)s.items.push(k);
    s.i=0;
  }
  else S.session=null;               // a move out of the sitting ends it
  S.pos[c.id]=n; await put("meta",n,"pos:"+c.id);
  await playPath(c,n,true,false,S.silent);   // deliberate: from the top, not the mark
  render();
}
function readerStep(delta){
  const t=S.cur; if(!t||!t.path)return;
  const c=t.path,n=t.n+delta;
  if(n<0||n>lastIndex(c))return;
  jumpTo(c,n);
}

async function setFont(px){
  px=Math.max(FONT_MIN,Math.min(FONT_MAX,px));
  S.font=px;
  document.documentElement.style.setProperty("--verse-size",px+"px");
  await put("meta",px,"fontsize");
  paintReader();
}

/* The bar's own state: what is reachable from where the reader stands. */
function paintReader(){
  const t=S.cur,path=t&&t.path;
  $("rbPrev").disabled=!path||t.n<=0;
  $("rbNext").disabled=!path||t.n>=lastIndex(path);
  $("rbSmaller").disabled=S.font<=FONT_MIN;
  $("rbBigger").disabled=S.font>=FONT_MAX;
  $("rbAudio").classList.toggle("on",openSh===$("audioPanel"));
}

/* ---------- the item picker ----------

   What it may show is the SITTING you are in, and nothing beyond it: inside
   भाग 2 it offers पद 31–60, inside a उपभाग only that third. एक साथ is a sitting
   like any other — it simply covers the whole text, which is why it alone
   offers every pad. With no sitting running (one finished, or the app was
   reopened) the bound is the division the current item falls in, at the finest
   level that text has. */
function pickScope(c,n){
  const s=S.session;
  if(s&&s.pathId===c.id&&typeof s.from==="number") return {from:s.from,to:s.to};
  const i=divIndex(c,n);
  return hasSubs(c)?subsOf(c,i)[subIndex(c,i,n)]:divsOf(c)[i];
}
function openPicker(){
  const t=S.cur; if(!t||!t.path)return;
  const c=t.path,sp=pickScope(c,t.n);
  const ttl=$("pickTitle");
  ttl.textContent=rangeText(c,sp);
  ttl.className="pick-title "+(scriptOf(c).cls||"dv");
  const g=$("pickGrid"); g.innerHTML=""; let here=null;
  for(let n=sp.from;n<=sp.to;n++){
    const isOpen=!!(c.open&&n===c.open.n),isClose=!!(c.close&&n===c.close.n);
    const b=document.createElement("button");
    b.className="pcell"+((isOpen||isClose)?" bracket":"")+(n===t.n?" on":"");
    // The brackets carry no item number — 85 is not the eighty-fifth pad — so
    // they wear a danda instead of a number that would lie.
    b.textContent=(isOpen||isClose)?"॥":String(n);
    b.setAttribute("aria-label",itemTitle(c,n));
    b.addEventListener("click",()=>{hidePicker();jumpTo(c,n);});
    if(n===t.n)here=b;
    g.appendChild(b);
  }
  $("pickOv").classList.add("on");
  if(here)here.scrollIntoView({block:"center"});
}
function hidePicker(){$("pickOv").classList.remove("on");}
const pickerOpen=()=>$("pickOv").classList.contains("on");

/* ---------- the audio panel ---------- */
function paintPanel(){
  const d=audio.duration||0,c=audio.currentTime||0;
  $("apCur").textContent=fmtHMS(c);
  $("apDur").textContent=fmtHMS(d);
  const s=$("apSeek");
  if(!s.dragging) s.value=d?Math.round(c/d*1000):0;
  s.style.setProperty("--fill",(d?c/d*100:0)+"%");
  $("apPlay").innerHTML=audio.paused?PLAY:PAUSE;
  $("apRate").textContent=S.speed.toFixed(2);
  $("apSlower").disabled=S.speed<=SPD_MIN+1e-9;
  $("apFaster").disabled=S.speed>=SPD_MAX-1e-9;
  $("apRepeatSw").classList.toggle("on",S.repeat);
  const c2=S.cur&&S.cur.path;
  $("apAutoSw").classList.toggle("on",c2?autoOf(c2):false);
}
async function setSpeed(v){
  v=Math.round(Math.max(SPD_MIN,Math.min(SPD_MAX,v))*100)/100;
  S.speed=v; audio.playbackRate=v;
  await put("meta",v,"speed"); paintPanel();
}
async function setRepeat(v){
  S.repeat=!!v; await put("meta",S.repeat,"repeat"); paintPanel();
}
async function setAuto(c,v){
  S.auto[c.id]=!!v; await put("meta",!!v,"auto:"+c.id); paintPanel();
}

/* ---------- where the sittings are decided ----------
   The stepper moves a BOUNDARY, never a range, so a gap or an overlap cannot
   be typed. Changing the number of divisions goes back to an even split, and
   moving a level-1 boundary re-splits that text's sub-divisions, because the
   old sub-boundaries would sit outside their block. */
function stepBtn(txt,dis,fn){
  const b=document.createElement("button");
  b.className="sbtn"; b.textContent=txt; b.disabled=!!dis;
  if(!dis)b.addEventListener("click",fn);
  return b;
}
function divLevel(c,title,from,to,cuts,note,onCuts){
  const wrap=document.createElement("div"); wrap.className="dlevel";
  const head=document.createElement("div"); head.className="dhead";
  const h=document.createElement("span"); h.className="dh-t dv"; h.textContent=title;
  const nn=document.createElement("span"); nn.className="dh-n";
  const n=cuts.length+1;
  nn.appendChild(stepBtn("−",n<=DIV_MIN,()=>onCuts(null,n-1)));
  const b=document.createElement("b"); b.textContent=String(n); nn.appendChild(b);
  nn.appendChild(stepBtn("+",n>=DIV_MAX||(to-from+1)<n+1,()=>onCuts(null,n+1)));
  head.appendChild(h); head.appendChild(nn); wrap.appendChild(head);

  rangesFrom(from,to,cuts).forEach((d,i)=>{
    const row=document.createElement("div"); row.className="drow";
    const dn=document.createElement("span"); dn.className="dn"; dn.textContent=(i+1)+".";
    const dr=document.createElement("span");
    dr.className="dr "+(scriptOf(c).cls||"dv"); dr.textContent=rangeText(c,d);
    const dc=document.createElement("span"); dc.className="dc"; dc.textContent=String(d.to-d.from+1);
    const st=document.createElement("span"); st.className="dstep";
    if(i<cuts.length){
      const lo=(i===0?from:cuts[i-1]+1),hi=(i===cuts.length-1?to-1:cuts[i+1]-1);
      st.appendChild(stepBtn("−",cuts[i]<=lo,()=>{const x=cuts.slice();x[i]--;onCuts(x);}));
      st.appendChild(stepBtn("+",cuts[i]>=hi,()=>{const x=cuts.slice();x[i]++;onCuts(x);}));
    }
    row.appendChild(dn);row.appendChild(dr);row.appendChild(dc);row.appendChild(st);
    wrap.appendChild(row);
  });
  if(note){const p=document.createElement("div");p.className="dnote";p.textContent=note;wrap.appendChild(p);}
  return wrap;
}
async function setDivCuts(c,cuts,n){
  if(cuts===null||cuts===undefined) cuts=defaultCuts(c,n);
  S.div[c.id]=cuts; await put("meta",cuts,"div:"+c.id);
  S.sub[c.id]={}; await put("meta",{},"sub:"+c.id);
  renderDivBody(); render();
}
async function setSubCuts(c,i,cuts,n){
  if(cuts===null||cuts===undefined) cuts=defaultSubCuts(c,divsOf(c)[i],n);
  const all=Object.assign({},S.sub[c.id]||{}); all[i]=cuts;
  S.sub[c.id]=all; await put("meta",all,"sub:"+c.id);
  renderDivBody(); render();
}
function renderDivBody(){
  const c=S.divEdit; if(!c)return;
  $("divTitle").textContent=c.title;
  const box=$("divBody"); box.innerHTML="";
  const to=lastIndex(c),cuts=divsOf(c).slice(0,-1).map(d=>d.to);
  // Said in the text's own words: RSN opens on मङ्गलाचरण and has no closing pad,
  // so the note must not promise it a फलस्तुति.
  const op=c.open?bracketLabel(c,"open"):"",cl=c.close?bracketLabel(c,"close"):"";
  const note=op&&cl?"पहला भाग सदा "+op+" से खुलता है और अन्तिम "+cl+" पर पूरा होता है।"
            :op?"पहला भाग सदा "+op+" से खुलता है।"
            :cl?"अन्तिम भाग "+cl+" पर पूरा होता है।":"";
  box.appendChild(divLevel(c,"भाग",0,to,cuts,note,(x,n)=>setDivCuts(c,x,n)));
  if(hasSubs(c)) divsOf(c).forEach((d,i)=>{
    const sc=subsOf(c,i).slice(0,-1).map(r=>r.to);
    box.appendChild(divLevel(c,"भाग "+(i+1)+" के उपभाग",d.from,d.to,sc,null,
      (x,n)=>setSubCuts(c,i,x,n)));
  });
}
function openDivSheet(c){
  S.divEdit=c; hideSheets(); renderDivBody(); showSheet($("divSheet"));
}
/* One row per path in Settings, so the divisions are reachable without being
   in a text. Each says how that text stands at the moment. */
function renderDivRows(){
  const box=$("divRows"); box.innerHTML="";
  for(const c of S.man.collections){
    if(!isPath(c))continue;
    const b=document.createElement("button"); b.className="toggle";
    b.innerHTML='<span class="meta"><span class="name dv"></span>'+
                '<span class="sub"></span></span>'+CHEV;
    b.querySelector(".name").textContent=c.title;
    b.querySelector(".sub").textContent="भाग "+divsOf(c).map(d=>d.to-d.from+1).join(" · ")+
      (hasSubs(c)?"  ·  उपभाग भी":"");
    b.addEventListener("click",()=>openDivSheet(c));
    box.appendChild(b);
  }
}

/* ---------- रसिक पदावली ---------- */
async function renderUser(L){
  const list=await kids(S.cwd);
  list.sort((a,b)=>a.type!==b.type?(a.type==="folder"?-1:1)
    :a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));
  if(!list.length){const e=document.createElement("div");e.className="empty";
    e.innerHTML='<b class="dv">अभी कुछ नहीं</b>Tap + to make a folder or add songs.';L.appendChild(e);return;}
  const allMarks=await mapOf("marks");
  const grid=document.createElement("div"); grid.className="ltiles";
  for(const n of list){
    const t=document.createElement("button");
    t.className="ltile"+(S.cur&&S.cur.id===n.id?" cur":"");
    t.innerHTML='<span class="lglyph">'+(n.type==="folder"?FOLDER:NOTE)+'</span>'+
      '<span class="lname"></span><span class="lsub"></span>';
    t.querySelector(".lname").textContent=n.name;
    const sub=t.querySelector(".lsub");
    if(n.type==="folder"){
      const k=(await kids(n.id)).length;
      sub.textContent=k?k+" item"+(k>1?"s":""):"empty";
    }else{
      const mark=allMarks.get(n.id);
      if(mark&&mark.pos>15){
        sub.innerHTML='<span class="mark">Resume '+fmt(mark.pos)+'</span>';
        if(n.duration){const b=document.createElement("span");b.className="lbar";
          const ii=document.createElement("i");ii.style.width=Math.min(100,mark.pos/n.duration*100)+"%";
          b.appendChild(ii);t.appendChild(b);}
      } else sub.textContent=n.duration?fmt(n.duration):bytes(n.size);
    }
    t.addEventListener("click",()=>{
      if(n.type==="folder"){S.stack.push({id:n.id,name:n.name});S.cwd=n.id;$("list").scrollTop=0;render();return;}
      const files=list.filter(x=>x.type==="file");
      S.queue=files.map(f=>({id:f.id,name:f.name,blobId:f.id,node:f,kind:"user"}));
      S.qi=files.indexOf(n); playTrack(S.queue[S.qi]);
    });
    longPress(t,()=>openItemSheet({kind:"user",id:n.id,name:n.name,node:n}));
    grid.appendChild(t);
  }
  L.appendChild(grid);
}

/* ---------- opening ---------- */
const tid=(c,f)=>"fx:"+c+":"+f;
async function openTile(c){
  if(c.mode==="soon"){
    $("soonTitle").textContent=c.title;
    $("soonBody").textContent=c.soonNote||"अभी तैयार नहीं।";
    showSheet($("soonSheet")); return;
  }
  if(c.mode==="library"){S.view="library";S.cwd="root";S.stack=[];$("list").scrollTop=0;render();return;}
  S.coll=c; S.grp=0;
  S.view=isPath(c)?"path":"collection";
  $("list").scrollTop=0; render();
}
function goBack(){
  if(S.view==="pathsub"){S.view="path";render();return;}
  if(S.view==="collection"||S.view==="path"){S.view="home";S.coll=null;render();return;}
  if(S.view==="library"){
    if(S.stack.length){S.stack.pop();S.cwd=S.stack.length?S.stack[S.stack.length-1].id:"root";render();}
    else{S.view="home";render();}
  }
}

/* ---------- playback ---------- */
let objUrl=null,saveAt=0,chainTimer=null,chainTick=null;
let curSrc=null,retries=0,stallAt=-1,stallTicks=0;

function clearChain(){if(chainTimer){clearTimeout(chainTimer);chainTimer=null;}
  if(chainTick){clearInterval(chainTick);chainTick=null;} $("chainLine").textContent="";}

function playFixed(c,i,fromStart){
  clearChain(); S.session=null;
  const t=c.tracks[i];
  playTrack({id:tid(c.id,t.file),name:t.title,url:t.file,coll:c,idx:i,kind:"fixed"},fromStart);
}

/* `startPaused` is how reading in silence works: the item is loaded, its words
   are painted and its mark is honoured, but nothing sounds until a play gesture.
   Callers that mean "play this" pass false; callers that are only moving the
   reader pass S.silent, so the habit carries. */
async function playTrack(t,fromStart,startPaused){
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null;}
  let src;
  if(t.blobId){const b=await get("blobs",t.blobId);
    if(!b){toast("That file is missing from storage.");return;}
    objUrl=URL.createObjectURL(b);src=objUrl;}
  else src=t.url;

  S.cur=t;
  const grp=t.coll||t.path;                       // whichever kind of collection this came from
  if(grp){await put("meta",{id:t.id,name:t.name},"last:"+grp.id);
    $("discLabel").setAttribute("fill",grp.tint||"#6E1F1F");}
  else $("discLabel").setAttribute("fill","#6E1F1F");

  const mark=fromStart?null:await get("marks",t.id);
  curSrc=src; retries=0; stallAt=-1; stallTicks=0;
  audio.src=src;
  audio.onerror=recover;
  audio.onloadedmetadata=async()=>{
    if(isFinite(audio.duration)){
      if(t.node){if(Math.abs((t.node.duration||0)-audio.duration)>1){t.node.duration=audio.duration;await put("nodes",t.node);}}
      else await put("meta",audio.duration,"dur:"+t.id);
    }
    if(mark&&mark.pos>0&&mark.pos<audio.duration-3){
      audio.currentTime=mark.pos; toast("Resuming from "+fmt(mark.pos));}
    audio.playbackRate=S.speed;
    paint(); if(!startPaused) audio.play().catch(paint);
  };
  $("mini").hidden=false; document.body.classList.add("has-mini");
  const cls=t.path?(scriptOf(t.path).cls||"dv"):(t.coll?"dv":"");
  for(const el of [$("miniName"),$("nowName")]){
    el.textContent=t.name;
    el.classList.toggle("dv",cls==="dv"); el.classList.toggle("bn",cls==="bn");
  }
  $("nowFolder").textContent=grp?(grp.title+(grp.range?" "+grp.range:"")):"रसिक पदावली";
  $("nowFolder").classList.toggle("dv",true);

  // the words, in place of the disc
  document.body.classList.toggle("path-play",!!t.path);
  if(t.path) showVerse(t.path,t.n);
  render(); mediaMeta(t);
}

/* text and audio in sync: one file per item, so the text for the item that is
   playing is simply the row with its number */
function showVerse(c,n){
  const el=$("verseText"),sc=scriptOf(c),row=rowFor(c,n);
  $("verseScroll").scrollTop=0;
  el.className="versetext "+(row?(sc.cls||"dv"):"versemuted dv");
  // A verse line that wraps must not leave its danda stranded on a line of
  // its own, so the space before । or ॥ is made non-breaking.
  el.textContent=row?row.t.replace(/ +([।॥])/g,"\u00A0$1")
    :(sc.placeholderTitle?sc.placeholderTitle+"\n\n"+(sc.placeholderBody||""):"");
}

function paint(){
  const d=audio.duration||0,c=audio.currentTime||0,p=d?c/d*100:0;
  $("tCur").textContent=fmt(c);$("tDur").textContent=fmt(d);
  const s=$("seek"); if(!s.dragging) s.value=d?Math.round(c/d*1000):0;
  s.style.setProperty("--fill",p+"%");
  $("ring").style.strokeDashoffset=603-603*p/100;
  $("miniProg").style.width=p+"%";
  $("miniSub").textContent=fmt(c)+(d?" / "+fmt(d):"");
  const ic=audio.paused?PLAY:PAUSE;
  $("bigPlay").innerHTML=ic;$("miniPlay").innerHTML=ic;
  document.body.classList.toggle("playing",!audio.paused);
  paintReader();
  if(openSh===$("audioPanel")) paintPanel();
}

/* Clears the mark near the end so a finished item does not offer to resume at
   its last second. This is a RESUME convenience only — completion is `ended`,
   never this test. See advance(). */
async function saveMark(){
  if(!S.cur)return; const c=audio.currentTime;
  if(!isFinite(c))return;
  if(audio.duration&&c>audio.duration-5) await del("marks",S.cur.id);
  else await put("marks",{pos:c,updated:Date.now()},S.cur.id);
}

/* A hiccup must not end the sitting. The network changes, the stream is cut,
   the phone comes back from sleep: the element fires `error`, or simply stops
   advancing, and playback used to die there behind a toast nobody sees. This
   re-attaches the same file, seeks back to where it stopped and carries on —
   three tries, and only then does it say so.

   It can never fabricate a completion: `ended` is untouched, and a pad that
   was recovered mid-way still has to play out to its own end to count. */
function recover(){
  if(!S.cur||!curSrc)return;
  if(retries>=3){toast("Could not play this file.");return;}
  retries++; stallAt=-1; stallTicks=0;
  const at=audio.currentTime||0;
  audio.src=curSrc;
  audio.onloadedmetadata=()=>{
    if(at>0&&isFinite(audio.duration)&&at<audio.duration-1) audio.currentTime=at;
    paint(); audio.play().catch(paint);
  };
  audio.load();
}

/* Some stalls are silent — no `error`, the clock just stops. Fifteen seconds
   of no progress while we are meant to be playing is one of those. */
setInterval(()=>{
  if(!S.cur||audio.paused||audio.ended){stallAt=-1;stallTicks=0;return;}
  const t=audio.currentTime;
  if(t===stallAt){ if(++stallTicks>=3) recover(); }
  // Five seconds of real progress means the last recovery held. Clearing the
  // count here and not in `timeupdate` matters: a timeupdate still fires
  // between a reload and the failure that follows it, and resetting there made
  // recover() retry a hopeless seek for ever.
  else { if(stallAt>=0) retries=0; stallAt=t; stallTicks=0; }
},5000);

audio.addEventListener("timeupdate",()=>{
  paint();
  const n=Date.now(); if(n-saveAt>5000){saveAt=n;saveMark();}
});
audio.addEventListener("play",paint);
audio.addEventListener("pause",()=>{paint();saveMark();});
audio.addEventListener("ended",async()=>{
  if(S.cur) await del("marks",S.cur.id);
  const t=S.cur;

  // a path item has played through to its end — the one thing that counts as done
  if(t&&t.path){
    const c=t.path;
    // Repeat HOLDS the position. Sitting with one pad plays it again and
    // again and never marks it done, which is the whole point of dwelling.
    if(S.repeat){ await playPath(c,t.n,true,false,false); return; }
    if(posOf(c)===t.n) await advance(c,t.n);
    const s=S.session;
    if(s&&s.pathId===c.id&&s.items[s.i]===t.n&&s.i+1<s.items.length){
      s.i++; await playPath(c,s.items[s.i],false,false,false); return;
    }
    if(s&&s.pathId===c.id){S.session=null;toast("सत्र पूर्ण");}
    // A pad tapped on its own is not part of a session, but the reciter still
    // expects the path to carry on into the next one. Auto-play is the path's
    // OWN setting now — the one in Settings governs रसिक पदावली alone. It walks
    // the path's order, closing pad included, and stops at the end.
    else if(autoOf(c)&&t.n<lastIndex(c)){ await playPath(c,t.n+1,false,false,false); return; }
    paint(); render(); return;
  }

  if(t&&t.coll&&t.coll.chains){
    const pair=t.coll.chains.find(p=>p[0]===t.idx);
    if(pair){startChain(t.coll,pair[1]);return;}
  }
  if(t&&t.kind==="user"&&S.autoplay&&S.qi>-1&&S.qi+1<S.queue.length){
    S.qi++; playTrack(S.queue[S.qi]); return;
  }
  paint(); render();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveMark();});
window.addEventListener("pagehide",saveMark);

/* आरती: the two pairs run on from one another after a short gap. Carried
   across unchanged — the behaviour lives in manifest.json's `chains`. */
function startChain(c,nextIdx){
  const gap=(S.man.rules&&S.man.rules.aratiChainGapSeconds)||10;
  let left=gap;
  $("chainLine").textContent=c.tracks[nextIdx].title+" in "+left+"s";
  chainTick=setInterval(()=>{left--;
    if(left>0)$("chainLine").textContent=c.tracks[nextIdx].title+" in "+left+"s";},1000);
  chainTimer=setTimeout(()=>{clearChain();playFixed(c,nextIdx,true);},gap*1000);
}

function mediaMeta(t){
  if(!("mediaSession" in navigator))return;
  const grp=t.coll||t.path;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:t.name,artist:grp?grp.title:"रसिक पदावली",album:"राधा"});
  navigator.mediaSession.setActionHandler("play",()=>{setSilent(false);audio.play();});
  navigator.mediaSession.setActionHandler("pause",()=>{setSilent(true);audio.pause();});
  navigator.mediaSession.setActionHandler("seekbackward",()=>audio.currentTime-=30);
  navigator.mediaSession.setActionHandler("seekforward",()=>audio.currentTime+=30);
}

/* ---------- sheets ---------- */
let openSh=null;
function showSheet(e){openSh=e;e.classList.add("on");$("scrim").classList.add("on");}
function hideSheets(){if(openSh)openSh.classList.remove("on");openSh=null;
  $("scrim").classList.remove("on");$("dlg").classList.remove("on");paintReader();}
$("scrim").addEventListener("click",hideSheets);
$("fab").addEventListener("click",()=>showSheet($("addSheet")));
$("settingsBtn").addEventListener("click",async()=>{renderDivRows();showSheet($("setSheet"));
  if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    $("storageLine").textContent=bytes(e.usage||0)+" used";}
  else $("storageLine").textContent="Not reported by this browser";});

function openItemSheet(t){S.target=t;$("itemSheetTitle").textContent=t.name;
  const fx=t.kind==="fixed";
  $("actRename").style.display=fx?"none":"";
  $("actDelete").style.display=fx?"none":"";
  $("actClearMark").style.display=(fx||(t.node&&t.node.type==="file"))?"":"none";
  showSheet($("itemSheet"));}

/* ---------- dialog ---------- */
let dcb=null;
function ask(title,val,cb){$("dlgTitle").textContent=title;$("dlgInput").value=val;dcb=cb;
  $("scrim").classList.add("on");$("dlg").classList.add("on");
  setTimeout(()=>{$("dlgInput").focus();$("dlgInput").select();},60);}
$("dlgCancel").addEventListener("click",hideSheets);
$("dlgOk").addEventListener("click",()=>{const v=$("dlgInput").value.trim();hideSheets();if(v&&dcb)dcb(v);});
$("dlgInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("dlgOk").click();});

/* ---------- actions ---------- */
$("actNewFolder").addEventListener("click",()=>{hideSheets();
  ask("New folder","",async n=>{await put("nodes",{id:uid(),parentId:S.cwd,type:"folder",name:n,created:Date.now()});render();});});
$("actUpload").addEventListener("click",()=>{hideSheets();$("filePicker").click();});
$("filePicker").addEventListener("change",async e=>{
  const fs=[...e.target.files];e.target.value="";if(!fs.length)return;
  toast("Saving "+fs.length+" file"+(fs.length>1?"s":"")+"…");
  for(const f of fs){const id=uid();await put("blobs",f,id);
    await put("nodes",{id,parentId:S.cwd,type:"file",name:noExt(f.name),
      size:f.size,mime:f.type,duration:0,created:Date.now()});}
  toast("Added");render();});
$("actRename").addEventListener("click",()=>{const t=S.target;hideSheets();
  ask("Rename",t.name,async n=>{t.node.name=n;await put("nodes",t.node);
    if(S.cur&&S.cur.id===t.node.id){S.cur.name=n;$("miniName").textContent=n;$("nowName").textContent=n;}
    render();});});
$("actClearMark").addEventListener("click",async()=>{const t=S.target;hideSheets();
  await del("marks",t.id);if(S.cur&&S.cur.id===t.id)audio.currentTime=0;
  toast("Will start from the beginning");render();});
$("actDelete").addEventListener("click",async()=>{const t=S.target;hideSheets();
  if(!confirm("Delete “"+t.name+"”"+(t.node.type==="folder"?" and everything inside it":"")+"?"))return;
  await rm(t.node);
  if(S.cur&&S.cur.id===t.node.id){audio.pause();audio.removeAttribute("src");S.cur=null;
    $("mini").hidden=true;document.body.classList.remove("has-mini","player-open","path-play");}
  render();});
async function rm(n){if(n.type==="folder"){for(const k of await kids(n.id))await rm(k);}
  else{await del("blobs",n.id);await del("marks",n.id);} await del("nodes",n.id);}

$("autoplayRow").addEventListener("click",async()=>{S.autoplay=!S.autoplay;
  $("autoplaySw").classList.toggle("on",S.autoplay);await put("meta",S.autoplay,"autoplay");});

/* ---------- controls ---------- */
$("backBtn").addEventListener("click",goBack);
$("miniOpen").addEventListener("click",()=>document.body.classList.add("player-open"));
$("playerClose").addEventListener("click",()=>document.body.classList.remove("player-open"));
$("miniPlay").addEventListener("click",toggleAudio);
$("bigPlay").addEventListener("click",toggleAudio);

/* ---------- the reader's bar ---------- */
$("rbPick").addEventListener("click",openPicker);
$("pickClose").addEventListener("click",hidePicker);
$("rbSmaller").addEventListener("click",()=>setFont(S.font-FONT_STEP));
$("rbBigger").addEventListener("click",()=>setFont(S.font+FONT_STEP));
$("rbReset").addEventListener("click",()=>setFont(FONT_DEF));
$("rbAudio").addEventListener("click",()=>{
  if(openSh===$("audioPanel"))hideSheets();
  else{paintPanel();showSheet($("audioPanel"));paintReader();}});
$("rbPrev").addEventListener("click",()=>readerStep(-1));
$("rbNext").addEventListener("click",()=>readerStep(1));

/* Turning the page with the thumb. The words scroll up and down inside one
   item, so only a decisively sideways drag counts — and it is the same path as
   the prev/next buttons, nothing of its own. */
(function(){
  const vs=$("verseScroll"); let x0=null,y0=null;
  vs.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){x0=null;return;}
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;},{passive:true});
  vs.addEventListener("touchend",e=>{
    if(x0===null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.6)return;
    readerStep(dx<0?1:-1);},{passive:true});
})();

/* ---------- the audio panel ---------- */
$("apPlay").addEventListener("click",toggleAudio);
const apSeek=$("apSeek");
apSeek.addEventListener("input",()=>{apSeek.dragging=true;const d=audio.duration||0;
  $("apCur").textContent=fmtHMS(d*apSeek.value/1000);
  apSeek.style.setProperty("--fill",(apSeek.value/10)+"%");});
apSeek.addEventListener("change",()=>{const d=audio.duration||0;
  audio.currentTime=d*apSeek.value/1000;apSeek.dragging=false;saveMark();});
$("apSlower").addEventListener("click",()=>setSpeed(S.speed-SPD_STEP));
$("apFaster").addEventListener("click",()=>setSpeed(S.speed+SPD_STEP));
$("apRepeatRow").addEventListener("click",()=>setRepeat(!S.repeat));
$("apAutoRow").addEventListener("click",()=>{
  const c=S.cur&&S.cur.path; if(!c){toast("Open a path first");return;}
  setAuto(c,!autoOf(c));});

/* ---------- the divisions ---------- */
$("divDone").addEventListener("click",()=>{hideSheets();render();});
$("divDefaults").addEventListener("click",async()=>{
  const c=S.divEdit; if(!c)return;
  delete S.div[c.id]; delete S.sub[c.id];
  await del("meta","div:"+c.id); await del("meta","sub:"+c.id);
  renderDivBody(); render();});
$("back30").addEventListener("click",()=>audio.currentTime=Math.max(0,audio.currentTime-30));
$("fwd30").addEventListener("click",()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+30));
const seek=$("seek");
seek.addEventListener("input",()=>{seek.dragging=true;const d=audio.duration||0;
  $("tCur").textContent=fmt(d*seek.value/1000);seek.style.setProperty("--fill",(seek.value/10)+"%");});
seek.addEventListener("change",()=>{const d=audio.duration||0;
  audio.currentTime=d*seek.value/1000;seek.dragging=false;saveMark();});
window.addEventListener("popstate",()=>{
  if(pickerOpen())hidePicker();
  else if(openSh)hideSheets();
  else if(document.body.classList.contains("player-open"))document.body.classList.remove("player-open");
  else if(S.view!=="home")goBack();
  history.pushState(null,"");});

/* ---------- boot ---------- */
(async function(){
  db=await openDB();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  try{const r=await fetch("manifest.json",{cache:"no-cache"});
    if(r.ok){const m=await r.json();
      if(m&&Array.isArray(m.collections)&&m.collections.length)S.man=m;}}catch(e){}
  for(const c of S.man.collections){
    if(!isPath(c))continue;
    const p=await get("meta","pos:"+c.id);
    S.pos[c.id]=(typeof p==="number"&&p>=0&&p<=lastIndex(c))?p:0;
    const s=await get("meta","script:"+c.id);
    if(s&&c.scripts.some(x=>x.id===s)) S.script[c.id]=s;
    // A stored split is honoured only while it still covers this text — a cut
    // that no longer fits falls back to the default rather than to a gap.
    const dv=await get("meta","div:"+c.id);
    if(cutsValid(0,lastIndex(c),dv)) S.div[c.id]=dv;
    const sb=await get("meta","sub:"+c.id);
    if(sb&&typeof sb==="object") S.sub[c.id]=sb;
    const au=await get("meta","auto:"+c.id);
    if(au!==undefined) S.auto[c.id]=!!au;
  }
  const ap=await get("meta","autoplay"); S.autoplay=ap===undefined?true:ap;
  $("autoplaySw").classList.toggle("on",S.autoplay);
  const sl=await get("meta","silent"); S.silent=!!sl;
  const sp=await get("meta","speed");
  if(typeof sp==="number"&&sp>=SPD_MIN&&sp<=SPD_MAX) S.speed=sp;
  audio.playbackRate=S.speed;
  const rp=await get("meta","repeat"); S.repeat=!!rp;
  const fs=await get("meta","fontsize");
  S.font=(typeof fs==="number"&&fs>=FONT_MIN&&fs<=FONT_MAX)?fs:FONT_DEF;
  document.documentElement.style.setProperty("--verse-size",S.font+"px");
  paintPanel(); paintReader();
  $("bigPlay").innerHTML=PLAY;$("miniPlay").innerHTML=PLAY;
  history.pushState(null,"");
  await render();
})();

})();
</script>
<script>
// Offline support. Registered after load so it can never delay or alter the
// first paint; if registration fails the app carries on exactly as before.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
