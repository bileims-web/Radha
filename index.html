<!DOCTYPE html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<!-- These are prayers, to be read as they are written. Chrome sees a Hindi
     page on a phone set to English and offers "Translate page?" on every
     open; this is the page saying no, so the offer is never made. -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1315">
<title>राधा</title>
<!-- Noto Serif Devanagari now ships with the app instead of loading from
     Google, so the Devanagari renders with no internet. Same family, same
     weights (500/600), same unicode-ranges as the stylesheet it replaces. -->
<link rel="stylesheet" href="fonts/noto-serif-devanagari.css">
<!-- and Bengali, for the Sudha Nidhi, on the same terms: self-hosted so the
     verses render with no internet. -->
<link rel="stylesheet" href="fonts/noto-serif-bengali.css">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="राधा">
<style>
  :root{
    /* Deep oxblood rather than black: it sets off the ivory tiles and the
       gold, and the whole dark family moves together so the topbar,
       sheets, mini-player and rows stay in key with it. */
    --bg:#2A1315;--surface:#361A1C;--surface2:#422124;--line:#542E30;
    --text:#F2E7DA;--muted:#B09287;--gold:#C9A227;--red:#B4462F;--pad:16px;
    --ivory:#F7F1E4;--ink:#3E2A1B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif,
      "Noto Serif Devanagari","Noto Serif Bengali";
    font-size:16px;line-height:1.4;overscroll-behavior:none;
    display:flex;flex-direction:column;height:100dvh}

  /* Nothing on these screens is here to be selected — and a tap that selects
     a word is exactly what summons Chrome's Touch to Search: the Google
     Translate bar that slid up over the শব্দার্থ fold every time an edge tap
     turned the page (screenshot, 2026-09-19). No word selected, nothing for it
     to offer. The long-press callout goes with it, and the app reads as an app
     instead of a web page. Fields are the exception: the rename dialog calls
     .select() on its own text. */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  .dv{font-family:"Noto Serif Devanagari","Noto Sans Devanagari",serif}

  .topbar{display:flex;align-items:center;gap:4px;
    padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .icon-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:10px}
  .icon-btn:active{background:var(--surface2)}
  .icon-btn[hidden]{display:none}
  .title{flex:1;min-width:0;font-size:19px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .crumb{display:block;font-size:11px;color:var(--muted);font-weight:400;
    letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  /* …except when what it says is not Latin. The line under the title carries
     ভাগ / পদ ranges and now दो संस्करण, and the stack above has no Indic face in
     it, so those fell through to whatever the phone happened to own. The title's
     own script class decides, exactly as it does for the title itself. */
  .title.dv .crumb{font-family:"Noto Serif Devanagari","Noto Sans Devanagari",serif}
  .title.bn .crumb{font-family:"Noto Serif Bengali","Noto Sans Bengali",serif}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:180px}

  /* No scrollbar on anything that scrolls — asked for on 2026-09-19. Chrome
     draws a thin grey rule down the right edge while a finger moves, and beside
     a page of centred verse it reads as part of the page, a margin line someone
     ruled there. Nothing here needs it: the reader counts its own place in the
     header (5/7), the picker is a grid of numbers, and a sheet is a handful of
     rows. Both spellings, because the standard property is Chrome 121+ and the
     WebKit pseudo-element is what older phones still listen to. */
  .scroll,.versescroll,.pick-grid,.sheet{scrollbar-width:none}
  .scroll::-webkit-scrollbar,.versescroll::-webkit-scrollbar,
  .pick-grid::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}

  /* Alpona drawn on the ground itself, framing the content. z-index -1 so
     it lies under the flow but over the page colour; the top pair start
     below the topbar, which is opaque and would otherwise cover them. */
  #bgArt{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
  #bgArt svg{position:absolute;width:min(48vw,200px);aspect-ratio:1;
    color:var(--gold);opacity:.09}
  #bgArt .tl{top:calc(env(safe-area-inset-top) + 58px);left:0}
  #bgArt .tr{top:calc(env(safe-area-inset-top) + 58px);right:0;transform:scaleX(-1)}
  #bgArt .bl{bottom:0;left:0;transform:scaleY(-1)}
  #bgArt .br{bottom:0;right:0;transform:scale(-1,-1)}
  /* A peacock on the ground, very faint, centred low where the lists leave
     room (user, 2026-10-11: aesthetic, never in the way of reading). From
     the user's Freepik file 4411667_2146 on Drive pnf/, cut out and optimised
     (svgo -p 1, 336 -> 93 KB); its own file so the page stays light.
     It fills the ground below the topbar like an alpona, as large as the
     screen allows in proportion (object-fit), centred. */
  #bgArt .peacock{position:absolute;left:0;width:100%;
    top:calc(env(safe-area-inset-top) + 66px);
    height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 78px);
    object-fit:contain;opacity:.05}

  /* Tiles are off-white leaves of paper. Each collection's colour from
     manifest.json is no longer the fill — it is the ink the motif and the
     alpona are drawn in, so the six stay tellable apart at a glance.
     Ivory #F7F1E4, ink #3E2A1B. */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px var(--pad) 0}
  .tile{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;padding:13px;
    text-align:center;transition:transform .12s;
    /* every tile on the आरती paper (user, 2026-10-11): ivory with 9% of its
       maroon #6E1F1F, = #EBDED2. --tint stays each tile's own ink. */
    background:#EBDED2;
    border:1px solid rgba(62,42,27,.16);
    box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .tile:active{transform:scale(.975)}
  /* light falling from the top-left, as on paper */
  .tile::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.85),transparent 64%)}
  .tile.pointed{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset,0 1px 3px rgba(0,0,0,.35)}

  /* the motif sits behind the words, large and quiet */
  .tile-art{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .tile-art svg{width:78%;height:78%;color:var(--tint);opacity:.30}
  /* alpona: the rice-paste flourish in the corners */
  .tile-alpona{position:absolute;inset:0;pointer-events:none}
  /* one alpona ink on every tile, the आरती maroon (user, 2026-10-11) */
  .tile-alpona svg{width:100%;height:100%;color:#6E1F1F;opacity:.13}

  .tile-hi{position:relative;font-size:17.5px;font-weight:600;color:var(--ink);line-height:1.34;
    text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .tile-range{position:relative;font-size:14px;color:rgba(62,42,27,.72);
    margin-top:3px;font-variant-numeric:tabular-nums}

  .libtile{margin:10px var(--pad) 0;display:flex;align-items:center;gap:14px;
    width:calc(100% - 2*var(--pad));padding:18px 16px;border-radius:16px;
    background:var(--surface);border:1px solid var(--line);text-align:left}
  .libtile:active{background:var(--surface2)}
  .libtile .meta{flex:1;min-width:0}
  .libtile .name{font-size:16.5px;font-weight:600}
  .libtile .sub{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* no rule between rows (user, 2026-10-11): it cut across the peacock */
  .row{display:flex;align-items:center;gap:14px;padding:13px var(--pad);
    user-select:none;-webkit-user-select:none;
    width:100%;text-align:left}
  .row:active{background:var(--surface)}
  .row.current .name,.row.current .glyph{color:var(--gold)}
  .row.pointed{background:rgba(201,162,39,.07)}
  .row.pointed .name{color:var(--gold)}
  .glyph{flex:0 0 24px;display:grid;place-items:center;color:var(--muted)}
  .meta{flex:1;min-width:0}
  .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
  .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .sub .mark{color:var(--gold)}
  .track-bar{height:2px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
  .track-bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
  .empty{padding:44px 30px;text-align:center;color:var(--muted);font-size:14px}
  .empty b{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:8px}

  .fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1A1508;
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:20;
    transition:transform .12s}
  .fab:active{transform:scale(.93)}
  .fab[hidden]{display:none}
  body.player-open .fab{display:none}
  body.has-mini .fab{bottom:calc(env(safe-area-inset-bottom) + 92px)}

  /* ---------- the way home ----------
     One tap back to the tiles from wherever the screen has got to, instead of
     a press of back for every layer. It sits at the bottom LEFT, the FAB's
     mirror, and is quieter than the FAB on purpose: adding a pad is the loud
     thing on a screen that offers it; going home is furniture.

     It is fixed, and above the raised player (z-30) so it is reachable over a
     sounding आरती, but below the scrim (z-40) — a sheet is answered by the
     sheet, not by leaving. On a SLIDE it hides, because the reader's own bar
     carries the same key in the same corner and two would collide. */
  .homebtn{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:52px;height:52px;border-radius:50%;background:var(--surface2);
    color:var(--gold);border:1px solid var(--line);
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:31;
    transition:transform .12s}
  .homebtn:active{transform:scale(.93)}
  .homebtn[hidden]{display:none}
  /* the mini bar takes the foot of the screen, so the button steps over it —
     the same lift, and the same distance, as the FAB on the other side */
  body.has-mini .homebtn{bottom:calc(env(safe-area-inset-bottom) + 92px)}
  /* a raised player covers the mini bar, so the lift comes off again; and it
     covers the tiles, so the button shows even when the view beneath IS home */
  body.player-open .homebtn{bottom:calc(env(safe-area-inset-bottom) + 18px)}
  body.player-open .homebtn[hidden]{display:grid}
  /* A SLIDE has the bar, whose first key is this one, so this one stands down
     — but only while the slide is actually UP. `path-play` says which face the
     player wears, not whether it is raised, and it is never taken off the body:
     once a verse has been opened it stays for the rest of the session. Matched
     on its own it took the floating key off every list behind the slide, for
     the rest of the session — reported as "I can't see the home button", and
     answered by pairing the class with `player-open`, which really does mean
     the slide is up. */
  body.player-open.path-play .homebtn,body.player-open.text-play .homebtn,
  body.player-open.path-play .homebtn[hidden],
  body.player-open.text-play .homebtn[hidden]{display:none}

  .mini{position:fixed;left:0;right:0;bottom:0;
    padding:0 6px calc(env(safe-area-inset-bottom) + 6px);z-index:18}
  .mini[hidden]{display:none}
  .mini-inner{background:var(--surface2);border:1px solid var(--line);border-radius:14px;
    display:flex;align-items:center;gap:10px;padding:9px 8px 9px 14px}
  .mini .name{font-size:14.5px}
  .mini .sub{font-size:11.5px;margin-top:2px}
  .mini-prog{height:2px;background:var(--line);margin:7px 6px 0;border-radius:2px;overflow:hidden}
  .mini-prog i{display:block;height:100%;background:var(--gold)}

  .player{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 24px calc(env(safe-area-inset-bottom) + 26px);
    transform:translateY(100%);transition:transform .26s ease}
  body.player-open .player{transform:translateY(0)}
  .disc{flex:1;display:grid;place-items:center;padding:12px 0;min-height:0}
  .disc svg{width:min(56vw,220px);height:auto}
  .disc .spin{transform-origin:50% 50%;animation:rot 6s linear infinite;animation-play-state:paused}
  body.playing .disc .spin{animation-play-state:running}
  @keyframes rot{to{transform:rotate(360deg)}}
  .now-name{font-size:20px;font-weight:600;text-align:center;margin:0 0 6px;overflow-wrap:anywhere}
  .now-folder{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.4px;margin-bottom:18px}
  .seek{width:100%;appearance:none;background:transparent;height:34px;display:block}
  .seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(var(--gold),var(--gold)) left/var(--fill,0%) 100% no-repeat,var(--line)}
  .seek::-moz-range-track{height:4px;border-radius:4px;
    background:linear-gradient(var(--gold),var(--gold)) left/var(--fill,0%) 100% no-repeat,var(--line)}
  .seek::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--gold);margin-top:-6px}
  .seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--gold)}
  .times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;margin-top:-4px}
  .transport{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:20px}
  .big{width:74px;height:74px;border-radius:50%;background:var(--gold);color:#1A1508;
    display:grid;place-items:center}
  .big:active{transform:scale(.95)}
  .skip{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--line);position:relative}
  .skip span{position:absolute;font-size:9.5px;bottom:9px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chainline{text-align:center;font-size:12.5px;color:var(--gold);
    min-height:18px;margin-top:12px;font-variant-numeric:tabular-nums}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;
    pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
    border-radius:18px 18px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px);
    transform:translateY(110%);transition:transform .22s ease;max-height:80dvh;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 10px}
  .sheet h3{margin:4px 22px 12px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Every other sheet's heading is a Latin label, so it is set as one — small,
     upper-cased, tracked out. This one carries the slide's own name in its own
     script, where all three of those are wrong. */
  #restartSheetTitle{text-transform:none;letter-spacing:0;font-size:15.5px;
    color:var(--text);white-space:normal}
  .item{display:flex;align-items:center;gap:16px;padding:15px 22px;width:100%;text-align:left}
  .item:active{background:var(--surface2)}
  .item.danger{color:var(--red)}
  .item .glyph{color:inherit}
  .item .sub2{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .toggle{display:flex;align-items:center;gap:16px;padding:14px 22px;width:100%;text-align:left}
  .toggle .meta{flex:1}
  .toggle .sub{white-space:normal;margin-top:2px}
  /* the action at the end of a "keep on this phone" row: a word, not a switch,
     because it does something rather than remembering something */
  .offbtn{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    font-size:12.5px;letter-spacing:.3px;color:var(--text);white-space:nowrap;background:none}
  .offbtn.on{color:var(--gold);border-color:rgba(201,162,39,.45)}
  .offbtn:active{background:var(--surface2)}
  .sw{flex:0 0 50px;width:50px;height:30px;border-radius:15px;background:var(--line);
    position:relative;transition:background .16s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
    border-radius:50%;background:var(--muted);transition:.16s}
  .sw.on{background:rgba(201,162,39,.35)}
  .sw.on::after{left:23px;background:var(--gold)}

  .dlg{position:fixed;left:16px;right:16px;top:20%;z-index:42;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:20px;opacity:0;
    pointer-events:none;transform:scale(.96);transition:.15s}
  .dlg.on{opacity:1;pointer-events:auto;transform:scale(1)}
  .dlg h3{margin:0 0 14px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)}
  .dlg input{width:100%;padding:12px 14px;border-radius:10px;background:var(--bg);
    border:1px solid var(--line);color:var(--text)}
  .dlg input:focus{outline:none;border-color:var(--gold)}
  .dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .dlg-btns button{padding:10px 18px;border-radius:9px;font-weight:600;font-size:15px}
  .dlg-btns .go{background:var(--gold);color:#1A1508}
  .dlg-btns .cancel{color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,14px);
    background:var(--surface2);border:1px solid var(--line);padding:11px 18px;
    border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;
    transition:.2s;max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* Bengali is set in the serif that matches the Devanagari, served from this
     repo for the same reason: the text must render with no internet. */
  .bn{font-family:"Noto Serif Bengali","Noto Sans Bengali",serif}

  /* ---------- path slides (चौरासी जी, राधा सुधा निधि) ---------- */

  /* Where the path stands, and the two ways to start it. Ivory like the tiles,
     so it reads as a leaf of the same paper rather than as a control panel. */
  .pathhead{position:relative;overflow:hidden;margin:14px var(--pad) 0;padding:16px;
    border-radius:16px;background:color-mix(in srgb, var(--tint) 9%, #F7F1E4);
    border:1px solid rgba(62,42,27,.16);box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .pathhead::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.85),transparent 64%)}
  .pathhead>*{position:relative}
  .pathwhere{font-size:12px;letter-spacing:.5px;text-transform:uppercase;
    color:rgba(62,42,27,.6);font-weight:600}
  .pathnext{font-size:19px;font-weight:600;color:var(--ink);margin-top:4px;line-height:1.35}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
  .mode{padding:13px 10px;border-radius:12px;border:1px solid rgba(62,42,27,.22);
    background:rgba(255,255,255,.5);color:var(--ink);text-align:center;
    font-size:15.5px;font-weight:600;line-height:1.25;transition:transform .12s}
  .mode:active{transform:scale(.97)}
  .mode .sub3{display:block;font-size:11.5px;font-weight:400;margin-top:4px;
    color:rgba(62,42,27,.66);font-variant-numeric:tabular-nums}
  .pathhint{font-size:11.5px;color:rgba(62,42,27,.62);margin-top:12px;text-align:center;
    line-height:1.5}

  /* script toggle — Bengali / Hindi on the Sudha Nidhi */
  .scripts{display:flex;gap:5px;margin:14px var(--pad) 0;padding:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .scripts button{flex:1;padding:9px 6px;border-radius:9px;font-size:14.5px;color:var(--muted)}
  .scripts button.on{background:var(--surface2);color:var(--gold);font-weight:600}
  .scripts button .tag{display:block;font-size:10px;letter-spacing:.3px;
    color:var(--muted);font-weight:400;margin-top:2px}

  .sect{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
    padding:22px var(--pad) 9px;font-weight:600}

  /* the badge that says "you are here" on a group row */
  .here{flex:0 0 auto;font-size:11px;color:var(--gold);border:1px solid rgba(201,162,39,.5);
    border-radius:20px;padding:2px 10px;font-variant-numeric:tabular-nums}

  /* an honest empty space, for the Hindi text that is not written yet */
  .ph{margin:14px var(--pad);padding:22px 20px;border-radius:14px;background:var(--surface);
    border:1px dashed var(--line);color:var(--muted);font-size:13.5px;line-height:1.65;
    text-align:center}
  .ph b{display:block;color:var(--text);font-size:15.5px;font-weight:600;margin-bottom:8px}

  /* The recitation text, shown in place of the disc while a pad or a verse
     plays. On these slides the words are the point of the screen, so they get
     the room the spinning disc had. */
  .versewrap{flex:1;min-height:0;display:none;flex-direction:column}
  body.path-play .disc{display:none}
  body.path-play .versewrap{display:flex}
  .versescroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 2px 12px;-webkit-mask-image:linear-gradient(#000 92%,transparent);
    mask-image:linear-gradient(#000 92%,transparent)}
  .versetext{font-size:var(--verse-size,18px);line-height:1.95;text-align:center;
    color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
  .versemuted{color:var(--muted);font-size:14px;line-height:1.7;white-space:normal;
    padding:0 6px}

  /* ---------- a text-only slide: श्री हित सेवक वाणी ----------
     A section is a run of verses, most of them followed by their own व्याख्या.
     The gloss is folded away so the page reads as verse until it is asked for. */
  .versrich{display:none;padding-bottom:8px}
  body.text-play .versrich{display:block}
  body.text-play #verseText{display:none}
  /* On a path slide the same box carries the folds that hang under a verse —
     the Sudha Nidhi's ব্যাখ্যা and শব্দার্থ. Keyed on the box HAVING something
     in it, so a verse with no meaning written yet needs no bookkeeping and
     cannot leave an empty rule of gold behind. */
  body.path-play .versrich:not(:empty){display:block}
  .versrich .versetext{margin:0 0 4px}
  .vnote{font-size:13px;color:var(--muted);text-align:center;margin:2px 0 10px}
  .vcolo{font-size:12.5px;color:var(--gold);text-align:center;margin:14px 0 4px;
    letter-spacing:.3px}
  .gloss{margin:2px 0 18px}
  .gloss summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
    justify-content:center;font-size:12px;letter-spacing:.5px;color:var(--muted);
    padding:5px 0}
  .gloss summary::-webkit-details-marker{display:none}
  .gloss summary::before{content:"›";display:inline-block;font-size:15px;line-height:1;
    transition:transform .15s;color:var(--gold)}
  .gloss[open] summary::before{transform:rotate(90deg)}
  .gloss summary:active{color:var(--gold)}
  /* A meaning that is NEVER folded. It belongs to the same chunk as the verse
     it explains, so it carries the same body styling as a fold's — only its
     heading is a label rather than something to press. */
  .gopen{margin:2px 0 18px}
  .gopen .ghead{display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12px;letter-spacing:.5px;color:var(--muted);padding:5px 0}
  /* The meaning is read, not consulted: it carries the SAME size as the verse
     it explains — `--verse-size`, so A+ / A- moves both together — and no rule
     down its left, which was furniture the verse itself does not wear. It stays
     left-aligned prose against the centred verse, and a shade quieter. */
  .gbody{font-size:var(--verse-size,18px);line-height:1.85;color:var(--muted);
    text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;
    padding:2px 0;margin:2px 4px 0}
  /* the same furniture as a path slide, minus everything that is about sound */
  body.text-play .disc,body.text-play .now-folder,body.text-play #seek,
  body.text-play .player>.times,body.text-play .transport,
  body.text-play .chainline{display:none}
  body.text-play .versewrap{display:flex}
  body.text-play .rbar{display:flex}
  body.text-play .now-name{order:-1;font-size:15px;color:var(--muted);font-weight:600;
    letter-spacing:.3px;margin:0 0 10px}
  body.text-play #rbAudio,body.text-play #rbPlay{display:none}
  /* the fold-everything button belongs to whatever has folds: every section of
     सेवक वाणी, and the verses of the Sudha Nidhi that have their meaning */
  #rbGloss{display:none}
  body.text-play #rbGloss,body.glossable #rbGloss{display:grid}
  /* On a verse the play button is the middle of the bar, three a side. A verse
     with no meaning offers no book, but its place is kept, or play would slide
     half a button left every time the page turned past shloka 90. */
  body.path-play:not(.glossable) #rbGloss{display:grid;visibility:hidden}
  /* the picker lists sections by their titles, one to a row */
  .pick-grid.titles{grid-template-columns:1fr;gap:7px}
  .titles .pcell{aspect-ratio:auto;display:flex;align-items:center;gap:12px;
    padding:13px 14px;text-align:left;font-size:15px}
  .titles .pcell.on{font-weight:600}

  /* रसिक पदावली is a list of rows like every other list (user, 2026-10-11):
     its solid tiles covered the peacock on the ground. */

  /* The two slides that are not built yet. They hold their place in the grid
     so the layout is whole, but they are plainly not ready: no ink of their
     own, a dashed edge, and a quiet label. Tapping one says so and no more. */
  .tile.soon{background:rgba(247,241,228,.62);border-style:dashed;
    border-color:rgba(62,42,27,.2);box-shadow:none}
  .tile.soon::before{opacity:.45}
  .tile.soon .tile-art svg{color:#6B5B4B;opacity:.16}
  .tile.soon .tile-alpona svg{color:#6B5B4B;opacity:.09}
  .tile.soon .tile-hi{color:rgba(62,42,27,.58);text-shadow:none}
  .tile-soon{position:relative;margin-top:6px;font-size:10.5px;letter-spacing:.5px;
    color:rgba(62,42,27,.5);font-weight:600}

  /* ---------- the sittings a path is divided into ----------
     Leaves of the same paper as the home tiles, because they are the same
     kind of choice: which sitting am I taking up. The one holding the current
     position wears the gold edge — that is the whole of "where I am". */
  .stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px var(--pad) 0}
  .stile{position:relative;overflow:hidden;border-radius:16px;padding:15px 12px;
    min-height:112px;display:flex;flex-direction:column;justify-content:center;
    text-align:center;transition:transform .12s;
    background:color-mix(in srgb, var(--tint) 9%, #F7F1E4);
    border:1px solid rgba(62,42,27,.16);box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .stile:active{transform:scale(.975)}
  .stile::before{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 22% 0%,rgba(255,255,255,.85),transparent 64%)}
  .stile>*{position:relative}
  .stile.now{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset,0 1px 3px rgba(0,0,0,.35)}
  .sname{font-size:16px;font-weight:600;color:var(--ink);line-height:1.3}
  .srange{font-size:12.5px;color:rgba(62,42,27,.72);margin-top:5px;line-height:1.45}
  .scount{font-size:11px;color:rgba(62,42,27,.55);margin-top:5px;font-variant-numeric:tabular-nums;
    letter-spacing:.3px}
  .stile.wide{grid-column:1 / -1;min-height:0;padding:14px 12px}
  .snow{position:absolute;top:7px;right:9px;font-size:9.5px;letter-spacing:.4px;
    color:var(--gold);font-weight:600}

  /* ---------- the reader's own bar ----------
     On a path slide the words are the screen. The transport moves into a panel
     and this carries what a reader actually reaches for. */
  .rbar{display:none;align-items:center;justify-content:space-between;gap:2px;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  body.path-play .rbar{display:flex}
  /* The reader's alpona: the page's corner flourish in the four spaces the
     words leave, the top pair over the name and the arrow, the bottom pair
     standing on the bar's line (user, 2026-10-11). Fainter than on the lists,
     and z-index -1 inside the player's own layer, so it lies under the words. */
  .part{display:none;position:absolute;width:min(48vw,200px);aspect-ratio:1;
    color:var(--gold);opacity:.07;pointer-events:none;z-index:-1}
  body.path-play .part{display:block}
  .part.tl{top:env(safe-area-inset-top);left:0}
  .part.tr{top:env(safe-area-inset-top);right:0;transform:scaleX(-1)}
  .rbar{position:relative}
  .part.bl{bottom:100%;left:-24px;transform:scaleY(-1)}
  .part.br{bottom:100%;right:-24px;transform:scale(-1,-1)}
  body.path-play .disc,body.path-play .now-folder,body.path-play #seek,
  body.path-play .player>.times,body.path-play .transport,
  body.path-play .chainline{display:none}
  /* A READING is one file over thirty shlokas, so the seek bar and the clock
     come back. On a verse slide they are noise — the file IS the item and its
     length is that verse's. Here the sound runs for seventeen minutes while the
     words are turned by hand, and finding a place inside it is the one thing
     this reader needs that the other never does. */
  body.path-play.reading #seek{display:block}
  body.path-play.reading .player>.times{display:flex}
  /* the close row: the arrow; the script is chosen in Settings */
  .ptop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .scriptsel{font:inherit;font-size:15px;color:var(--text);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:6px 8px;max-width:50%}
  /* the item's own name reads better above the words than under them */
  body.path-play .now-name{order:-1;font-size:15px;color:var(--muted);font-weight:600;
    letter-spacing:.3px;margin:0 0 10px}
  .rb{flex:1 1 0;min-width:0;height:46px;border-radius:11px;display:grid;
    grid-auto-flow:column;gap:1px;place-items:center;align-content:center;
    color:var(--text);position:relative}
  .rb:active{background:var(--surface2)}
  .rb:disabled{color:var(--line)}
  .rb.on{color:var(--gold)}
  .rb .az{font-size:17px;font-weight:600;line-height:1}
  .rb .az.sm{font-size:13px}
  .rb .pm{font-size:11px;font-weight:600;margin-left:1px;vertical-align:top}

  /* ---------- item picker overlay ---------- */
  .pickov{position:fixed;inset:0;z-index:44;background:var(--bg);display:none;
    flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px
      calc(env(safe-area-inset-bottom) + 10px)}
  .pickov.on{display:flex}
  .pick-head{display:flex;align-items:center;gap:6px;padding:0 8px 8px;
    border-bottom:1px solid var(--line)}
  .pick-title{flex:1;font-size:16px;font-weight:600}
  /* `align-content:start` is load-bearing, not tidying. The grid is a flex
     item with a definite height, so auto rows STRETCH to fill it — and a short
     list has few rows, so they stretch a lot. The cells are `aspect-ratio:1/1`,
     which then derives their WIDTH from that stretched height, and `1fr` is
     `minmax(auto,1fr)`, so the columns grow to that width and the grid runs off
     the screen. Measured at 390px: 271 cells sat at 66px and fitted; 31 cells
     blew up to 102px and overflowed by 179px. `minmax(0,1fr)` cuts the same
     feedback at the column, and is kept as the belt to this brace. */
  .pick-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
    align-content:start;padding:12px 4px 4px}
  .pcell{aspect-ratio:1/1;border-radius:11px;background:var(--surface);
    border:1px solid var(--line);color:var(--text);font-size:15px;
    font-variant-numeric:tabular-nums;display:grid;place-items:center}
  .pcell:active{background:var(--surface2)}
  .pcell.bracket{border-style:dashed;color:var(--muted)}
  .pcell.on{border-color:var(--gold);color:var(--gold);font-weight:600;
    box-shadow:0 0 0 1px var(--gold) inset}

  /* ---------- audio panel ---------- */
  /* The panel is a control strip, not a page: the words keep the screen, so
     every row is one line and the whole thing stays around a third of it. */
  .apanel{padding:2px 0 calc(env(safe-area-inset-bottom) + 8px)}
  .apanel .grab{margin:4px auto 8px}
  /* elapsed · bar · total, on ONE line */
  .ap-seek{display:flex;align-items:center;gap:11px;padding:0 18px}
  .apanel .seek{flex:1;min-width:0;width:auto;margin:0;padding:0}
  .ap-t{flex:0 0 auto;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .ap-play{display:grid;place-items:center;margin:12px 0 2px}
  .apanel .big{width:58px;height:58px}
  .apanel .big svg{width:23px;height:23px}
  .speed{display:flex;align-items:center;gap:10px;padding:10px 18px 4px}
  .slabel{flex:1;font-size:14.5px;font-weight:600}
  .apanel .toggle{padding:9px 18px;gap:12px}
  .apanel .toggle .name{font-size:14.5px;font-weight:600}
  .apanel .toggle .sub{font-size:12px;margin-top:1px}
  .sbtn{width:34px;height:34px;flex:0 0 34px;border-radius:10px;border:1px solid var(--line);
    display:grid;place-items:center;font-size:18px;line-height:1;color:var(--text)}
  .sbtn:active{background:var(--surface2)}
  .sbtn:disabled{color:var(--line);border-color:var(--surface2)}
  .srate{min-width:52px;text-align:center;font-size:15.5px;font-variant-numeric:tabular-nums;
    color:var(--gold);font-weight:600}

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

  <!-- Krishna's flute, dressed: bound at its ends and joint, a scalloped fan

<script>

const FALLBACK={collections:[],rules:{aratiChainGapSeconds:10}};

/* ---------- db ---------- */

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open("baithak",1);

    if(!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs");
    /* How far into an item you had got. A SONG resumes there; a VERSE never
       does — see playTrack. v30 deleted this store outright and v31 put it back
       for the songs alone, which is why the rule lives next to every use of it. */
    if(!d.objectStoreNames.contains("marks")) d.createObjectStore("marks");
    if(!d.objectStoreNames.contains("meta"))  d.createObjectStore("meta");};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error);});
const put=(s,v,k)=>rq(st(s,"readwrite").put(v,k));
const get=(s,k)=>rq(st(s,"readonly").get(k));
const del=(s,k)=>rq(st(s,"readwrite").delete(k));

/* A whole store as one Map. The pickers are long — 86 pads, 91 verses in a
   group — and asking for each row's mark and duration one at a time is that
   many sequential round trips, which is visibly slow to paint on a phone.
   Two bulk reads answer the whole list instead. */
async function mapOf(s){
  const [k,v]=await Promise.all([rq(st(s,"readonly").getAllKeys()),
                                 rq(st(s,"readonly").getAll())]);
  const m=new Map(); k.forEach((kk,i)=>m.set(kk,v[i])); return m;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- state ---------- */
const S={man:FALLBACK,view:"home",cwd:"root",stack:[],coll:null,
  autoplay:true,queue:[],qi:-1,cur:null,target:null,
  pos:{},      // path id -> the next item to play      (persisted "pos:<id>")
  script:{},   // path id -> chosen script id           (persisted "script:<id>")
  text:{},     // "<pathId>:<scriptId>" -> rows | null  (fetched once)
  auto:{},     // path id -> carry on into the next one (persisted "auto:<id>")
  read:null,   // {id,n} while a text-only slide is open (सेवक वाणी)
  vpos:{},     // id -> {section: verse} — how far into each प्रकरण  ("vpos:<id>")
  rpos:{},     // path id -> {reading: shloka} — where the EYE is   ("rpos:<id>")
  gloss:false, // are the व्याख्या blocks open  (persisted "gloss")
  // Reading with the music off is a HABIT, not a property of a text: one flag
  // for the app, remembered across items, across sittings and across launches.
  // It STARTS silent — a book opens as words — and only an explicit play
  // gesture clears it: the bar's play, a tap on the words, the mini bar, the
  // phone's media keys. See setSilent().
  silent:true, // (persisted "silent")
  speed:1,     // playback rate 0.50–2.00               (persisted "speed")
  repeat:false,// repeat this item, holding the position(persisted "repeat")
  font:18,     // the words' size in px                 (persisted "fontsize")
  session:null // {pathId,items:[n,…],i}  while a session is running
};

/* ================================================================
   THE PATHS — श्री हित चौरासी जी and श्री मद् राधा सुधा निधि

   Both slides run on the same engine. One number per path says where it
   stands: `pos`, THE NEXT ITEM TO PLAY. It runs over the whole sequence —
   0 (the opening pad), 1…count (the body), and for the Chaurasi 85 (the
   closing pad) — not over the body alone. Everything else falls out of that:

     · The bracket needs no state. pos===0 means the opening pad has not been
       heard this cycle, so any session starting there opens with it. That is
       why resuming from pad 41 does not replay it: the bracket belongs to the
       cycle, and the cycle's progress IS pos.
     · A cycle ends by returning pos to 0 — never to 1. The user's rule:
       "every cycle opens with the praise pad, no matter how it was reached."
     · There is one sitting, एक साथ, the whole text. The भाग and उपभाग that
       once split it went on 2026-10-10 (the user): the tile on the home
       screen is एक साथ itself, and a tap opens the text where pos stands.
       The Sudha Nidhi's nine long recordings went with them, the same day —
       its reading engine is still here, with nothing that opens it.
   ================================================================ */

const isPath=c=>!!c&&c.mode==="path";
/* श्री हित सेवक वाणी: the same reader, with nothing to play. Its recordings are
   YouTube embeds in the original app and cannot be lifted, so the slide is the
   words alone — picker, size, the gloss, and the page turned at its edges. */
const isText=c=>!!c&&c.mode==="text";
const collById=id=>S.man.collections.find(c=>c.id===id)||null;
function scriptOf(c){const id=S.script[c.id];
  return c.scripts.find(s=>s.id===id)||c.scripts[0];}
function posOf(c){const p=S.pos[c.id];return typeof p==="number"?p:0;}
/* the final item of a cycle: the closing pad where there is one, else the body's end */
const lastIndex=c=>c.close?c.close.n:c.count;

async function loadText(c){
  const sc=scriptOf(c),key=c.id+":"+sc.id;
  if(key in S.text) return S.text[key];
  if(!sc.text){S.text[key]=null;return null;}   // nothing written yet — say so, don't fake it
  try{const r=await fetch(sc.text,{cache:"force-cache"});
      S.text[key]=r.ok?await r.json():null;}
  catch(e){S.text[key]=null;}
  return S.text[key];
}
/* rows are built so that index === item number: rows[n] is SHCJ<n> / SMRSNJ_<n> */
function rowFor(c,n){const rows=S.text[c.id+":"+scriptOf(c).id];return rows?rows[n]:null;}
function firstLine(c,n){const r=rowFor(c,n);if(!r)return "";
  const ln=r.t.split("\n").find(x=>x.trim());return ln?ln.trim():"";}
function bracketLabel(c,which){
  const sc=scriptOf(c),b=c[which];
  return (which==="open"?sc.openLabel:sc.closeLabel)||(b&&b.label)||"";}
function itemTitle(c,n){
  // the titles are in the manifest too, so a tile can name the section it
  // stands on without pulling the whole 400 KB of text first
  if(isText(c)){const r=rowFor(c,n);return r?r.title:((c.sections&&c.sections[n])||"");}
  if(c.open&&n===c.open.n) return bracketLabel(c,"open");
  if(c.close&&n===c.close.n) return bracketLabel(c,"close");
  return scriptOf(c).itemLabel+" "+n;}

/* ---------- the frame, in the script the text is read in ----------
   A path's furniture — एक साथ, यहीं, the name at the top — was written in
   Devanagari because both paths were Hindi. The Sudha Nidhi is read in Bengali,
   so the frame follows the verse: a manifest script entry may carry its own
   `title` and a `words` map, and whatever it does not carry falls back to the
   Devanagari below. सेवक वाणी carries neither, nor does चौरासी जी's Hindi; its
   Bengali (the default since 2026-10-10) carries both, as the Sudha Nidhi does.

   These are one screen's worth of words, not a translation layer — there is no
   locale here and nothing to negotiate with the browser. A text is read in the
   script it was written in, which the manifest already says. */
const WORDS={
  together:"एक साथ", here:"यहीं", start:"आरम्भ", reading:"पाठ",
  fromStart:"आरम्भ से", sessionDone:"सत्र पूर्ण"};
function W(c,k,vals){
  const sc=(c&&c.scripts)?scriptOf(c):null;
  let t=(sc&&sc.words&&sc.words[k])||WORDS[k];
  if(vals) for(const v in vals) t=t.split("{"+v+"}").join(vals[v]);
  return t;}
/* the face a collection's own frame wears — its verses' face where it has one */
const clsOf=c=>((c&&c.scripts)?(scriptOf(c).cls||"dv"):"dv");
/* the name it wears, in that same script */
const titleOf=c=>{const sc=(c&&c.scripts)?scriptOf(c):null;
  return (sc&&sc.title)||c.title;};

/* ---------- the readings: one long recording over thirty shlokas ----------

   A path item is one file and one verse, and the words can follow the sound
   because each file ends exactly where its verse does. A reading is the other
   shape: one recording carries thirty shlokas, nobody has timed the verses
   inside it, and no honest code can say which one is sounding. So here the
   sound and the words move SEPARATELY — the recording plays, the eye is turned
   by hand, and each keeps its own place: the track's in `marks`, exactly as a
   song's, and the eye's in `rpos:<id>`, one number per recording.

   `rpos` is deliberately NOT the path's `pos`. That pointer means "where I am
   in the text" and a sitting walks it forward as items finish; moving it from
   here would drag the भाग tiles' gold edge about while a recording ran, and
   nothing here has finished anything. */
const readingsOf=c=>Array.isArray(c.readings)?c.readings:[];
const readingId=(c,k)=>"rd:"+c.id+":"+k;
function rposOf(c,k){
  const r=readingsOf(c)[k]; if(!r)return 0;
  const v=(S.rpos[c.id]||{})[k];
  return (typeof v==="number"&&v>=r.from&&v<=r.to)?v:r.from;
}
async function saveRpos(c,k,n){
  const m=Object.assign({},S.rpos[c.id]||{});
  m[k]=n; S.rpos[c.id]=m; await put("meta",m,"rpos:"+c.id);
}

/* what a division covers, in words: "प्रशस्ति · पद 1–30" */
function rangeText(c,d){
  const sc=scriptOf(c),bits=[];let from=d.from,to=d.to;
  if(c.open&&from===c.open.n){bits.push(bracketLabel(c,"open"));from++;}
  let closes=false;
  if(c.close&&to===c.close.n){closes=true;to--;}
  if(to>=from) bits.push(from===to?sc.itemLabel+" "+from
                                  :sc.itemLabel+" "+from+"–"+to);
  if(closes) bits.push(bracketLabel(c,"close"));
  return bits.join(" · ");
}

/* auto-play is the path's own, not the library's — see the audio panel */
function autoOf(c){const a=S.auto[c.id];return a===undefined?true:!!a;}

/* THE COMPLETION RULE. A pad counts as done ONLY if it played through to its
   end — the `ended` event, nothing else. There is no time window and nothing
   to tune. Stopping part-way leaves pos where it is, and coming back begins that
   pad AGAIN, from its top: no mark is written for a path item, and none must be
   (songs are the other case — see playTrack).

   Do NOT reintroduce a near-the-end test here, and do not reach for a song's
   mark to hang one on: "nearly finished" is not finished. */
async function advance(c,n){
  const last=lastIndex(c);
  const next=(n>=last)?0:n+1;   // the cycle closes by parking at 0, the opening pad
  S.pos[c.id]=next;
  await put("meta",next,"pos:"+c.id);
}

async function playPath(c,n,raise,startPaused){
  clearChain();
  await loadText(c);
  if(startPaused===undefined) startPaused=S.silent;
  playTrack({id:"px:"+c.id+":"+n,name:itemTitle(c,n),url:c.audio.replace("{n}",n),
             path:c,n:n,kind:"path"},startPaused);
  // The words are the point of a path slide, so a deliberate start shows them
  // straight away instead of leaving them behind a tap on the mini bar. An
  // automatic advance mid-session passes no flag, so a player the user has
  // closed stays closed.
  if(raise) document.body.classList.add("player-open");
}
/* A session is the sitting read, and played to its end if it is played at all.
   If the path already stands inside it we resume there; if it stands elsewhere
   the position MOVES to its first item, so "where I am" stays honest. The tile
   inherits the silence habit — words only, unless you were listening when you
   left — and a sounding session runs on verse by verse for as long as the
   path's auto-play switch is on. With it off the sitting still exists, and
   still ends where it ends, but each verse waits for the page to be turned:
   the switch governs every automatic turn now, inside a sitting and out. */
async function startSession(c,d){
  let p=posOf(c);
  if(p<d.from||p>d.to){p=d.from;S.pos[c.id]=p;await put("meta",p,"pos:"+c.id);}
  const items=[];for(let n=p;n<=d.to;n++) items.push(n);
  S.session={pathId:c.id,items:items,i:0,from:d.from,to:d.to};
  // no setSilent here, either way: the tile INHERITS the habit. Left playing,
  // the next sitting plays; left silent, it opens as words. playPath defaults
  // startPaused to S.silent, so saying nothing is saying "as I left it".
  await playPath(c,items[0],true);
}
/* Long press: put the text back to its start and begin this sitting at its own
   first item. `pos` stays at 0, and advance() only moves it when the item that
   plays IS the item the path stands on, so nothing is pushed forward silently. */
async function restartPath(c,d){
  S.session=null;S.pos[c.id]=0;await put("meta",0,"pos:"+c.id);
  toast(W(c,"fromStart"));
  const items=[];for(let n=d.from;n<=d.to;n++) items.push(n);
  S.session={pathId:c.id,items:items,i:0,from:d.from,to:d.to};
  await playPath(c,d.from,true);        // inherits the habit, like every tile
}

/* Opening a reading: the recording from where it was left — its mark, exactly
   as a song's — and the words at the shloka the eye was left on. The two numbers
   are independent, which is the point of this reader. */
async function openReading(c,k){
  const r=readingsOf(c)[k]; if(!r)return;
  await loadText(c);
  S.session=null;                       // a reading is not a sitting of the path
  await playTrack({id:readingId(c,k),name:rangeText(c,{from:r.from,to:r.to}),
    url:r.file,coll:c,kind:"read",read:{c:c,k:k,from:r.from,to:r.to},
    n:rposOf(c,k)},S.silent);
  document.body.classList.add("player-open");
}
/* Long press, as everywhere else on a tile: both places back to the top — the
   recording at 0:00 and the eye on the first of its thirty. */
async function restartReading(c,k){
  const r=readingsOf(c)[k]; if(!r)return;
  await del("marks",readingId(c,k));
  await saveRpos(c,k,r.from);
  toast(W(c,"fromStart"));
  await openReading(c,k);
}
/* Moving the EYE, and nothing else. The audio element is not touched here — no
   src, no seek, no pause — which is the whole difference between this reader and
   the path's, where turning a verse IS loading the next file. */
async function seatReading(n){
  const t=S.cur; if(!t||!t.read)return;
  if(n<t.read.from||n>t.read.to)return;
  t.n=n;
  showVerse(t.read.c,n);
  $("nowName").textContent=itemTitle(t.read.c,n);
  await saveRpos(t.read.c,t.read.k,n);
  paintReader();
}

/* ---------- render ---------- */
/* ONE DRAWING AT A TIME, AND ONLY THE LAST ONE SHOWS.

   A drawing waits part-way — on a text's json, on the database — and render()
   is often called twice in a row: the home key closes the reader (which draws
   the slide it is leaving) and then draws the tiles. Both used to write into
   the live list, so the slow first one landed its sittings AFTER the second
   had cleared it, and the home page came up with the Sudha Nidhi's tiles
   stacked above it. So each drawing is built off-screen and put up whole, and
   only if no later render() has begun since; an older one finishing late is
   dropped. The builders below still just append to `L` — they need not know. */
let drawGen=0;
async function render(){
  syncHistory();                 // a view change is a layer opened or closed
  const gen=++drawGen, L=document.createElement("div");
  await draw(L);
  if(gen===drawGen) $("list").replaceChildren(...L.childNodes);
}
async function draw(L){
  $("backBtn").hidden = S.view==="home";
  // and the way home, which is wanted on every screen the tiles are not on.
  // A raised player over the home view shows it again, in CSS — the tiles are
  // covered there too, and the body class is what knows it.
  $("homeBtn").hidden = S.view==="home";
  $("fab").hidden = !(S.view==="library");

  if(S.view==="home"){
    setTitle("राधा","",true); await renderTiles(L); return;
  }
  if(S.view==="collection"){
    setTitle(titleOf(S.coll),S.coll.range||"",clsOf(S.coll)); await renderColl(S.coll,L); return;
  }
  if(S.stack.length) setTitle(S.stack[S.stack.length-1].name,
    "रसिक पदावली / "+S.stack.map(x=>x.name).join(" / "),false);
  else setTitle("रसिक पदावली","",true);
  await renderUser(L);
}
/* `face` is the class the name is set in — "dv", "bn", or true for Devanagari,
   which is what the fixed titles (राधा, रसिक पदावली) still pass. */
function setTitle(t,crumb,face){
  const p=$("pageTitle");
  p.firstChild.nodeValue=t;
  const cls=(face===true?"dv":face)||"";
  p.classList.toggle("dv",cls==="dv");
  p.classList.toggle("bn",cls==="bn");
  $("crumb").textContent=crumb;
}

// Which motif each tile wears. Keyed on the manifest's own ids, so a
// collection with no entry simply gets no motif rather than a broken one.
const TILE_MOTIF={
  "arati":"diya",
  "shcj":"flute", "padgayan":"feather",
  "rsn":"charan",
  "sevak-vani":"lotus",
  "padavali":"pothi"
};
// The lotus was asked for in pink; that pairing stays with सेवक वाणी. The
// flute, the feather and the feet are drawn in the आरती maroon (user,
// 2026-10-11), so their outlines match the diya's.
// Every tile name in Bengali letters (user, 2026-10-11). চৌরাসী জী is here too
// so its tile stays Bengali when its words are read in Hindi.
// Only the tile: a page's own title is unchanged.
const TILE_BN={"arati":"আরতি","shcj":"শ্রীহিত চৌরাসী জী","padgayan":"শ্রীহিত চৌরাসী পদ গায়ন",
  "sevak-vani":"শ্রীহিত সেবক বাণী","padavali":"রসিক পদাবলী"};
const TILE_INK={"sevak-vani":"#C2557A",
  "shcj":"#6E1F1F","padgayan":"#6E1F1F","rsn":"#6E1F1F"};

async function renderTiles(L){
  const grid=document.createElement("div"); grid.className="tiles";
  const libCount=(await kids("root")).length;
  for(const c of S.man.collections){
    const soon=c.mode==="soon";
    const t=document.createElement("button");
    t.className="tile"+(soon?" soon":"");
    t.style.setProperty("--tint", TILE_INK[c.id]||c.tint||"#8C5A28");
    const mk=TILE_MOTIF[c.id];
    if(mk) t.dataset.motif=mk;
    let sub="";
    if(soon) sub='<span class="tile-soon dv">शीघ्र</span>';
    else{
      // No line under a tile's name (user, 2026-10-11: where a text stands,
      // पद 12 / 84 and the like, is the reader's to show) — but an empty
      // library still says what it is for.
      const r=c.mode==="library"&&!libCount?"অপনে গীত":"";
      if(r) sub='<span class="tile-range '+(TILE_BN[c.id]?"bn":clsOf(c))+'"></span>';
      t.dataset.sub=r||"";
    }
    t.innerHTML='<span class="tile-alpona"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><use href="#m-alpona"/></svg></span>'+
      (mk?'<span class="tile-art"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#m-'+mk+'"/></svg></span>':'')+
      '<span class="tile-hi '+(TILE_BN[c.id]?"bn":clsOf(c))+'"></span>'+sub;
    t.querySelector(".tile-hi").textContent=TILE_BN[c.id]||titleOf(c);
    const rr=t.querySelector(".tile-range");
    if(rr) rr.textContent=t.dataset.sub;
    t.addEventListener("click",()=>openTile(c));
    // the long press its एक साथ tile had: the text back to its start
    if(isPath(c)){const all={from:0,to:lastIndex(c)};
      longPress(t,()=>openRestartSheet(c,W(c,"together"),rangeText(c,all),
        ()=>{S.coll=c;restartPath(c,all);}));}
    grid.appendChild(t);
  }
  L.appendChild(grid);
}

async function renderColl(c,L){
  if(!c.tracks||!c.tracks.length){L.innerHTML='<div class="empty"><b>No recordings yet</b>Add the files to audio/'+c.id+'/ in the repo.</div>';return;}
  const allMarks=await mapOf("marks"), allMeta=await mapOf("meta");
  for(let i=0;i<c.tracks.length;i++){
    const t=c.tracks[i], id=tid(c.id,t.file);
    const row=document.createElement("button");
    row.className="row"+(S.cur&&S.cur.id===id?" current":"");
    row.innerHTML='<span class="glyph">'+NOTE+'</span>';
    const meta=document.createElement("span"); meta.className="meta";
    const nm=document.createElement("span"); nm.className="name dv"; nm.textContent=t.title;
    meta.appendChild(nm);
    // `t.dur` is the manifest's own figure, so a recording that has never been
    // played still says how long it is — which is how the two पद गायन versions
    // are told apart before either has been opened
    const mark=tapMark(c,allMarks.get(id)), dur=allMeta.get("dur:"+id)||t.dur;
    const sub=document.createElement("span"); sub.className="sub";
    if(mark&&mark.pos>15) sub.innerHTML='<span class="mark">Resume '+fmt(mark.pos)+'</span>'+(dur?' · '+fmt(dur):'');
    else sub.textContent=dur?fmt(dur):"Tap to play";
    meta.appendChild(sub);
    if(mark&&dur&&mark.pos>15){const b=document.createElement("span");b.className="track-bar";
      const ii=document.createElement("i");ii.style.width=Math.min(100,mark.pos/dur*100)+"%";
      b.appendChild(ii);meta.appendChild(b);}
    row.appendChild(meta);
    row.addEventListener("click",()=>playFixed(c,i));
    longPress(row,()=>openItemSheet({kind:"fixed",id,name:t.title}));
    L.appendChild(row);
  }
}

/* one leaf of paper: a sitting, what it covers, and how many items that is */
function stile(c,name,range,count,now){
  const cls=clsOf(c);
  const t=document.createElement("button");
  t.className="stile"+(now?" now":"");
  t.style.setProperty("--tint",c.tint||"#8C5A28");
  t.innerHTML=(now?'<span class="snow '+cls+'"></span>':"")+
    '<span class="sname '+cls+'"></span><span class="srange"></span><span class="scount"></span>';
  if(now) t.querySelector(".snow").textContent=W(c,"here");
  t.querySelector(".sname").textContent=name;
  const r=t.querySelector(".srange");
  r.textContent=range; r.className="srange "+cls;
  t.querySelector(".scount").textContent=count;
  return t;
}

/* ================================================================
   THE READER — the bar under the words, and the two panels behind it

   On a path slide the words are the screen. A row of controls sits under them and
   everything else lives in a panel: the transport, the pace, and the two
   toggles a reciter changes mid-sitting.
   ================================================================ */

/* Silence is sticky, and it is the app's ONE memory of how you read. It starts
   on — a book opens as words — and every route into an item inherits it:
   a sitting tile, prev, next, a jump from the picker, and the next launch.

   What clears it is always the same thing: PLAY — the bar's play button, a tap
   on the words, the panel's play, the mini bar's play, the phone's own media
   keys. Any pause sets it again. So the last thing you did is what you get next
   time, on this item and on every item after it. */
async function setSilent(v){
  v=!!v; if(S.silent===v)return;
  S.silent=v; await put("meta",v,"silent");
}
function toggleAudio(){
  clearChain();
  if(audio.paused){ setSilent(false); audio.play().catch(()=>{}); }
  else { setSilent(true); audio.pause(); }
}

/* Moving the reader. `pos` follows, because pos is "where I am" and reading in
   silence to shloka 40 should leave me at 40 tomorrow. Completion is untouched:
   it is still the `ended` event, which cannot fire with nothing playing, so a
   silent walk ticks nothing off and moves no tile highlight. */
async function jumpTo(c,n){
  const s=S.session;
  if(s&&s.pathId===c.id&&n>=s.from&&n<=s.to){
    // still inside this sitting: re-seat it here and let it run to its own end
    s.items=[];for(let k=n;k<=s.to;k++)s.items.push(k);
    s.i=0;
  }
  else S.session=null;               // a move out of the sitting ends it
  S.pos[c.id]=n; await put("meta",n,"pos:"+c.id);
  await playPath(c,n,false,S.silent);
  render();
}
function readerStep(delta){
  const x=readerCtx(); if(!x)return;
  const n=x.n+delta;
  if(x.read){seatReading(n);return;}   // the eye moves; the recording does not
  if(n<0||n>lastIndex(x.c))return;
  x.text?openSection(x.c,n):jumpTo(x.c,n);
}

async function setFont(px){
  px=Math.max(FONT_MIN,Math.min(FONT_MAX,px));
  S.font=px;
  document.documentElement.style.setProperty("--verse-size",px+"px");
  await put("meta",px,"fontsize");
  paintReader();
}

/* The bar's own state: what is reachable from where the reader stands. */
function paintReader(){
  $("rbSmaller").disabled=S.font<=FONT_MIN;
  $("rbBigger").disabled=S.font>=FONT_MAX;
  $("rbAudio").classList.toggle("on",openSh===$("audioPanel"));
  $("rbGloss").classList.toggle("on",S.gloss);
  // the bar's play icon lives here rather than in paint(), so it is right from
  // the first frame of a slide — paint() does not run until metadata arrives
  $("rbPlay").innerHTML=audio.paused?RB_PLAY:RB_PAUSE;
}

/* The script the words are read in, for a path that has more than one — चौरासी
   जी in Bengali first and Hindi after (2026-10-10, the user). The frame follows
   the choice, as it does for the Sudha Nidhi: the name at the top, the पद
   label, the brackets. The choice is the path's own and is remembered. It is
   made in Settings, one row per such text, so the reader carries nothing but
   the words (user, 2026-10-11). */
function paintScriptRows(){
  const box=$("scriptRows"); box.innerHTML="";
  const cs=S.man.collections.filter(c=>c.scripts&&c.scripts.length>1);
  $("scriptHead").hidden=!cs.length;
  for(const c of cs){
    const row=document.createElement("div"); row.className="toggle";
    const meta=document.createElement("span"); meta.className="meta";
    const nm=document.createElement("span"); nm.className="name "+clsOf(c); nm.textContent=titleOf(c);
    meta.appendChild(nm); row.appendChild(meta);
    const sel=document.createElement("select"); sel.className="scriptsel"; sel.setAttribute("aria-label","Script");
    for(const sc of c.scripts){const o=document.createElement("option");
      o.value=sc.id;o.textContent=sc.label;sel.appendChild(o);}
    sel.value=scriptOf(c).id;
    sel.addEventListener("change",async e=>{await setScript(c,e.target.value);paintScriptRows();});
    row.appendChild(sel); box.appendChild(row);
  }
}
async function setScript(c,id){
  S.script[c.id]=id; await put("meta",id,"script:"+c.id);
  await loadText(c);
  const t=S.cur;
  if(t&&t.path===c){t.name=itemTitle(c,t.n); paintNames(t); showVerse(c,t.n); mediaMeta(t);}
  render(); paintReader();
}

/* ---------- a text-only section ----------
   One section fills the reader: its verses in order, each with its own व्याख्या
   folded underneath. The fold is per verse, and the bar's own button opens or
   closes every one of them at once — that choice is remembered. */
/* A प्रकरण is one item but many verses — twenty-three in भक्त-भजन — so the
   section alone is not "where I am". Each verse is tagged, the one at the top of
   the screen is remembered as you read, and reopening puts it back there. */
function versesIn(){return $("verseRich").querySelectorAll(".versetext");}
function verseAt(){
  const vs=$("verseScroll"),base=vs.getBoundingClientRect().top+56,all=versesIn();
  let k=0;
  for(let i=0;i<all.length;i++) if(all[i].getBoundingClientRect().top<=base) k=i;
  return k;
}
function scrollToVerse(k){
  const vs=$("verseScroll"),all=versesIn();
  if(k>0&&all[k])
    vs.scrollTop+=all[k].getBoundingClientRect().top-vs.getBoundingClientRect().top-10;
}
function vposOf(c,n){const m=S.vpos[c.id];const k=m&&m[n];return typeof k==="number"?k:0;}
async function setVpos(c,n,k){
  const m=Object.assign({},S.vpos[c.id]||{});
  if(m[n]===k)return;
  m[n]=k; S.vpos[c.id]=m; await put("meta",m,"vpos:"+c.id);
}
function paintWhere(c,n){
  const all=versesIn(),k=verseAt();
  $("nowName").textContent=itemTitle(c,n)+(all.length>1?"  ·  "+(k+1)+"/"+all.length:"");
}
/* One fold. Sevak Vani has one kind and names it in the code; the Sudha Nidhi
   has two and carries their names in the text, because they are Bengali and the
   face they need is not the one a Devanagari heading needs. */
/* The same meaning, shown outright. Which heading gets this is the script's
   own `openGloss` in the manifest — never a heading hardcoded here, which is
   the mistake `glossFold` was factored out of. */
function glossOpen(label,body,cls){
  const d=document.createElement("div"); d.className="gopen";
  const h=document.createElement("div"); h.className="ghead "+cls; h.textContent=label;
  const bd=document.createElement("div"); bd.className="gbody "+cls; bd.textContent=body;
  d.appendChild(h); d.appendChild(bd); return d;
}
function glossFold(label,body,cls){
  const d=document.createElement("details"); d.className="gloss"; d.open=S.gloss;
  const sm=document.createElement("summary"); sm.className=cls; sm.textContent=label;
  const bd=document.createElement("div"); bd.className="gbody "+cls; bd.textContent=body;
  d.appendChild(sm); d.appendChild(bd); return d;
}
function showSection(c,n){
  const box=$("verseRich"),row=rowFor(c,n);
  box.innerHTML=""; $("verseScroll").scrollTop=0;
  if(!row){box.textContent="";return;}
  for(const [k,t] of row.b){
    if(k==="c"){
      box.appendChild(glossFold("व्याख्या",t,"dv"));
    }else{
      const el=document.createElement(k==="v"?"p":"div");
      el.className=k==="v"?"versetext dv":(k==="k"?"vcolo dv":"vnote dv");
      // a wrapped line must not leave its danda stranded, as on the path slides
      el.textContent=k==="v"?t.replace(/ +([।॥])/g,"\u00A0$1"):t;
      box.appendChild(el);
    }
  }
  // back to the verse this प्रकरण was left on. Twice: once now, and once when
  // the Devanagari face has loaded, because that shifts every offset.
  const goto=()=>{ scrollToVerse(vposOf(c,n)); paintWhere(c,n); };
  goto();
  requestAnimationFrame(goto);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(goto);
}
async function openSection(c,n,raise){
  await loadText(c);
  S.read={id:c.id,n:n};
  S.pos[c.id]=n; await put("meta",n,"pos:"+c.id);
  document.body.classList.remove("path-play");
  document.body.classList.add("text-play");
  $("nowName").className="now-name dv";
  showSection(c,n);
  if(raise) document.body.classList.add("player-open");
  paintReader(); render();
}
/* Coming out of a slide leaves silence behind it.

   Both ways out land here — the phone's back press, through closeLayer(), and
   the player's own ✕ — because in this model they close the same layer, and a
   recitation that follows you out to the tiles is the complaint either way. A
   chain waiting to start the next आरती is dropped too: a countdown that fires
   after you have gone is the same thing arriving ten seconds late.

   What this does NOT do is set the silence habit. Leaving a screen is not the
   same gesture as choosing to read without the music, so the next sitting still
   opens as you left this one — and the mini bar keeps the item, so its play
   button carries on from here. The mark is written by the `pause` listener,
   which is why the place is kept without a word being said about it. */
function closeReader(){
  document.body.classList.remove("player-open");
  clearChain();
  if(!audio.paused) audio.pause();
  if(S.read){S.read=null;document.body.classList.remove("text-play");}
  // and render whatever is behind, always. The pause above has just written a
  // mark, and the screen you are landing back on is the one that SHOWS it: a
  // recording's tile offers "Resume 8:42" the moment you leave it, instead of
  // still saying 16:52 until something else happens to redraw. It also clears
  // the gold edge from a reading that is no longer open.
  render();
}
async function setGloss(v){
  S.gloss=!!v; await put("meta",S.gloss,"gloss");
  const k=verseAt();
  for(const d of $("verseRich").querySelectorAll("details.gloss")) d.open=S.gloss;
  // hold the verse you were on: opening every gloss would otherwise push it
  // hundreds of pixels down the page
  scrollToVerse(k);
  if(S.read){const c=collById(S.read.id); if(c) paintWhere(c,S.read.n);}
  paintReader();
}

/* Where the reader stands, whichever kind of slide it is. */
function readerCtx(){
  if(S.read){const c=collById(S.read.id);return c?{c:c,n:S.read.n,text:true}:null;}
  const t=S.cur;
  // a reading carries its own bounds, and the bar reads them off `x.read`
  if(t&&t.read) return {c:t.read.c,n:t.n,text:false,read:t.read};
  return t&&t.path?{c:t.path,n:t.n,text:false}:null;
}

/* ---------- the item picker ----------

   What it may show is the SITTING you are in, and nothing beyond it. The one
   sitting is एक साथ, the whole text, so it offers every pad — and with no
   sitting running (one finished, or the app was reopened) it is the whole
   text all the same. */
function pickScope(c,n){
  const s=S.session;
  if(s&&s.pathId===c.id&&typeof s.from==="number") return {from:s.from,to:s.to};
  return {from:0,to:lastIndex(c)};
}
function openPicker(){
  const x=readerCtx(); if(!x)return;
  if(x.text) return openTitlePicker(x.c,x.n);
  // inside a reading the scope is the recording itself — the thirty shlokas it
  // covers — because those are the ones the sound in the room is going through
  const t=S.cur,c=x.c,sp=x.read?{from:x.read.from,to:x.read.to}:pickScope(c,t.n);
  const ttl=$("pickTitle");
  ttl.textContent=rangeText(c,sp);
  ttl.className="pick-title "+(scriptOf(c).cls||"dv");
  const g=$("pickGrid"); g.className="pick-grid"; g.innerHTML=""; let here=null;
  for(let n=sp.from;n<=sp.to;n++){
    const isOpen=!!(c.open&&n===c.open.n),isClose=!!(c.close&&n===c.close.n);
    const b=document.createElement("button");
    b.className="pcell"+((isOpen||isClose)?" bracket":"")+(n===t.n?" on":"");
    // The brackets carry no item number — 85 is not the eighty-fifth pad — so
    // they wear a danda instead of a number that would lie.
    b.textContent=(isOpen||isClose)?"॥":String(n);
    b.setAttribute("aria-label",itemTitle(c,n));
    b.addEventListener("click",()=>{hidePicker();x.read?seatReading(n):jumpTo(c,n);});
    if(n===t.n)here=b;
    g.appendChild(b);
  }
  $("pickOv").classList.add("on");
  if(here)here.scrollIntoView({block:"center"});
}
/* सेवक वाणी has no numbers to offer — प्रकरण 7 means nothing, "श्रीहित रस-रीति"
   means everything — so its picker lists the eighteen sections by name. */
function openTitlePicker(c,cur){
  $("pickTitle").textContent=c.title;
  $("pickTitle").className="pick-title dv";
  const g=$("pickGrid"); g.className="pick-grid titles"; g.innerHTML=""; let here=null;
  for(let n=0;n<=lastIndex(c);n++){
    const b=document.createElement("button");
    b.className="pcell"+(n===cur?" on":"");
    // the titles carry their own numbering — 1. श्रीहित जस विलास — so a chip
    // beside them would only say it twice
    const nm=document.createElement("span"); nm.className="dv"; nm.textContent=itemTitle(c,n);
    b.appendChild(nm);
    b.addEventListener("click",()=>{hidePicker();openSection(c,n);});
    if(n===cur)here=b;
    g.appendChild(b);
  }
  $("pickOv").classList.add("on");
  if(here)here.scrollIntoView({block:"center"});
}
function hidePicker(){$("pickOv").classList.remove("on");}
const pickerOpen=()=>$("pickOv").classList.contains("on");

/* Reading IS the gesture that moves the place, so the scroll records it —
   settled, not on every frame, and only on a text slide. */
let vT=null;
$("verseScroll").addEventListener("scroll",()=>{
  if(!S.read)return;
  const c=collById(S.read.id); if(!c)return;
  paintWhere(c,S.read.n);
  clearTimeout(vT);
  vT=setTimeout(()=>setVpos(c,S.read.n,verseAt()),400);
},{passive:true});

/* ---------- the audio panel ---------- */
function paintPanel(){
  const d=audio.duration||0,c=audio.currentTime||0;
  $("apCur").textContent=fmtHMS(c);
  $("apDur").textContent=fmtHMS(d);
  const s=$("apSeek");
  if(!s.dragging) s.value=d?Math.round(c/d*1000):0;
  s.style.setProperty("--fill",(d?c/d*100:0)+"%");
  $("apPlay").innerHTML=audio.paused?PLAY:PAUSE;
  $("apRate").textContent=S.speed.toFixed(2);
  $("apSlower").disabled=S.speed<=SPD_MIN+1e-9;
  $("apFaster").disabled=S.speed>=SPD_MAX-1e-9;
  $("apRepeatSw").classList.toggle("on",S.repeat);
  const c2=S.cur&&S.cur.path;
  $("apAutoSw").classList.toggle("on",c2?autoOf(c2):false);
}
async function setSpeed(v){
  v=Math.round(Math.max(SPD_MIN,Math.min(SPD_MAX,v))*100)/100;
  S.speed=v; audio.playbackRate=v;
  await put("meta",v,"speed"); paintPanel();
}
async function setRepeat(v){
  S.repeat=!!v; await put("meta",S.repeat,"repeat"); paintPanel();
}
async function setAuto(c,v){
  S.auto[c.id]=!!v; await put("meta",!!v,"auto:"+c.id); paintPanel();
}

/* ---------- keeping a text on the phone ----------
   The worker caches a file when it is PLAYED, which is right for reading one
   verse at a time and useless for a journey: a text nobody has listened through
   is simply not there when the network is. These rows hand the worker the whole
   list at once and then count what has landed.

   The count is read from the cache itself, never from a running total: a fill
   that was interrupted, a phone that was cleared, a file already there from
   playback — all of it shows up correctly because the cache is the truth. */
const absUrl=u=>new URL(u,location.href).href;
function audioUrls(c){
  if(c.tracks) return c.tracks.map(t=>t.file);
  if(!c.audio) return [];
  const out=[]; for(let n=0;n<=lastIndex(c);n++) out.push(c.audio.replace("{n}",n));
  // The long readings belong to the text as much as its verses do: "keep this on
  // my phone" means the journey, and a journey is exactly what they are for.
  for(const r of readingsOf(c)) out.push(r.file);
  return out;
}
/* The worker owns the cache's name — it carries AUDIO_VERSION, which only sw.js
   may decide. So find it by its prefix rather than spelling a version here. */
async function audioCache(){
  if(!window.caches)return null;
  const ks=await caches.keys();
  const n=ks.find(k=>k.indexOf("radha-audio-")===0);
  return n?await caches.open(n):null;
}
async function cachedSet(){
  const c=await audioCache(); if(!c) return new Set();
  return new Set((await c.keys()).map(r=>r.url));
}
let offTimer=null,offBusy=null;   // the poll, and which collection is downloading
function stopOfflinePoll(){if(offTimer){clearInterval(offTimer);offTimer=null;}}
async function paintOffline(){
  const box=$("offRows"); if(!box)return;
  const have=await cachedSet();
  box.innerHTML="";
  for(const c of S.man.collections){
    const urls=audioUrls(c); if(!urls.length)continue;
    const n=urls.filter(u=>have.has(absUrl(u))).length, all=n===urls.length;
    const row=document.createElement("div"); row.className="toggle";
    row.innerHTML='<span class="meta"><span class="name '+clsOf(c)+'"></span>'+
                  '<span class="sub"></span></span>';
    row.querySelector(".name").textContent=titleOf(c);
    const sub=row.querySelector(".sub");
    sub.textContent=all?("On this phone  ·  "+(c.bytes?bytes(c.bytes):urls.length+" files"))
      :(n?n+" of "+urls.length+" here":urls.length+" recordings")+
       (c.bytes?"  ·  "+bytes(c.bytes):"");
    const b=document.createElement("button"); b.className="offbtn"+(all?" on":"");
    b.textContent=all?"Remove":(offBusy===c.id?"Stop":"Download");
    b.addEventListener("click",()=>all?removeOffline(c):
                                 offBusy===c.id?stopOffline():startOffline(c,urls));
    row.appendChild(b);
    box.appendChild(row);
  }
}
function startOffline(c,urls){
  const sw=navigator.serviceWorker;
  if(!sw||!sw.controller){toast("Open the app once more, then try — the worker is still starting.");return;}
  offBusy=c.id;
  sw.controller.postMessage({type:"fill",urls:urls.map(absUrl)});
  toast("Downloading "+titleOf(c));
  stopOfflinePoll(); offTimer=setInterval(paintOffline,2500);
  paintOffline();
}
function stopOffline(){
  const sw=navigator.serviceWorker;
  if(sw&&sw.controller) sw.controller.postMessage({type:"stopFill"});
  offBusy=null; stopOfflinePoll(); paintOffline();
}
async function removeOffline(c){
  if(!confirm("Remove “"+titleOf(c)+"” from this phone? It will play again when the app can reach the network."))return;
  const cache=await audioCache(); if(!cache)return;
  for(const u of audioUrls(c)) await cache.delete(absUrl(u));
  if(offBusy===c.id) stopOffline();
  toast("Removed"); paintOffline();
}
/* The worker speaks when a file lands or the disk says no. */
if(navigator.serviceWorker) navigator.serviceWorker.addEventListener("message",e=>{
  const d=e.data||{};
  if(d.type!=="fillState")return;
  if(d.outOfSpace){offBusy=null;stopOfflinePoll();toast("No room left on this phone.");}
  else if(!d.left) offBusy=null;
  if(openSh===$("setSheet")) paintOffline();
});

/* ---------- रसिक पदावली ---------- */
async function renderUser(L){
  const list=await kids(S.cwd);
  list.sort((a,b)=>a.type!==b.type?(a.type==="folder"?-1:1)
    :a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));
  if(!list.length){const e=document.createElement("div");e.className="empty";
    e.innerHTML='<b class="dv">अभी कुछ नहीं</b>Tap + to make a folder or add songs.';L.appendChild(e);return;}
  const allMarks=await mapOf("marks");
  for(const n of list){
    const t=document.createElement("button");
    t.className="row"+(S.cur&&S.cur.id===n.id?" current":"");
    t.innerHTML='<span class="glyph">'+(n.type==="folder"?FOLDER:NOTE)+'</span>'+
      '<span class="meta"><span class="name"></span><span class="sub"></span></span>';
    t.querySelector(".name").textContent=n.name;
    const sub=t.querySelector(".sub");
    if(n.type==="folder"){
      const k=(await kids(n.id)).length;
      sub.textContent=k?k+" item"+(k>1?"s":""):"empty";
    }else{
      const mark=allMarks.get(n.id);
      if(mark&&mark.pos>15){
        sub.innerHTML='<span class="mark">Resume '+fmt(mark.pos)+'</span>';
        if(n.duration){const b=document.createElement("span");b.className="track-bar";
          const ii=document.createElement("i");ii.style.width=Math.min(100,mark.pos/n.duration*100)+"%";
          b.appendChild(ii);t.querySelector(".meta").appendChild(b);}
      } else sub.textContent=n.duration?fmt(n.duration):bytes(n.size);
    }
    t.addEventListener("click",()=>{
      if(n.type==="folder"){S.stack.push({id:n.id,name:n.name});S.cwd=n.id;$("list").scrollTop=0;render();return;}
      const files=list.filter(x=>x.type==="file");
      S.queue=files.map(f=>({id:f.id,name:f.name,blobId:f.id,node:f,kind:"user"}));
      S.qi=files.indexOf(n); playTrack(S.queue[S.qi]);
    });
    longPress(t,()=>openItemSheet({kind:"user",id:n.id,name:n.name,node:n}));
    L.appendChild(t);
  }
}

/* ---------- opening ---------- */
const tid=(c,f)=>"fx:"+c+":"+f;
async function openTile(c){
  if(c.mode==="soon"){
    $("soonTitle").textContent=c.title;
    $("soonBody").textContent=c.soonNote||"अभी तैयार नहीं।";
    showSheet($("soonSheet")); return;
  }
  if(c.mode==="library"){S.view="library";S.cwd="root";S.stack=[];$("list").scrollTop=0;render();return;}
  if(isText(c)){S.coll=c; await openSection(c,posOf(c),true); return;}
  S.coll=c;
  // A path's tile IS its एक साथ: the walk through the whole text, opened where
  // the text stands, over the tiles — closing it comes straight home.
  if(isPath(c)){await startSession(c,{from:0,to:lastIndex(c)}); return;}
  S.view="collection";
  $("list").scrollTop=0; render();
}
function goBack(){
  if(S.view==="collection"){S.view="home";S.coll=null;render();return;}
  if(S.view==="library"){
    if(S.stack.length){S.stack.pop();S.cwd=S.stack.length?S.stack[S.stack.length-1].id:"root";render();}
    else{S.view="home";render();}
  }
}

/* HOME, in one tap, from wherever the screen has got to.

   Back closes exactly one layer, which is the right thing for a press of back.
   But a verse is three layers from the tiles — the player, the sub-list, the
   list — and pressing back three times to get out is the complaint this
   answers. So this closes them ALL, in the same order and through the same
   calls `closeLayer` makes one at a time, and then takes the views home in one
   step instead of one per level.

   It leaves silence behind it, because closeReader does: coming out of a slide
   has stopped the recitation since sw v37, and arriving at the tiles this way
   is the same leaving. One rule, however the screen was left.

   Nothing is done about the history here. render() calls syncHistory, which
   sees the screen standing at depth 0, hands back every entry in ONE traversal
   and leaves no dead presses above us — the same path a layer that closes
   itself already takes. */
function goHome(){
  hidePicker();
  hideSheets();
  closeReader();
  S.view="home"; S.coll=null; S.cwd="root"; S.stack=[];
  $("list").scrollTop=0;
  render();
}

/* ---------- playback ---------- */
let objUrl=null,saveAt=0,chainTimer=null,chainTick=null,waitLeft=0,hold=null;
let curSrc=null,retries=0,stallAt=-1,stallTicks=0;

function clearChain(){if(chainTimer){clearTimeout(chainTimer);chainTimer=null;}
  if(chainTick){clearInterval(chainTick);chainTick=null;}
  if(hold){hold.pause();hold=null;}      // a wait dropped is a silence stopped
  const was=waitLeft; waitLeft=0; $("chainLine").textContent="";
  if(was)paint();}                       // the bar goes back to saying the time

/* `secs` seconds of nothing, as a WAV the page makes for itself, in the आरती's
   OWN format — 44.1 kHz, 16-bit, stereo, every sample zero. It was 8 kHz 8-bit
   mono once, and the song came in distorted for its first moments (the user,
   2026-09-28, loudest on चंद्र मिटे, which is near full volume within a second).
   The mp3 decodes clean, so the likeliest cause is the phone running a
   telephone-grade stream beside the music one just as the song begins. In the
   song's own format there is nothing to convert and nothing to reconcile. A
   blob, so the worker never sees it and the audio cache never holds it. */
const quiet={};
function silence(secs){
  if(quiet[secs]) return quiet[secs];
